<div class="notification-container" id="notificationContainer"></div>

<style>
.notification-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 3000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 400px;
    width: 100%;
}
.notification-item {
    padding: 14px 20px;
    border-radius: var(--radius);
    background: var(--bg-card);
    box-shadow: var(--shadow-lg);
    border-left: 4px solid var(--primary);
    animation: slideInRight 0.3s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: var(--transition);
}
.notification-item:hover {
    box-shadow: var(--shadow-xl);
}
.notification-item.success { border-left-color: var(--success); }
.notification-item.error { border-left-color: var(--danger); }
.notification-item.warning { border-left-color: var(--warning); }
.notification-item.info { border-left-color: var(--info); }

.notification-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 2px;
}
.notification-content {
    flex: 1;
}
.notification-title {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 14px;
}
.notification-message {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
}
.notification-time {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 4px;
}
.notification-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    padding: 0 4px;
    flex-shrink: 0;
}
.notification-close:hover {
    color: var(--text-primary);
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
@keyframes slideOutRight {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}

@media (max-width: 480px) {
    .notification-container {
        left: 12px;
        right: 12px;
        top: 70px;
        max-width: none;
    }
}
</style>

<script>
const Notification = {
    show: function(message, type = 'info', title = '', duration = 4000) {
        const container = document.getElementById('notificationContainer');
        if (!container) return;
        
        const icons = {
            success: '✅',
            error: '❌',
            warning: '⚠️',
            info: 'ℹ️'
        };
        
        const titles = {
            success: title || '成功',
            error: title || '错误',
            warning: title || '警告',
            info: title || '提示'
        };
        
        const id = 'notif_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        
        const item = document.createElement('div');
        item.className = `notification-item ${type}`;
        item.id = id;
        item.innerHTML = `
            <span class="notification-icon">${icons[type] || 'ℹ️'}</span>
            <div class="notification-content">
                <div class="notification-title">${titles[type]}</div>
                <div class="notification-message">${message}</div>
                <div class="notification-time">${Utils.timeAgo(new Date())}</div>
            </div>
            <button class="notification-close" onclick="Notification.close('${id}')">✕</button>
        `;
        
        container.appendChild(item);
        
        // 自动关闭
        if (duration > 0) {
            setTimeout(() => {
                this.close(id);
            }, duration);
        }
        
        // 添加到通知存储
        const notifications = Storage.get('notifications') || [];
        notifications.push({
            id: id,
            type: type,
            title: titles[type],
            message: message,
            created_at: new Date().toISOString(),
            read: false
        });
        Storage.set('notifications', notifications);
        
        // 触发事件
        document.dispatchEvent(new CustomEvent('notificationAdded'));
        
        return id;
    },
    
    close: function(id) {
        const item = document.getElementById(id);
        if (item) {
            item.style.animation = 'slideOutRight 0.3s ease forwards';
            setTimeout(() => {
                item.remove();
            }, 300);
        }
    },
    
    closeAll: function() {
        const container = document.getElementById('notificationContainer');
        if (container) {
            container.innerHTML = '';
        }
    },
    
    success: function(message, title = '') {
        return this.show(message, 'success', title);
    },
    
    error: function(message, title = '') {
        return this.show(message, 'error', title);
    },
    
    warning: function(message, title = '') {
        return this.show(message, 'warning', title);
    },
    
    info: function(message, title = '') {
        return this.show(message, 'info', title);
    }
};

window.Notification = Notification;
</script>

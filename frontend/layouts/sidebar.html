     <style>
        /* ============================================================
           侧边栏样式
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            background: var(--bg-card, #ffffff);
            border-right: 1px solid var(--border-color, #e2e8f0);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
        }
    
        .theme-dark .sidebar {
            background: #1e293b;
            border-right-color: #334155;
        }
    
        /* 侧边栏头部 */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            min-height: 64px;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            flex-shrink: 0;
        }
    
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary, #0f172a);
        }
    
        .sidebar-brand-icon {
            font-size: 28px;
            line-height: 1;
        }
    
        .sidebar-brand-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    
        .sidebar-toggle-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary, #475569);
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
    
        .sidebar-toggle-btn:hover {
            background: var(--bg-hover, #f1f5f9);
        }
    
        /* 侧边栏搜索 */
        .sidebar-search {
            padding: 12px 16px;
            flex-shrink: 0;
        }
    
        .sidebar-search-input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: 8px;
            font-size: 13px;
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            transition: all 0.3s;
            outline: none;
        }
    
        .sidebar-search-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: var(--bg-card, #ffffff);
        }
    
        .sidebar-search-input::placeholder {
            color: var(--text-muted, #94a3b8);
        }
    
        /* 侧边栏导航 */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
        }
    
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
    
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border-color, #e2e8f0);
            border-radius: 2px;
        }
    
        .sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }
    
        .sidebar-nav .nav-section-title {
            padding: 8px 20px 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted, #94a3b8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    
        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
    
        .nav-item {
            margin: 1px 8px;
            border-radius: 8px;
            overflow: hidden;
        }
    
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--text-secondary, #475569);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }
    
        .nav-link:hover {
            background: var(--bg-hover, #f1f5f9);
            color: var(--text-primary, #0f172a);
        }
    
        .nav-link.active {
            background: rgba(79, 70, 229, 0.1);
            color: #4f46e5;
        }
    
        .theme-dark .nav-link.active {
            background: rgba(79, 70, 229, 0.2);
        }
    
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: #4f46e5;
            border-radius: 0 3px 3px 0;
        }
    
        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
    
        .nav-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    
        .nav-badge {
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
    
        .nav-link .nav-arrow {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            transition: transform 0.3s;
        }
    
        .nav-link.expanded .nav-arrow {

        }

            margin: 0;

        /**
         * 渲染菜单
         */
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (!container) return;
    
            let html = '';
    
            MENU_STRUCTURE.forEach((item, index) => {
                const hasChildren = item.children && item.children.length > 0;
                const currentPath = window.location.pathname;
                const isActive = currentPath === item.path || (hasChildren && item.children.some(c => currentPath === c.path));
    
                html += `<ul class="nav-list">`;
    
                // 主菜单项
                html += `
                    <li class="nav-item">
                        <a class="nav-link ${isActive ? 'active' : ''} ${hasChildren ? 'has-children' : ''}"
                           ${hasChildren ? `onclick="toggleSubMenu(this)"` : `href="${item.path}" onclick="navigate('${item.path}'); return false;"`}
                           data-target="sub_${item.id}">
                            <span class="nav-icon">${item.icon}</span>
                            <span class="nav-text">${item.name}</span>
                            ${hasChildren ? `<span class="nav-arrow">▶</span>` : ''}
                        </a>
                    </li>
                `;
    
                // 子菜单
                if (hasChildren) {
                    const isOpen = isActive || item.children.some(c => currentPath === c.path);
                    html += `
                        <ul class="sub-menu ${isOpen ? 'open' : ''}" id="sub_${item.id}">
                    `;
                    item.children.forEach(child => {
                        const isChildActive = currentPath === child.path;
                        html += `
                            <li class="nav-item">
                                <a class="nav-link ${isChildActive ? 'active' : ''}"
                                   href="${child.path}"
                                   onclick="navigate('${child.path}'); return false;">
                                    <span class="nav-icon" style="font-size:14px;">•</span>
                                    <span class="nav-text">${child.name}</span>
                                </a>
                            </li>
                        `;
                    });
                    html += `</ul>`;
                }
    
                html += `</ul>`;
            });
    
            container.innerHTML = html;
        }
    
        /**
         * 切换子菜单展开/折叠
         */
        function toggleSubMenu(element) {
            const targetId = element.dataset.target;
            const subMenu = document.getElementById(targetId);
            if (subMenu) {
                subMenu.classList.toggle('open');
                element.classList.toggle('expanded');
            }
        }
    
        /**
         * 搜索菜单过滤
         */
        function filterMenu(query) {
            query = query.toLowerCase().trim();
            const items = document.querySelectorAll('.nav-item');
    
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (query === '' || text.includes(query)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
    
            // 展开所有子菜单
            if (query !== '') {
                document.querySelectorAll('.sub-menu').forEach(el => {
                    el.classList.add('open');
                });
            }
        }
    
        /**
         * 切换侧边栏折叠
         */
        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
        }
    
        /**
         * 切换侧边栏（移动端）
         */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
        }
    
        /**
         * 更新用户信息
         */
        function updateSidebarUser() {
            const user = Auth && Auth.getCurrentUser ? Auth.getCurrentUser() : null;
            if (user) {
                const nameEl = document.getElementById('sidebarUserName');
                const roleEl = document.getElementById('sidebarUserRole');
                if (nameEl) nameEl.textContent = user.name || user.username || '用户';
                if (roleEl) roleEl.textContent = user.role || '普通用户';
            }
        }
    
        /**
         * 退出登录
         */
        function handleLogout() {
            if (confirm('确定要退出登录吗？')) {
                if (typeof Auth !== 'undefined' && Auth.logout) {
                    Auth.logout();
                } else {
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    
        // ============================================================
        // 初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderMenu();
            updateSidebarUser();
    
            // 恢复折叠状态
            const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
            if (isCollapsed) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
    
            // 点击遮罩关闭侧边栏
            document.getElementById('sidebarOverlay').addEventListener('click', function() {
                toggleSidebar();
            });
    
            // 键盘快捷键：Ctrl+Shift+S 切换侧边栏
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && e.key === 'S') {
                    e.preventDefault();
                    toggleSidebar();
                }
            });
        });
    
        // 监听模块加载完成，更新菜单高亮
        document.addEventListener('moduleLoaded', function() {
            renderMenu();
        });
    </script>

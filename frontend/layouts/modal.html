<div class="modal-container" id="modalContainer" style="display:none;">
    <div class="modal-overlay" onclick="Modal.close()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">标题</h3>
                <button class="modal-close" onclick="Modal.close()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                内容区域
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Modal.confirm()">确认</button>
            </div>
        </div>
    </div>
</div>

<style>
.modal-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-content {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: var(--shadow-xl);
    position: relative;
}
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
}
.modal-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    color: var(--text-primary);
}
.modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0 8px;
    line-height: 1;
}
.modal-close:hover {
    color: var(--text-primary);
}
.modal-body {
    padding: 4px 0;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
}
.modal-body h4 {
    color: var(--text-primary);
    margin: 12px 0 8px 0;
}
.modal-footer {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

@media (max-width: 768px) {
    .modal-content {
        padding: 16px;
        margin: 10px;
    }
    .modal-footer {
        flex-direction: column-reverse;
    }
    .modal-footer .btn {
        width: 100%;
        justify-content: center;
    }
}
</style>

<script>
const Modal = {
    onConfirm: null,
    onCancel: null,
    
    show: function(title, body, footer = null) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = body;
        
        if (footer) {
            document.getElementById('modalFooter').innerHTML = footer;
        } else {
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
                <button class="btn btn-primary" onclick="Modal.confirm()">确认</button>
            `;
        }
        
        document.getElementById('modalContainer').style.display = 'flex';
    },
    
    close: function() {
        document.getElementById('modalContainer').style.display = 'none';
        if (this.onCancel) {
            this.onCancel();
            this.onCancel = null;
        }
    },
    
    confirm: function() {
        if (this.onConfirm) {
            this.onConfirm();
            this.onConfirm = null;
        }
        this.close();
    },
    
    setConfirm: function(callback) {
        this.onConfirm = callback;
    },
    
    setCancel: function(callback) {
        this.onCancel = callback;
    }
};

window.Modal = Modal;
</script>

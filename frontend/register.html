<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Bai's ERP</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <h1>🚗 Bai's ERP</h1>
                <p>注册新账号</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
                </div>
                <div class="form-group">
                    <label for="fullName">姓名</label>
                    <input type="text" id="fullName" placeholder="请输入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="organizationName">组织名称</label>
                    <input type="text" id="organizationName" placeholder="请输入公司/组织名称" required>
                </div>
                <button type="submit" class="btn-primary btn-block">注册</button>
            </form>
            <div class="auth-footer">
                已有账号？<a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const fullName = document.getElementById('fullName').value;
            const organizationName = document.getElementById('organizationName').value;

            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            try {
                const result = await Auth.register(email, password, fullName, organizationName);
                if (result.success) {
                    alert('注册成功！请登录');
                    window.location.href = 'login.html';
                } else {
                    alert(result.error || '注册失败，请重试');
                }
            } catch (error) {
                alert('注册失败：' + error.message);
            }
        });
    </script>
</body>
</html>

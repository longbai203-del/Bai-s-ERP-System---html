<div class="module-container" data-module="fleet">
    <div class="module-header">
        <h2>🚗 车队管理</h2>
        <div class="module-actions">
            <button class="btn-primary" onclick="window.addVehicle()">+ 添加车辆</button>
            <button class="btn-refresh" onclick="window.initFleet()">🔄 刷新</button>
        </div>
    </div>
    <div class="module-content" id="moduleContent">
        <div id="fleet-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;">
            <div class="stat-card"><div class="stat-number" id="totalVehicles">0</div><div class="stat-label">总车辆</div></div>
            <div class="stat-card"><div class="stat-number" id="activeVehicles">0</div><div class="stat-label">运营中</div></div>
            <div class="stat-card"><div class="stat-number" id="maintenanceVehicles">0</div><div class="stat-label">维修中</div></div>
            <div class="stat-card"><div class="stat-number" id="inactiveVehicles">0</div><div class="stat-label">已停用</div></div>
        </div>
        <div id="fleet-list">
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <p>加载车辆中...</p>
            </div>
        </div>
    </div>
</div>

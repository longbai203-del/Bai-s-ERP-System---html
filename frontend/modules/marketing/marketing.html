<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营销管理 - Enterprise ERP</title>
</head>
<body>
    <div class="page marketing-page">
        <!-- ============================================================
        营销管理
        ============================================================ -->
        <div class="marketing-header">
            <div>
                <h1>📢 营销管理</h1>
                <p class="subtitle">管理营销活动、促销策略和客户忠诚度计划</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCreateCampaignModal()">＋ 创建活动</button>
                <button class="btn btn-outline" onclick="exportMarketing()">📥 导出</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📢</div>
                <div class="stat-info">
                    <div class="stat-label">总活动</div>
                    <div class="stat-value" id="totalCampaigns">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">进行中</div>
                    <div class="stat-value" id="activeCampaigns">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-info">
                    <div class="stat-label">转化率</div>
                    <div class="stat-value" id="campaignConversion">0%</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">ROI</div>
                    <div class="stat-value" id="campaignROI">0%</div>
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="left">
                <div class="search-box">
                    <span class="icon">🔍</span>
                    <input type="text" id="marketingSearch" placeholder="搜索活动名称..." oninput="filterMarketing()">
                </div>
                <select id="statusFilter" onchange="filterMarketing()" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="active">进行中</option>
                    <option value="scheduled">已计划</option>
                    <option value="completed">已完成</option>
                    <option value="paused">已暂停</option>
                </select>
                <select id="typeFilter" onchange="filterMarketing()" class="form-control">
                    <option value="all">全部类型</option>
                    <option value="promotion">促销</option>
                    <option value="loyalty">忠诚度</option>
                    <option value="referral">推荐</option>
                    <option value="campaign">活动</option>
                </select>
            </div>
            <div class="right">
                <span id="resultCount" style="color:var(--text-muted);font-size:13px;">共 0 条</span>
            </div>
        </div>

        <!-- 营销活动列表 -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>活动名称</th>
                        <th>类型</th>
                        <th>开始日期</th>
                        <th>结束日期</th>
                        <th>预算</th>
                        <th>参与人数</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="marketingBody">
                    <tr>
                        <td colspan="8" class="empty-state">暂无营销活动</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="marketingPagination">
            <div class="info">显示 <span id="pageStart">0</span>-<span id="pageEnd">0</span> 条，共 <span id="pageTotal">0</span> 条</div>
            <div class="buttons" id="pageButtons"></div>
        </div>
    </div>

    <!-- ============================================================
    营销活动模态框
    ============================================================ -->
    <div class="modal-overlay" id="marketingModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <div class="modal-title" id="marketingModalTitle">创建营销活动</div>
                <button class="modal-close" onclick="closeMarketingModal()">✕</button>
            </div>
            <form id="marketingForm" onsubmit="saveCampaign(event)">
                <input type="hidden" id="marketingEditId">
                <div class="form-group">
                    <label class="form-label required">活动名称</label>
                    <input type="text" class="form-control" id="campaignName" placeholder="请输入活动名称" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">活动类型</label>
                    <select class="form-control" id="campaignType" required>
                        <option value="promotion">促销活动</option>
                        <option value="loyalty">忠诚度计划</option>
                        <option value="referral">推荐活动</option>
                        <option value="campaign">营销活动</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label required">开始日期</label>
                    <input type="date" class="form-control" id="campaignStart" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">结束日期</label>
                    <input type="date" class="form-control" id="campaignEnd" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">预算</label>
                    <input type="number" class="form-control" id="campaignBudget" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">目标客户</label>
                    <input type="text" class="form-control" id="campaignTarget" placeholder="如：VIP客户、新客户等">
                </div>
                <div class="form-group">
                    <label class="form-label">描述</label>
                    <textarea class="form-control" id="campaignDescription" rows="2" placeholder="活动描述"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeMarketingModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存活动</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .marketing-page {
            padding: 0;
        }

        .marketing-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .marketing-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .marketing-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card .stat-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .toolbar .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-input, #f1f5f9);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0 14px;
            transition: all 0.3s;
            min-width: 200px;
            flex: 1;
            max-width: 300px;
        }

        .toolbar .search-box:focus-within {
            border-color: #4f46e5;
            background: var(--bg-card, #ffffff);
        }

        .toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-primary, #0f172a);
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .toolbar .search-box .icon {
            color: var(--text-muted, #94a3b8);
            margin-right: 10px;
        }

        .form-control {
            padding: 8px 14px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .table-container {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            overflow: hidden;
        }

        .table-container .table {
            margin: 0;
        }

        .table-container .table .actions {
            display: flex;
            gap: 6px;
        }

        .table-container .table .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }

        .table-container .table .actions .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .table-container .table .actions .btn-edit:hover {
            background: #3b82f6;
            color: #fff;
        }

        .table-container .table .actions .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .table-container .table .actions .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .table-container .table .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .table-container .table .status-badge.active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .table-container .table .status-badge.scheduled {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .table-container .table .status-badge.completed {
            background: rgba(148, 163, 184, 0.15);
            color: #64748b;
        }

        .table-container .table .status-badge.paused {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .table-container .table .type-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .table-container .table .type-badge.promotion {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .table-container .table .type-badge.loyalty {
            background: rgba(79, 70, 229, 0.1);
            color: #4f46e5;
        }

        .table-container .table .type-badge.referral {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .table-container .table .type-badge.campaign {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color, #e2e8f0);
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 13px;
            color: var(--text-secondary, #475569);
        }

        .pagination .buttons {
            display: flex;
            gap: 4px;
        }

        .pagination .buttons button {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary, #475569);
            transition: all 0.15s;
        }

        .pagination .buttons button:hover:not(:disabled) {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .pagination .buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .buttons button.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted, #94a3b8);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .marketing-header {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-box {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let marketingData = [];
        let filteredMarketing = [];
        let currentPage = 1;
        const pageSize = 10;

        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function setStorage(key, data) {
            try { localStorage.setItem('erp_' + key, JSON.stringify(data)); return true; } catch { return false; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        function initMarketing() {
            console.log('📢 营销管理初始化...');
            loadMarketing();
            updateMarketingStats();
            renderMarketing();
            console.log('✅ 营销管理初始化完成');
        }

        function loadMarketing() {
            let data = getStorage('marketing');
            if (!data || data.length === 0) {
                data = generateDemoCampaigns();
                setStorage('marketing', data);
            }
            marketingData = data;
            filteredMarketing = [...marketingData];
        }

        function generateDemoCampaigns() {
            const names = ['年中大促', '新客户优惠', 'VIP专属活动', '推荐有礼', '节日促销', '会员日特惠', '新品推广', '夏季促销'];
            const types = ['promotion', 'loyalty', 'referral', 'campaign'];
            const statuses = ['active', 'scheduled', 'completed', 'paused'];
            const campaigns = [];

            for (let i = 1; i <= 15; i++) {
                const start = new Date();
                start.setDate(start.getDate() + (i - 5) * 3);
                const end = new Date(start);
                end.setDate(end.getDate() + 14 + Math.floor(Math.random() * 10));

                campaigns.push({
                    id: i,
                    name: names[i % names.length] + (i + 1),
                    type: types[i % types.length],
                    start_date: start.toISOString().split('T')[0],
                    end_date: end.toISOString().split('T')[0],
                    budget: Math.round((Math.random() * 50000 + 5000) * 100) / 100,
                    target: ['VIP客户', '新客户', '所有客户', '活跃客户'][i % 4],
                    description: `营销活动 ${i}`,
                    status: statuses[i % statuses.length],
                    participants: Math.floor(Math.random() * 500 + 20),
                    conversion: Math.round((Math.random() * 30 + 5) * 10) / 10,
                    roi: Math.round((Math.random() * 200 + 50) * 10) / 10,
                    created_at: new Date().toISOString()
                });
            }
            return campaigns;
        }

        function updateMarketingStats() {
            const total = marketingData.length;
            const active = marketingData.filter(c => c.status === 'active').length;
            const avgConversion = marketingData.length > 0 ?
                marketingData.reduce((sum, c) => sum + (c.conversion || 0), 0) / marketingData.length : 0;
            const avgROI = marketingData.length > 0 ?
                marketingData.reduce((sum, c) => sum + (c.roi || 0), 0) / marketingData.length : 0;

            document.getElementById('totalCampaigns').textContent = total;
            document.getElementById('activeCampaigns').textContent = active;
            document.getElementById('campaignConversion').textContent = avgConversion.toFixed(1) + '%';
            document.getElementById('campaignROI').textContent = avgROI.toFixed(1) + '%';
        }

        function filterMarketing() {
            const search = document.getElementById('marketingSearch').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const type = document.getElementById('typeFilter').value;

            filteredMarketing = marketingData.filter(c => {
                let match = true;
                if (search) {
                    match = match && c.name.toLowerCase().includes(search);
                }
                if (status !== 'all') {
                    match = match && c.status === status;
                }
                if (type !== 'all') {
                    match = match && c.type === type;
                }
                return match;
            });

            currentPage = 1;
            renderMarketing();
        }

        function renderMarketing() {
            const tbody = document.getElementById('marketingBody');
            const total = filteredMarketing.length;
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredMarketing.slice(start, end);

            document.getElementById('resultCount').textContent = `共 ${total} 条`;
            document.getElementById('pageStart').textContent = total > 0 ? start + 1 : 0;
            document.getElementById('pageEnd').textContent = end;
            document.getElementById('pageTotal').textContent = total;

            const statusMap = {
                'active': { label: '进行中', class: 'active' },
                'scheduled': { label: '已计划', class: 'scheduled' },
                'completed': { label: '已完成', class: 'completed' },
                'paused': { label: '已暂停', class: 'paused' }
            };

            const typeMap = {
                'promotion': { label: '促销', class: 'promotion' },
                'loyalty': { label: '忠诚度', class: 'loyalty' },
                'referral': { label: '推荐', class: 'referral' },
                'campaign': { label: '活动', class: 'campaign' }
            };

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无营销活动</td></tr>';
                renderPagination(total);
                return;
            }

            tbody.innerHTML = pageData.map(c => `
                <tr>
                    <td><strong>${c.name}</strong></td>
                    <td><span class="type-badge ${typeMap[c.type]?.class || 'campaign'}">${typeMap[c.type]?.label || c.type}</span></td>
                    <td>${c.start_date}</td>
                    <td>${c.end_date}</td>
                    <td>¥${(c.budget || 0).toFixed(2)}</td>
                    <td>${c.participants || 0}</td>
                    <td><span class="status-badge ${statusMap[c.status]?.class || 'scheduled'}">${statusMap[c.status]?.label || c.status}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editCampaign(${c.id})">✏️</button>
                            <button class="btn-delete" onclick="deleteCampaign(${c.id})">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(total);
        }

        function renderPagination(total) {
            const container = document.getElementById('pageButtons');
            const totalPages = Math.ceil(total / pageSize);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html =
                `<button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) {
                startPage = Math.max(1, endPage - maxShow + 1);
            }
            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button disabled>...</button>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button disabled>...</button>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            html +=
                `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredMarketing.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderMarketing();
        }

        function showCreateCampaignModal() {
            document.getElementById('marketingModalTitle').textContent = '创建营销活动';
            document.getElementById('marketingEditId').value = '';
            document.getElementById('marketingForm').reset();
            document.getElementById('campaignStart').value = new Date().toISOString().split('T')[0];
            document.getElementById('campaignEnd').value = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split(
            'T')[0];
            document.getElementById('marketingModal').classList.add('show');
        }

        function editCampaign(id) {
            const campaign = marketingData.find(c => c.id === id);
            if (!campaign) { showToast('活动不存在', 'error'); return; }

            document.getElementById('marketingModalTitle').textContent = '编辑营销活动';
            document.getElementById('marketingEditId').value = id;
            document.getElementById('campaignName').value = campaign.name;
            document.getElementById('campaignType').value = campaign.type;
            document.getElementById('campaignStart').value = campaign.start_date;
            document.getElementById('campaignEnd').value = campaign.end_date;
            document.getElementById('campaignBudget').value = campaign.budget || 0;
            document.getElementById('campaignTarget').value = campaign.target || '';
            document.getElementById('campaignDescription').value = campaign.description || '';
            document.getElementById('marketingModal').classList.add('show');
        }

        function closeMarketingModal() {
            document.getElementById('marketingModal').classList.remove('show');
        }

        function saveCampaign(event) {
            event.preventDefault();

            const editId = document.getElementById('marketingEditId').value;
            const name = document.getElementById('campaignName').value.trim();
            const type = document.getElementById('campaignType').value;
            const startDate = document.getElementById('campaignStart').value;
            const endDate = document.getElementById('campaignEnd').value;
            const budget = parseFloat(document.getElementById('campaignBudget').value);
            const target = document.getElementById('campaignTarget').value.trim();
            const description = document.getElementById('campaignDescription').value.trim();

            if (!name) { showToast('请输入活动名称', 'warning'); return; }
            if (!startDate) { showToast('请选择开始日期', 'warning'); return; }
            if (!endDate) { showToast('请选择结束日期', 'warning'); return; }
            if (!budget || budget <= 0) { showToast('请输入有效预算', 'warning'); return; }

            // 判断状态
            const now = new Date().toISOString().split('T')[0];
            let status = 'scheduled';
            if (startDate <= now && endDate >= now) status = 'active';
            if (endDate < now) status = 'completed';

            if (editId) {
                const index = marketingData.findIndex(c => c.id === parseInt(editId));
                if (index === -1) { showToast('活动不存在', 'error'); return; }
                marketingData[index] = { ...marketingData[index], name, type, start_date: startDate, end_date: endDate,
                    budget, target, description, status };
                showToast('活动已更新', 'success');
            } else {
                const maxId = marketingData.reduce((max, c) => Math.max(max, c.id), 0);
                marketingData.push({
                    id: maxId + 1,
                    name,
                    type,
                    start_date: startDate,
                    end_date: endDate,
                    budget,
                    target,
                    description,
                    status,
                    participants: 0,
                    conversion: 0,
                    roi: 0,
                    created_at: new Date().toISOString()
                });
                showToast('活动已创建', 'success');
            }

            setStorage('marketing', marketingData);
            loadMarketing();
            updateMarketingStats();
            filterMarketing();
            closeMarketingModal();
        }

        function deleteCampaign(id) {
            if (!confirm(`确定要删除活动 ${id} 吗？`)) return;
            marketingData = marketingData.filter(c => c.id !== id);
            setStorage('marketing', marketingData);
            loadMarketing();
            updateMarketingStats();
            filterMarketing();
            showToast('活动已删除', 'success');
        }

        function exportMarketing() {
            if (filteredMarketing.length === 0) { showToast('没有数据可导出', 'warning'); return; }

            const exportData = filteredMarketing.map(c => ({
                '活动名称': c.name,
                '类型': c.type,
                '开始日期': c.start_date,
                '结束日期': c.end_date,
                '预算': c.budget || 0,
                '目标客户': c.target || '',
                '参与人数': c.participants || 0,
                '转化率': (c.conversion || 0) + '%',
                'ROI': (c.roi || 0) + '%',
                '状态': c.status,
                '描述': c.description || '',
                '创建时间': new Date(c.created_at).toLocaleString()
            }));

            const headers = Object.keys(exportData[0]);
            let csv = headers.join(',') + '\n';
            exportData.forEach(row => {
                csv += headers.map(h => row[h] || '').join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '营销数据_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('导出成功', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initMarketing, 100);
        });
    </script>
</body>
</html>

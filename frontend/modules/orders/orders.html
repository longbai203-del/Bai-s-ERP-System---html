<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - Enterprise ERP</title>
</head>
<body>
    <div class="page orders-page">
        <!-- ============================================================
        订单管理
        ============================================================ -->
        <div class="orders-header">
            <div>
                <h1>📋 订单管理</h1>
                <p class="subtitle">管理所有订单，查看订单详情和状态</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCreateOrderModal()">＋ 新建订单</button>
                <button class="btn btn-outline" onclick="exportOrders()">📥 导出</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="orderStats">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">总订单</div>
                    <div class="stat-value" id="totalOrders">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-info">
                    <div class="stat-label">待处理</div>
                    <div class="stat-value" id="pendingOrders">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="completedOrders">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">总金额</div>
                    <div class="stat-value" id="totalAmount">¥0</div>
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="left">
                <div class="search-box">
                    <span class="icon">🔍</span>
                    <input type="text" id="orderSearch" placeholder="搜索订单号、客户..." oninput="filterOrders()">
                </div>
                <select id="statusFilter" onchange="filterOrders()" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="pending">待处理</option>
                    <option value="processing">处理中</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>
            <div class="right">
                <span id="resultCount" style="color:var(--text-muted);font-size:13px;">共 0 条</span>
            </div>
        </div>

        <!-- 订单列表 -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>客户</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>支付方式</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr>
                        <td colspan="7" class="empty-state">暂无订单</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="orderPagination">
            <div class="info">显示 <span id="pageStart">0</span>-<span id="pageEnd">0</span> 条，共 <span id="pageTotal">0</span> 条</div>
            <div class="buttons" id="pageButtons"></div>
        </div>
    </div>

    <!-- ============================================================
    创建/编辑订单模态框
    ============================================================ -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content" style="max-width:600px;">
            <div class="modal-header">
                <div class="modal-title" id="orderModalTitle">新建订单</div>
                <button class="modal-close" onclick="closeOrderModal()">✕</button>
            </div>
            <form id="orderForm" onsubmit="saveOrder(event)">
                <input type="hidden" id="orderEditId">
                <div class="form-group">
                    <label class="form-label required">客户名称</label>
                    <input type="text" class="form-control" id="orderCustomer" placeholder="请输入客户名称" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">订单金额</label>
                    <input type="number" class="form-control" id="orderAmount" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">状态</label>
                    <select class="form-control" id="orderStatus" required>
                        <option value="pending">待处理</option>
                        <option value="processing">处理中</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">支付方式</label>
                    <select class="form-control" id="orderPayment">
                        <option value="cash">现金</option>
                        <option value="card">银行卡</option>
                        <option value="wechat">微信支付</option>
                        <option value="alipay">支付宝</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="orderNotes" rows="2" placeholder="请输入备注信息..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeOrderModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存订单</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        /* ============================================================
           订单管理样式
           ============================================================ */
        .orders-page {
            padding: 0;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .orders-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .orders-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card .stat-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .toolbar .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-input, #f1f5f9);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0 14px;
            transition: all 0.3s;
            min-width: 200px;
            flex: 1;
            max-width: 300px;
        }

        .toolbar .search-box:focus-within {
            border-color: #4f46e5;
            background: var(--bg-card, #ffffff);
        }

        .toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-primary, #0f172a);
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .toolbar .search-box .icon {
            color: var(--text-muted, #94a3b8);
            margin-right: 10px;
        }

        .form-control {
            padding: 8px 14px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .table-container {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            overflow: hidden;
        }

        .table-container .table {
            margin: 0;
        }

        .table-container .table .actions {
            display: flex;
            gap: 6px;
        }

        .table-container .table .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }

        .table-container .table .actions .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .table-container .table .actions .btn-edit:hover {
            background: #3b82f6;
            color: #fff;
        }

        .table-container .table .actions .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .table-container .table .actions .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .table-container .table .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .table-container .table .status-badge.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .table-container .table .status-badge.processing {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .table-container .table .status-badge.completed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .table-container .table .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color, #e2e8f0);
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 13px;
            color: var(--text-secondary, #475569);
        }

        .pagination .buttons {
            display: flex;
            gap: 4px;
        }

        .pagination .buttons button {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary, #475569);
            transition: all 0.15s;
        }

        .pagination .buttons button:hover:not(:disabled) {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .pagination .buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .buttons button.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted, #94a3b8);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .orders-header {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar .left {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar .search-box {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        /**
         * ============================================================
         * 订单管理 - 完整企业级实现
         * ============================================================
         */

        let ordersData = [];
        let filteredOrders = [];
        let currentPage = 1;
        const pageSize = 10;

        // ============================================================
        // 存储工具
        // ============================================================
        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function setStorage(key, data) {
            try { localStorage.setItem('erp_' + key, JSON.stringify(data)); return true; } catch { return false; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        // ============================================================
        // 初始化
        // ============================================================
        function initOrders() {
            console.log('📋 订单管理初始化...');
            loadOrders();
            updateOrderStats();
            renderOrders();
            console.log('✅ 订单管理初始化完成');
        }

        // ============================================================
        // 加载订单数据
        // ============================================================
        function loadOrders() {
            let data = getStorage('orders');
            if (!data || data.length === 0) {
                data = generateDemoOrders();
                setStorage('orders', data);
            }
            ordersData = data;
            filteredOrders = [...ordersData];
        }

        // ============================================================
        // 生成演示订单
        // ============================================================
        function generateDemoOrders() {
            const customers = ['张伟', '王芳', '李明', '刘洋', '陈静', '杨帆', '赵磊', '黄丽'];
            const statuses = ['pending', 'processing', 'completed', 'completed', 'completed', 'cancelled'];
            const payments = ['cash', 'card', 'wechat', 'alipay'];
            const orders = [];
            for (let i = 1; i <= 30; i++) {
                const date = new Date(Date.now() - Math.random() * 90 * 24 * 60 * 60 * 1000);
                orders.push({
                    id: 'ORD-' + String(i).padStart(6, '0'),
                    customer: customers[i % customers.length],
                    amount: Math.round((Math.random() * 3000 + 100) * 100) / 100,
                    status: statuses[i % statuses.length],
                    payment: payments[i % payments.length],
                    notes: i % 3 === 0 ? '备注信息 ' + i : '',
                    created_at: date.toISOString()
                });
            }
            orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            return orders;
        }

        // ============================================================
        // 更新统计
        // ============================================================
        function updateOrderStats() {
            const total = ordersData.length;
            const pending = ordersData.filter(o => o.status === 'pending' || o.status === 'processing').length;
            const completed = ordersData.filter(o => o.status === 'completed').length;
            const totalAmount = ordersData.reduce((sum, o) => sum + (o.amount || 0), 0);
            document.getElementById('totalOrders').textContent = total;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('completedOrders').textContent = completed;
            document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);
        }

        // ============================================================
        // 过滤订单
        // ============================================================
        function filterOrders() {
            const search = document.getElementById('orderSearch').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            filteredOrders = ordersData.filter(o => {
                let match = true;
                if (search) {
                    match = match && (o.id.toLowerCase().includes(search) || o.customer.toLowerCase().includes(search));
                }
                if (status !== 'all') {
                    match = match && o.status === status;
                }
                return match;
            });
            currentPage = 1;
            renderOrders();
        }

        // ============================================================
        // 渲染订单列表
        // ============================================================
        function renderOrders() {
            const tbody = document.getElementById('ordersBody');
            const total = filteredOrders.length;
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredOrders.slice(start, end);

            document.getElementById('resultCount').textContent = `共 ${total} 条`;
            document.getElementById('pageStart').textContent = total > 0 ? start + 1 : 0;
            document.getElementById('pageEnd').textContent = end;
            document.getElementById('pageTotal').textContent = total;

            const statusMap = {
                'pending': { label: '待处理', class: 'pending' },
                'processing': { label: '处理中', class: 'processing' },
                'completed': { label: '已完成', class: 'completed' },
                'cancelled': { label: '已取消', class: 'cancelled' }
            };
            const paymentMap = {
                'cash': '现金',
                'card': '银行卡',
                'wechat': '微信支付',
                'alipay': '支付宝'
            };

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无订单</td></tr>';
                renderPagination(total);
                return;
            }

            tbody.innerHTML = pageData.map(o => `
                <tr>
                    <td><strong>${o.id}</strong></td>
                    <td>${o.customer}</td>
                    <td><strong>¥${(o.amount || 0).toFixed(2)}</strong></td>
                    <td><span class="status-badge ${statusMap[o.status]?.class || 'pending'}">${statusMap[o.status]?.label || o.status}</span></td>
                    <td>${paymentMap[o.payment] || o.payment}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editOrder('${o.id}')">✏️</button>
                            <button class="btn-delete" onclick="deleteOrder('${o.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(total);
        }

        // ============================================================
        // 渲染分页
        // ============================================================
        function renderPagination(total) {
            const container = document.getElementById('pageButtons');
            const totalPages = Math.ceil(total / pageSize);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html =
                `<button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) {
                startPage = Math.max(1, endPage - maxShow + 1);
            }
            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button disabled>...</button>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button disabled>...</button>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            html +=
                `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredOrders.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderOrders();
        }

        // ============================================================
        // 创建/编辑订单
        // ============================================================
        function showCreateOrderModal() {
            document.getElementById('orderModalTitle').textContent = '新建订单';
            document.getElementById('orderEditId').value = '';
            document.getElementById('orderForm').reset();
            document.getElementById('orderStatus').value = 'pending';
            document.getElementById('orderModal').classList.add('show');
        }

        function editOrder(id) {
            const order = ordersData.find(o => o.id === id);
            if (!order) { showToast('订单不存在', 'error'); return; }
            document.getElementById('orderModalTitle').textContent = '编辑订单';
            document.getElementById('orderEditId').value = id;
            document.getElementById('orderCustomer').value = order.customer;
            document.getElementById('orderAmount').value = order.amount;
            document.getElementById('orderStatus').value = order.status;
            document.getElementById('orderPayment').value = order.payment || 'cash';
            document.getElementById('orderNotes').value = order.notes || '';
            document.getElementById('orderModal').classList.add('show');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('show');
        }

        function saveOrder(event) {
            event.preventDefault();
            const editId = document.getElementById('orderEditId').value;
            const customer = document.getElementById('orderCustomer').value.trim();
            const amount = parseFloat(document.getElementById('orderAmount').value);
            const status = document.getElementById('orderStatus').value;
            const payment = document.getElementById('orderPayment').value;
            const notes = document.getElementById('orderNotes').value.trim();

            if (!customer) { showToast('请输入客户名称', 'warning'); return; }
            if (!amount || amount <= 0) { showToast('请输入有效金额', 'warning'); return; }

            if (editId) {
                const index = ordersData.findIndex(o => o.id === editId);
                if (index === -1) { showToast('订单不存在', 'error'); return; }
                ordersData[index] = { ...ordersData[index], customer, amount, status, payment, notes };
                showToast('订单已更新', 'success');
            } else {
                const newId = 'ORD-' + String(ordersData.length + 1).padStart(6, '0');
                ordersData.unshift({
                    id: newId,
                    customer,
                    amount,
                    status,
                    payment,
                    notes,
                    created_at: new Date().toISOString()
                });
                showToast(`订单 ${newId} 已创建`, 'success');
            }

            setStorage('orders', ordersData);
            loadOrders();
            updateOrderStats();
            filterOrders();
            closeOrderModal();
        }

        // ============================================================
        // 删除订单
        // ============================================================
        function deleteOrder(id) {
            if (!confirm(`确定要删除订单 ${id} 吗？`)) return;
            ordersData = ordersData.filter(o => o.id !== id);
            setStorage('orders', ordersData);
            loadOrders();
            updateOrderStats();
            filterOrders();
            showToast(`订单 ${id} 已删除`, 'success');
        }

        // ============================================================
        // 导出订单
        // ============================================================
        function exportOrders() {
            if (filteredOrders.length === 0) { showToast('没有数据可导出', 'warning'); return; }
            const exportData = filteredOrders.map(o => ({
                '订单号': o.id,
                '客户': o.customer,
                '金额': o.amount || 0,
                '状态': o.status,
                '支付方式': o.payment || '',
                '备注': o.notes || '',
                '时间': new Date(o.created_at).toLocaleString()
            }));
            const headers = Object.keys(exportData[0]);
            let csv = headers.join(',') + '\n';
            exportData.forEach(row => {
                csv += headers.map(h => row[h] || '').join(',') + '\n';
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '订单数据_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('导出成功', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initOrders, 100);
        });
    </script>
</body>
</html>

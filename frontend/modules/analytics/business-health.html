<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>业务健康度 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-red: #F87272;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cyber-header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        /* 健康度仪表盘 KPI */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 28px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        
        .health-badge { display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 4px; }
        .health-badge.good { background: rgba(52, 211, 153, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .health-badge.warning { background: rgba(251, 191, 36, 0.2); color: #FBBF24; border: 1px solid #FBBF24; }
        .health-badge.danger { background: rgba(248, 114, 114, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

        /* 图表容器 */
        .chart-container { height: 320px; width: 100%; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }

        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>🧬 全息业务健康度</h1>
            <p class="subtitle">实时监控企业核心运营生命体征</p>
        </div>

        <!-- 健康度指标 KPI -->
        <div class="stats-grid">
            <div class="kpi-card">
                <div class="kpi-label">健康指数</div>
                <div class="kpi-value" id="healthIndex" style="color:var(--neon-green);">92%</div>
                <span class="health-badge good">状态良好</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">营收健康度</div>
                <div class="kpi-value" id="revHealth">85%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">增长潜力</div>
                <div class="kpi-value" id="growthHealth" style="color:#FBBF24;">68%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">转化效率</div>
                <div class="kpi-value" id="convHealth">94%</div>
            </div>
        </div>

        <!-- 健康雷达图 -->
        <div class="holo-panel">
            <div class="chart-container"><canvas id="healthChart"></canvas></div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * HealthModule - 全息业务健康度引擎
         * 基于 localStorage 真实数据计算业务健康评分，
         * 并绘制霓虹发光雷达图。
         * ============================================================
         */
        const HealthModule = (function() {
            'use strict';
            const ORDERS_KEY = 'erp_orders';
            const CUSTOMERS_KEY = 'erp_customers';

            // 1. 数据聚合与健康度计算
            const _analyzeHealth = () => {
                let orders = [], customers = [];
                try { orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'); } catch {}
                try { customers = JSON.parse(localStorage.getItem(CUSTOMERS_KEY) || '[]'); } catch {}

                if (orders.length === 0) {
                    // 种子数据：注入 50 条混合状态的订单数据
                    for (let i = 0; i < 50; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 60));
                        orders.push({
                            total: Math.round((Math.random() * 2500 + 200) * 100) / 100,
                            status: ['completed', 'pending', 'completed', 'cancelled'][i % 4]
                        });
                    }
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                }

                // 核心健康指标计算
                const totalOrders = orders.length;
                const doneOrders = orders.filter(o => o.status === 'completed').length;
                const pendingOrders = orders.filter(o => o.status === 'pending').length;
                const revenue = orders.reduce((s, o) => s + (o.total || 0), 0);
                const avgOrder = totalOrders > 0 ? (revenue / totalOrders) : 0;

                // 进度健康度 (依赖真实营收数据)
                const revHealth = Math.min(95, Math.round((revenue / 150000) * 100)); // 150,000 为参考基准
                const growthHealth = Math.min(85, Math.round((avgOrder / 800) * 100));  // 800 为客单价基准
                const convHealth = totalOrders > 0 ? Math.round((doneOrders / totalOrders) * 100) : 0;
                const stabilityHealth = Math.max(50, 100 - Math.round((pendingOrders / totalOrders) * 100));
                
                // 综合健康指数 (加权平均)
                const overallHealth = Math.round((revHealth * 0.3 + growthHealth * 0.2 + convHealth * 0.3 + stabilityHealth * 0.2));

                return {
                    healthIndex: Math.min(overallHealth, 100),
                    revHealth: Math.min(revHealth, 100),
                    growthHealth: Math.min(growthHealth, 100),
                    convHealth: Math.min(convHealth, 100),
                    stabilityHealth: Math.min(stabilityHealth, 100)
                };
            };

            // 2. 原生 Canvas 霓虹雷达图绘制
            const _drawRadar = (metrics) => {
                const canvas = document.getElementById('healthChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 800; canvas.height = 320;
                const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h);

                const cx = w/2, cy = h/2, maxR = Math.min(w, h) / 2 - 40;
                const labels = ['营收健康', '增长潜力', '转化效率', '稳定性'];
                const values = [metrics.revHealth, metrics.growthHealth, metrics.convHealth, metrics.stabilityHealth];
                const sectors = values.length;
                const angleStep = (Math.PI * 2) / sectors;

                // 绘制背景网格 (3层)
                for (let r = 1; r <= 3; r++) {
                    const radius = (maxR / 3) * r;
                    ctx.beginPath();
                    for (let i = 0; i <= sectors; i++) {
                        const angle = -Math.PI / 2 + i * angleStep;
                        const x = cx + Math.cos(angle) * radius;
                        const y = cy + Math.sin(angle) * radius;
                        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.stroke();
                }

                // 绘制轴线
                for (let i = 0; i < sectors; i++) {
                    const angle = -Math.PI / 2 + i * angleStep;
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
                    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.stroke();
                    
                    // 标签
                    const labelX = cx + Math.cos(angle) * (maxR + 25);
                    const labelY = cy + Math.sin(angle) * (maxR + 25);
                    ctx.fillStyle = '#94A3B8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '12px sans-serif';
                    ctx.fillText(labels[i], labelX, labelY);
                }

                // 绘制数据雷达区域 (霓虹发光)
                ctx.beginPath();
                for (let i = 0; i < sectors; i++) {
                    const ratio = values[i] / 100;
                    const radius = maxR * ratio;
                    const angle = -Math.PI / 2 + i * angleStep;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.closePath();
                
                const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
                grd.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
                grd.addColorStop(1, 'rgba(139, 92, 246, 0.05)');
                ctx.fillStyle = grd; ctx.fill();

                // 描边
                ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2; ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(0, 229, 255, 0.6)'; ctx.stroke();
                ctx.shadowBlur = 0;

                // 绘制数据点
                for (let i = 0; i < sectors; i++) {
                    const ratio = values[i] / 100;
                    const radius = maxR * ratio;
                    const angle = -Math.PI / 2 + i * angleStep;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2);
                    ctx.fillStyle = '#8B5CF6'; ctx.shadowBlur = 15; ctx.shadowColor = '#8B5CF6'; ctx.fill(); ctx.shadowBlur = 0;
                }
            };

            // 3. 公开接口
            return {
                init: function() {
                    const health = _analyzeHealth();
                    
                    // 更新 KPI
                    document.getElementById('healthIndex').innerText = health.healthIndex + '%';
                    document.getElementById('revHealth').innerText = health.revHealth + '%';
                    document.getElementById('growthHealth').innerText = health.growthHealth + '%';
                    document.getElementById('convHealth').innerText = health.convHealth + '%';

                    // 调整健康状态徽章颜色
                    const badge = document.querySelector('.health-badge');
                    if (health.healthIndex >= 80) {
                        badge.className = 'health-badge good'; badge.innerText = '状态良好';
                    } else if (health.healthIndex >= 60) {
                        badge.className = 'health-badge warning'; badge.innerText = '注意风险';
                    } else {
                        badge.className = 'health-badge danger'; badge.innerText = '紧急干预';
                    }

                    // 绘制雷达图
                    _drawRadar(health);
                    
                    // 响应式适配
                    window.addEventListener('resize', () => { _drawRadar(health); });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            HealthModule.init();
        });
    </script>
</body>
</html>

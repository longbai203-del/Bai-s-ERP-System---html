<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据可视化 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-pink: #F472B6;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
        
        /* 沉浸式宇宙背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 80% 40%, rgba(139, 92, 246, 0.2), transparent 50%),
                radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.1), transparent 40%);
            z-index: -1; pointer-events: none;
        }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1400px; margin: 0 auto; padding: 24px; height: 90vh; display: flex; flex-direction: column; }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 全息投影面板 (高度自适应) */
        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden;
        }

        /* 仪表盘背景边框 */ 
        .holo-panel::after {
            content: ''; position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px dashed rgba(0, 229, 255, 0.1);
            border-radius: 12px; pointer-events: none;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 229, 255, 0.02) 10px, rgba(0, 229, 255, 0.02) 11px);
        }

        /* 图表容器 */
        .chart-container { width: 100%; height: 100%; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }

        @media (max-width: 768px) { .cyber-container { height: 75vh; } }
    </style>
</head>
<body>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>🌌 全息沉浸式数据影院</h1>
            <span style="color:var(--text-muted);font-size:13px;border:1px solid var(--glass-edge);padding:4px 16px;border-radius:20px;">🟢 数据流可视化终端</span>
        </div>

        <div class="holo-panel">
            <div class="chart-container">
                <canvas id="visualizationCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * VisualizationModule - 全息沉浸式数据影院引擎
         * 使用 Canvas 和 requestAnimationFrame 绘制动态发光数据流粒子系统
         * 模拟大数据在多维空间中的全息流转。
         * ============================================================
         */
        const VisualizationModule = (function() {
            'use strict';

            let animFrameId = null;

            // 1. 核心粒子与波动系统
            const _initVisual = () => {
                const canvas = document.getElementById('visualizationCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                const resize = () => {
                    const rect = canvas.parentElement.getBoundingClientRect();
                    canvas.width = rect.width || 800;
                    canvas.height = rect.height || 500;
                };
                resize();
                window.addEventListener('resize', resize);

                // 粒子定义
                const particles = [];
                const particleCount = 120;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                // 初始化粒子
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * Math.min(canvas.width, canvas.height) / 2.5;
                    particles.push({
                        angle: angle,
                        radius: radius,
                        baseRadius: radius,
                        speed: 0.002 + Math.random() * 0.005,
                        size: 2 + Math.random() * 4,
                        color: `hsla(${200 + Math.random() * 40}, 100%, 70%, ${0.3 + Math.random() * 0.5})`
                    });
                }

                // 2. 动画渲染循环
                const animate = () => {
                    const w = canvas.width, h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    // 绘制中心隐形的脉冲光晕
                    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(w,h)/2);
                    gradient.addColorStop(0, 'rgba(0, 229, 255, 0.15)');
                    gradient.addColorStop(0.5, 'rgba(139, 92, 246, 0.05)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);

                    // 绘制数据流轨道圈
                    for (let r = 1; r <= 3; r++) {
                        const radius = (Math.min(w,h) / 2.5) * (r / 3);
                        ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(0, 229, 255, ${0.03 * (4 - r)})`; 
                        ctx.lineWidth = 1; ctx.stroke();
                    }

                    // 更新与绘制粒子 (螺旋光效)
                    particles.forEach(p => {
                        p.angle += p.speed;
                        // 半径随时间产生微小浮动，模拟数据波动
                        p.radius = p.baseRadius + Math.sin(p.angle * 2) * 10;

                        const x = centerX + Math.cos(p.angle) * p.radius;
                        const y = centerY + Math.sin(p.angle) * p.radius;

                        // 绘制发光粒子
                        ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0, 229, 255, 0.5)';
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // 绘制连线：相邻角度的粒子连线，模拟网络拓扑
                        particles.forEach(p2 => {
                            const dx = (centerX + Math.cos(p2.angle) * p2.radius) - x;
                            const dy = (centerY + Math.sin(p2.angle) * p2.radius) - y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 100) {
                                ctx.beginPath(); ctx.moveTo(x, y);
                                ctx.lineTo(centerX + Math.cos(p2.angle) * p2.radius, centerY + Math.sin(p2.angle) * p2.radius);
                                ctx.strokeStyle = `rgba(0, 229, 255, ${0.2 * (1 - dist / 100)})`;
                                ctx.lineWidth = 0.5; ctx.stroke();
                            }
                        });
                    });

                    animFrameId = requestAnimationFrame(animate);
                };

                // 3. 停止渲染（防止页面切换时后台继续占用资源）
                animate();

                // 返回清理函数
                return () => {
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                    window.removeEventListener('resize', resize);
                };
            };

            // 4. 公开接口
            let cleanup = null;
            return {
                init: function() {
                    if (cleanup) cleanup();
                    cleanup = _initVisual();
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            VisualizationModule.init();
        });
    </script>
</body>
</html>

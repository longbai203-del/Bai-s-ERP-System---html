<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - Enterprise ERP</title>
</head>
<body>
    <div class="page dashboard-page">
        <!-- ============================================================
        仪表盘内容
        ============================================================ -->
        <div class="dashboard-header">
            <div>
                <h1>📊 仪表盘</h1>
                <p class="subtitle" id="welcomeMsg">欢迎回来，管理员！</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="refreshDashboard()">🔄 刷新</button>
                <button class="btn btn-primary btn-sm" onclick="exportDashboardData()">📥 导出报表</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-info">
                    <div class="stat-label">今日订单</div>
                    <div class="stat-value" id="todayOrders">0</div>
                    <div class="stat-change up">↑ 12% 较昨日</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">今日收入</div>
                    <div class="stat-value" id="todayRevenue">¥0</div>
                    <div class="stat-change up">↑ 8% 较昨日</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <div class="stat-label">总客户</div>
                    <div class="stat-value" id="totalCustomers">0</div>
                    <div class="stat-change up">↑ 5% 较上月</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚠️</div>
                <div class="stat-info">
                    <div class="stat-label">库存预警</div>
                    <div class="stat-value" id="inventoryWarning">0</div>
                    <div class="stat-change down">↓ 需要补货</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-label">待处理订单</div>
                    <div class="stat-value" id="pendingOrders">0</div>
                    <div class="stat-change neutral">⏳ 等待处理</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-info">
                    <div class="stat-label">本月收入</div>
                    <div class="stat-value" id="monthRevenue">¥0</div>
                    <div class="stat-change up">↑ 15% 较上月</div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <span class="chart-title">📈 销售趋势（近7天）</span>
                    <select id="trendPeriod" onchange="updateDashboardCharts()" class="form-control-sm">
                        <option value="7">近7天</option>
                        <option value="14">近14天</option>
                        <option value="30">近30天</option>
                    </select>
                </div>
                <div class="chart-wrapper">
                    <canvas id="salesTrendChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <span class="chart-title">📊 产品分类占比</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 最近订单 -->
        <div class="table-card">
            <div class="table-header">
                <span class="table-title">📋 最近订单</span>
                <a href="#" onclick="loadModule('orders'); return false;" class="view-all">查看全部 →</a>
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>订单号</th>
                            <th>客户</th>
                            <th>金额</th>
                            <th>状态</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrdersBody">
                        <tr>
                            <td colspan="5" class="empty-state">暂无订单</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <style>
        /* ============================================================
           仪表盘样式
           ============================================================ */
        .dashboard-page {
            padding: 0;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .dashboard-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .dashboard-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.08));
            transform: translateY(-2px);
        }

        .stat-card .stat-icon {
            font-size: 32px;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .stat-card .stat-change {
            font-size: 12px;
            font-weight: 500;
            margin-top: 2px;
        }

        .stat-card .stat-change.up {
            color: var(--success, #10b981);
        }

        .stat-card .stat-change.down {
            color: var(--danger, #ef4444);
        }

        .stat-card .stat-change.neutral {
            color: var(--text-muted, #94a3b8);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
        }

        .chart-wrapper {
            height: 220px;
            position: relative;
        }

        .table-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
        }

        .table-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
        }

        .view-all {
            font-size: 13px;
            color: var(--primary, #4f46e5);
            text-decoration: none;
        }

        .view-all:hover {
            text-decoration: underline;
        }

        .table-container {
            overflow-x: auto;
            padding: 0;
        }

        .table-container .table {
            margin: 0;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted, #94a3b8);
        }

        .form-control-sm {
            padding: 4px 10px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            font-size: 12px;
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            outline: none;
        }

        .form-control-sm:focus {
            border-color: var(--primary, #4f46e5);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card .stat-value {
                font-size: 18px;
            }
        }
    </style>

    <script>
        /**
         * ============================================================
         * 仪表盘模块 - 完整企业级实现
         * ============================================================
         */

        // ============================================================
        // 状态管理
        // ============================================================
        const DashboardState = {
            orders: [],
            products: [],
            customers: [],
            initialized: false
        };

        // ============================================================
        // 初始化
        // ============================================================
        function initDashboard() {
            console.log('📊 仪表盘初始化...');

            // 加载数据
            loadDashboardData();

            // 更新统计
            updateDashboardStats();

            // 渲染最近订单
            renderRecentOrders();

            // 渲染图表
            setTimeout(function() {
                renderDashboardCharts();
            }, 300);

            // 更新欢迎消息
            updateWelcomeMessage();

            DashboardState.initialized = true;
            console.log('✅ 仪表盘初始化完成');
        }

        // ============================================================
        // 加载数据
        // ============================================================
        function loadDashboardData() {
            DashboardState.orders = getStorage('orders') || [];
            DashboardState.products = getStorage('products') || [];
            DashboardState.customers = getStorage('customers') || [];

            // 如果没有数据，生成演示数据
            if (DashboardState.orders.length === 0) {
                generateDemoData();
            }
        }

        // ============================================================
        // 生成演示数据
        // ============================================================
        function generateDemoData() {
            // 生成客户
            const customers = [];
            const names = ['张伟', '王芳', '李明', '刘洋', '陈静', '杨帆', '赵磊', '黄丽', '周涛', '吴雪'];
            for (let i = 1; i <= 20; i++) {
                customers.push({
                    id: i,
                    name: names[i % names.length] + (i + 1),
                    phone: '1' + (Math.floor(Math.random() * 9) + 3) + String(Math.floor(Math.random() * 1000000000)).padStart(9,
                        '0'),
                    total_spent: Math.round((Math.random() * 5000 + 100) * 100) / 100,
                    created_at: new Date(Date.now() - Math.random() * 365 * 24 * 60 * 60 * 1000).toISOString()
                });
            }
            setStorage('customers', customers);
            DashboardState.customers = customers;

            // 生成产品
            const products = [];
            const productNames = ['洗车服务', '汽车保养', '轮胎更换', '机油更换', '空调清洗', '刹车片更换', '电瓶更换', '车灯维修'];
            for (let i = 1; i <= 30; i++) {
                products.push({
                    id: i,
                    name: productNames[i % productNames.length] + ' ' + i,
                    price: Math.round((Math.random() * 300 + 50) * 100) / 100,
                    stock: Math.floor(Math.random() * 100 + 5),
                    category: ['洗车', '保养', '维修', '美容'][i % 4],
                    created_at: new Date(Date.now() - Math.random() * 365 * 24 * 60 * 60 * 1000).toISOString()
                });
            }
            setStorage('products', products);
            DashboardState.products = products;

            // 生成订单
            const orders = [];
            const statuses = ['pending', 'processing', 'completed', 'completed', 'completed', 'cancelled'];
            for (let i = 1; i <= 50; i++) {
                const customer = customers[Math.floor(Math.random() * customers.length)];
                const total = Math.round((Math.random() * 2000 + 50) * 100) / 100;
                const date = new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000);
                orders.push({
                    id: 'ORD-' + String(i).padStart(6, '0'),
                    customer_name: customer ? customer.name : '未知客户',
                    total: total,
                    status: statuses[i % statuses.length],
                    created_at: date.toISOString()
                });
            }
            orders.sort(function(a, b) {
                return new Date(b.created_at) - new Date(a.created_at);
            });
            setStorage('orders', orders);
            DashboardState.orders = orders;
        }

        // ============================================================
        // 存储工具
        // ============================================================
        function getStorage(key) {
            try {
                return JSON.parse(localStorage.getItem('erp_' + key));
            } catch {
                return null;
            }
        }

        function setStorage(key, data) {
            try {
                localStorage.setItem('erp_' + key, JSON.stringify(data));
                return true;
            } catch {
                return false;
            }
        }

        // ============================================================
        // 更新统计
        // ============================================================
        function updateDashboardStats() {
            const orders = DashboardState.orders || [];
            const products = DashboardState.products || [];
            const customers = DashboardState.customers || [];

            const today = new Date().toDateString();
            const todayOrders = orders.filter(function(o) {
                return new Date(o.created_at).toDateString() === today;
            });

            const todayRevenue = todayOrders.reduce(function(sum, o) {
                return sum + (o.total || 0);
            }, 0);

            const pendingOrders = orders.filter(function(o) {
                return o.status === 'pending' || o.status === 'processing';
            });

            const lowStockItems = products.filter(function(p) {
                return (p.stock || 0) < 10;
            });

            const monthStart = new Date();
            monthStart.setDate(1);
            monthStart.setHours(0, 0, 0, 0);
            const monthOrders = orders.filter(function(o) {
                return new Date(o.created_at) >= monthStart;
            });
            const monthRevenue = monthOrders.reduce(function(sum, o) {
                return sum + (o.total || 0);
            }, 0);

            document.getElementById('todayOrders').textContent = todayOrders.length;
            document.getElementById('todayRevenue').textContent = '¥' + todayRevenue.toFixed(2);
            document.getElementById('totalCustomers').textContent = customers.length;
            document.getElementById('inventoryWarning').textContent = lowStockItems.length;
            document.getElementById('pendingOrders').textContent = pendingOrders.length;
            document.getElementById('monthRevenue').textContent = '¥' + monthRevenue.toFixed(2);
        }

        // ============================================================
        // 更新欢迎消息
        // ============================================================
        function updateWelcomeMessage() {
            const user = getStorage('user');
            if (user && user.name) {
                document.getElementById('welcomeMsg').textContent = '欢迎回来，' + user.name + '！';
            }
        }

        // ============================================================
        // 渲染最近订单
        // ============================================================
        function renderRecentOrders() {
            const tbody = document.getElementById('recentOrdersBody');
            const orders = DashboardState.orders || [];

            const recent = orders.slice(0, 8);

            if (recent.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无订单</td></tr>';
                return;
            }

            const statusMap = {
                'pending': { label: '待处理', class: 'badge-warning' },
                'processing': { label: '处理中', class: 'badge-info' },
                'completed': { label: '已完成', class: 'badge-success' },
                'cancelled': { label: '已取消', class: 'badge-danger' }
            };

            tbody.innerHTML = recent.map(function(o) {
                const status = statusMap[o.status] || { label: o.status, class: 'badge-secondary' };
                const date = new Date(o.created_at);
                const dateStr = date.toLocaleString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                return `
                    <tr>
                        <td><strong>${o.id}</strong></td>
                        <td>${o.customer_name || '未知'}</td>
                        <td>¥${(o.total || 0).toFixed(2)}</td>
                        <td><span class="badge ${status.class}">${status.label}</span></td>
                        <td>${dateStr}</td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================================
        // 渲染图表
        // ============================================================
        function renderDashboardCharts() {
            renderSalesTrendChart();
            renderCategoryChart();
        }

        function renderSalesTrendChart() {
            const canvas = document.getElementById('salesTrendChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');

            // 生成7天数据
            const labels = [];
            const data = [];
            const now = new Date();

            for (let i = 6; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                labels.push((d.getMonth() + 1) + '/' + d.getDate());

                // 模拟数据 - 实际应该从订单中计算
                data.push(Math.round((Math.random() * 2000 + 500) * 100) / 100);
            }

            // 使用Canvas绘制简单图表
            drawSimpleChart(ctx, labels, data, '#4f46e5');
        }

        function drawSimpleChart(ctx, labels, data, color) {
            const canvas = ctx.canvas;
            const width = canvas.width || canvas.parentElement.clientWidth || 400;
            const height = canvas.height || 200;

            canvas.width = width;
            canvas.height = height;

            const padding = { top: 20, bottom: 30, left: 40, right: 20 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            const maxValue = Math.max.apply(null, data) * 1.2 || 100;

            // 清空
            ctx.clearRect(0, 0, width, height);

            // 绘制网格线
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            // 绘制折线
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, color + '40');
            gradient.addColorStop(1, color + '05');

            ctx.beginPath();
            ctx.moveTo(padding.left, height - padding.bottom);

            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (data[i] / maxValue) * chartHeight;
                if (i === 0) {
                    ctx.lineTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            // 填充区域
            const lastX = padding.left + chartWidth;
            ctx.lineTo(lastX, height - padding.bottom);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // 绘制折线
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (data[i] / maxValue) * chartHeight;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制数据点
            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (data[i] / maxValue) * chartHeight;

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 绘制X轴标签
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i < labels.length; i++) {
                const x = padding.left + (chartWidth / (labels.length - 1 || 1)) * i;
                ctx.fillText(labels[i], x, height - 4);
            }

            // 绘制Y轴标签
            ctx.textAlign = 'right';
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                const value = Math.round(maxValue - (maxValue / 4) * i);
                ctx.fillText('¥' + value, padding.left - 4, y + 4);
            }
        }

        function renderCategoryChart() {
            const canvas = document.getElementById('categoryChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.clientWidth || 300;
            const height = 200;

            canvas.width = width;
            canvas.height = height;

            // 模拟分类数据
            const categories = ['洗车', '保养', '维修', '美容', '配件'];
            const data = [30, 25, 20, 15, 10];
            const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#3b82f6'];

            const total = data.reduce(function(a, b) { return a + b; }, 0);
            let startAngle = -Math.PI / 2;

            ctx.clearRect(0, 0, width, height);

            const cx = width / 2 - 40;
            const cy = height / 2;
            const radius = Math.min(width, height) / 2 - 20;

            for (let i = 0; i < data.length; i++) {
                const sliceAngle = (data[i] / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();

                // 百分比文字
                const midAngle = startAngle + sliceAngle / 2;
                const textX = cx + radius * 0.65 * Math.cos(midAngle);
                const textY = cy + radius * 0.65 * Math.sin(midAngle);
                const percent = Math.round((data[i] / total) * 100);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(percent + '%', textX, textY);

                startAngle += sliceAngle;
            }

            // 图例
            const legendX = width - 80;
            let legendY = 20;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < categories.length; i++) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(legendX, legendY, 12, 12);
                ctx.fillStyle = '#475569';
                ctx.font = '11px sans-serif';
                ctx.fillText(categories[i], legendX + 18, legendY + 6);
                legendY += 22;
            }
        }

        // ============================================================
        // 刷新仪表盘
        // ============================================================
        function refreshDashboard() {
            loadDashboardData();
            updateDashboardStats();
            renderRecentOrders();
            renderDashboardCharts();
            showToast('仪表盘已刷新', 'success');
        }

        // ============================================================
        // 导出数据
        // ============================================================
        function exportDashboardData() {
            const orders = DashboardState.orders || [];
            if (orders.length === 0) {
                showToast('没有数据可导出', 'warning');
                return;
            }

            const exportData = orders.map(function(o) {
                return {
                    '订单号': o.id,
                    '客户': o.customer_name || '未知',
                    '金额': o.total || 0,
                    '状态': o.status || '未知',
                    '时间': new Date(o.created_at).toLocaleString()
                };
            });

            // 导出为CSV
            const headers = Object.keys(exportData[0]);
            let csv = headers.join(',') + '\n';
            exportData.forEach(function(row) {
                csv += headers.map(function(h) { return row[h] || ''; }).join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '仪表盘数据_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('导出成功', 'success');
        }

        // ============================================================
        // 更新图表（切换周期）
        // ============================================================
        function updateDashboardCharts() {
            renderDashboardCharts();
        }

        // ============================================================
        // Toast通知（使用全局或本地实现）
        // ============================================================
        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }

            // 本地实现
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();

            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'}</span>
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>
            `;
            container.appendChild(toast);

            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        // ============================================================
        // 页面加载时初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 等待DOM完全加载后初始化
            setTimeout(initDashboard, 100);
        });

        // 如果DOM已加载，立即初始化
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(initDashboard, 100);
        }
    </script>
</body>
</html>

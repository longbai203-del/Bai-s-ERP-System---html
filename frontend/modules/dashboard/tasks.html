<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>待办任务</title>
<style>.container{padding:24px;max-width:1000px;margin:0 auto;}.item{display:flex;justify-content:space-between;padding:16px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:12px;border-left:4px solid #4F46E5;}.tag{padding:4px 12px;background:#F3F4F6;border-radius:20px;font-size:12px;color:#475569;}.btn-sm{padding:4px 12px;border:1px solid #E2E8F0;border-radius:6px;background:#fff;cursor:pointer;}</style></head>
<body>
<div class="container"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;"><h1 style="margin:0;color:#0F172A;">✅ 待办任务</h1><span id="taskCount" style="background:#F3F4F6;padding:4px 16px;border-radius:20px;color:#475569;">0 项待处理</span></div>
<div id="taskList"></div></div>
<script>
(function(){
    const S={get(k,d){try{const v=localStorage.getItem('erp_'+k);return v?JSON.parse(v):d;}catch{return d;}}};
    const orders = S.get('orders', []);
    const pending = orders.filter(o=>o.status==='pending'||o.status==='processing');
    document.getElementById('taskCount').innerText = pending.length + ' 项待处理';
    const list = document.getElementById('taskList');
    list.innerHTML = pending.map(o=>`
        <div class="item"><div><div style="font-weight:600;">${o.id}</div><div style="font-size:14px;color:#6B7280;">客户：${o.customer_name} | 金额：¥${o.total}</div></div>
        <div style="display:flex;gap:12px;align-items:center;"><span class="tag">${o.status === 'pending' ? '待审核' : '处理中'}</span><button class="btn-sm" onclick="window.location.reload()">模拟标记完成</button></div></div>
    `).join('');
    if(pending.length===0) list.innerHTML = '<div style="text-align:center;padding:40px;color:#94A3B8;">🎉 暂无待办任务</div>';
})();
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>快捷入口</title>

<body><div style="padding:24px;max-width:800px;margin:0 auto;"><h1 style="color:#0F172A;">⚡ 快捷入口</h1><div class="grid">

<div class="btn" onclick="loadModule('customers-main')"><span class="icon">👤</span>新增客户</div>
<div class="btn" onclick="loadModule('products')"><span class="icon">📦</span>商品管理</div>
<div class="btn" onclick="loadModule('inventory')"><span class="icon">📊</span>库存盘点</div>
<div class="btn" onclick="loadModule('finance-main')"><span class="icon">💰</span>记账本</div>
<div class="btn" onclick="loadModule('orders')"><span class="icon">📋</span>订单查询</div>
</div></div></body></html>

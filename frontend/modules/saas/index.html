<div class="module-container" data-module="saas">
    <div class="module-header">
        <h2>☁️ SaaS 管理</h2>
        <div class="module-actions">
            <button class="btn-primary" onclick="window.showCreateTenant()">+ 新建租户</button>
            <button class="btn-refresh" onclick="window.initSaaS()">🔄 刷新</button>
        </div>
    </div>
    <div class="module-content">
        <!-- 统计卡片 -->
        <div class="saas-stats" id="saasStats">
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-info">
                    <div class="stat-number" id="totalTenants">0</div>
                    <div class="stat-label">总租户</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-number" id="activeTenants">0</div>
                    <div class="stat-label">活跃租户</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏸️</div>
                <div class="stat-info">
                    <div class="stat-number" id="inactiveTenants">0</div>
                    <div class="stat-label">停用租户</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <div class="stat-number" id="expiringSoon">0</div>
                    <div class="stat-label">即将到期</div>
                </div>
            </div>
        </div>

        <!-- 租户列表 -->
        <div class="saas-table-wrapper">
            <div class="table-toolbar">
                <div class="table-toolbar-left">
                    <input type="text" id="tenantSearch" placeholder="🔍 搜索租户..." class="search-input">
                    <select id="tenantFilter" class="filter-select">
                        <option value="all">全部状态</option>
                        <option value="active">活跃</option>
                        <option value="inactive">停用</option>
                        <option value="suspended">暂停</option>
                        <option value="trial">试用</option>
                    </select>
                </div>
                <div class="table-toolbar-right">
                    <span id="tenantCount" style="color:#999;font-size:14px;">共 0 个租户</span>
                </div>
            </div>
            <div id="tenantTableWrapper">
                <div class="loading-placeholder">
                    <div class="spinner"></div>
                    <p>加载租户中...</p>
                </div>
            </div>
        </div>
    </div>
</div>

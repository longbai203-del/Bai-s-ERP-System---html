<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Enterprise ERP 智云</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

    <!-- 粒子动态背景 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 登录主容器 -->
    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="brand-section">
            <div class="brand-logo">
                <span class="icon">☁️</span>
                <h1>ERP <span>智云</span></h1>
            </div>
            <div class="brand-tagline">
                下一代企业资源计划系统<br>AI 驱动 · 实时洞察 · 安全高效
            </div>
            <div class="feature-grid">
                <div class="feature-item"><span>🚀</span><p>AI 智能决策</p></div>
                <div class="feature-item"><span>🔒</span><p>银行级安全</p></div>
                <div class="feature-item"><span>📊</span><p>实时数据大屏</p></div>
                <div class="feature-item"><span>💎</span><p>至臻用户体验</p></div>
            </div>
        </div>

        <!-- 右侧登录区 -->
        <div class="form-section">
            <div class="form-header">
                <h2>欢迎回归</h2>
                <p>登录您的智云 ERP 管理后台</p>
            </div>
            
            <div class="login-error" id="loginError">用户名或密码错误，请重试</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="admin" value="admin" autofocus>
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="••••••" value="123456">
                </div>
                
                <div class="form-actions">
                    <label>
                        <input type="checkbox" checked> 保持登录
                    </label>
                    <a href="#">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-btn">进入管理中心</button>
            </form>
            
            <div class="login-footer">
                默认体验账号: <strong>admin</strong> / <strong>123456</strong>
            </div>
        </div>
    </div>

    <!-- ============================================================
    核心逻辑与粒子动画
    ============================================================ -->
    
    <script src="js/common.js"></script>
</body>
</html>

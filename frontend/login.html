<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Enterprise ERP</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/light.css">
    <style>
        .login-page {
            display: flex;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .login-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2332 0%, #2d3748 100%);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .login-left::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.1);
            top: -200px;
            right: -200px;
        }
        .login-left::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.05);
            bottom: -100px;
            left: -100px;
        }
        .login-brand {
            position: relative;
            z-index: 1;
            color: #fff;
            max-width: 480px;
        }
        .login-brand h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        .login-brand h1 span {
            color: #818CF8;
        }
        .login-brand p {
            font-size: 18px;
            opacity: 0.8;
            line-height: 1.8;
        }
        .login-brand .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 32px;
        }
        .login-brand .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        .login-brand .feature-item span {
            font-size: 20px;
        }
        .login-right {
            width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-secondary);
        }
        .login-container {
            width: 100%;
            max-width: 360px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .login-header p {
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .form-options a {
            font-size: 13px;
            color: #4F46E5;
            text-decoration: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #4F46E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
        }
        .login-error {
            display: none;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #EF4444;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-error.show {
            display: block;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .login-footer a {
            color: #4F46E5;
            text-decoration: none;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover {
            border-color: #4F46E5;
        }
        @media (max-width: 1024px) {
            .login-left {
                display: none;
            }
            .login-right {
                width: 100%;
                min-height: 100vh;
            }
        }
        @media (max-width: 480px) {
            .login-right {
                padding: 20px;
            }
            .login-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 切换主题</button>
    
    <div class="login-page">
        <div class="login-left">
            <div class="login-brand">
                <h1>🏢 Enterprise <span>ERP</span></h1>
                <p>企业资源计划管理系统<br>一站式企业管理解决方案</p>
                <div class="features">
                    <div class="feature-item"><span>📊</span> 数据分析</div>
                    <div class="feature-item"><span>💼</span> 业务管理</div>
                    <div class="feature-item"><span>👥</span> 客户关系</div>
                    <div class="feature-item"><span>🤖</span> AI 助手</div>
                </div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-container">
                <div class="login-header">
                    <h2>欢迎登录</h2>
                    <p>输入您的账号信息以继续</p>
                </div>
                
                <div class="login-error" id="loginError">用户名或密码错误，请重试</div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" placeholder="请输入用户名" value="admin" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="请输入密码" value="123456">
                    </div>
                    <div class="form-options">
                        <label>
                            <input type="checkbox" checked> 记住我
                        </label>
                        <a href="#">忘记密码？</a>
                    </div>
                    <button type="submit" class="login-btn">登 录</button>
                </form>
                
                <div class="login-footer">
                    默认账号: <strong>admin</strong> / 密码: <strong>123456</strong>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/assets/js/constants.js"></script>
    <script src="/assets/js/storage.js"></script>
    <script src="/assets/js/database.js"></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/assets/js/auth.js"></script>
    
    <script>
        // 初始化默认用户
        (function initDefaultUser() {
            const users = Storage.get('users');
            if (!users || users.length === 0) {
                Storage.set('users', [
                    {
                        id: 1,
                        username: 'admin',
                        password: '123456',
                        name: '系统管理员',
                        role: 'admin',
                        email: 'admin@enterprise-erp.com',
                        avatar: '',
                        created_at: new Date().toISOString(),
                        last_login: null
                    },
                    {
                        id: 2,
                        username: 'manager',
                        password: '123456',
                        name: '张经理',
                        role: 'manager',
                        email: 'manager@enterprise-erp.com',
                        avatar: '',
                        created_at: new Date().toISOString(),
                        last_login: null
                    },
                    {
                        id: 3,
                        username: 'cashier',
                        password: '123456',
                        name: '李收银员',
                        role: 'cashier',
                        email: 'cashier@enterprise-erp.com',
                        avatar: '',
                        created_at: new Date().toISOString(),
                        last_login: null
                    }
                ]);
            }
        })();
        
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.classList.add('show');
                return;
            }
            
            const users = Storage.get('users') || [];
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                // 更新最后登录时间
                user.last_login = new Date().toISOString();
                const updatedUsers = users.map(u => u.id === user.id ? user : u);
                Storage.set('users', updatedUsers);
                
                // 保存登录状态
                Auth.login(user);
                
                // 跳转到主系统
                window.location.href = '/index.html';
            } else {
                errorEl.textContent = '用户名或密码错误，请重试';
                errorEl.classList.add('show');
                setTimeout(() => {
                    errorEl.classList.remove('show');
                }, 3000);
            }
        }
        
        // 回车登录
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>

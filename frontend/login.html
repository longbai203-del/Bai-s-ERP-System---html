<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Bai's ERP</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
            max-width: 90%;
        }
        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .login-container h1 span {
            color: #667eea;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: scale(1.02);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-links {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .auth-links a {
            color: #667eea;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .success-msg {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        .loading-text {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🚗 <span>Bai's</span> ERP</h1>
        <div id="initStatus" style="text-align:center;color:#666;font-size:14px;margin-bottom:15px;">
            ⏳ 正在初始化系统...
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        <form id="loginForm" style="display:none;">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">登录</button>
        </form>
        <div class="auth-links" style="display:none;" id="authLinks">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const initStatus = document.getElementById('initStatus');
            const authLinks = document.getElementById('authLinks');

            let isInitialized = false;

            // 显示错误
            function showError(msg) {
                errorMsg.textContent = '❌ ' + msg;
                errorMsg.className = 'error-msg show';
                successMsg.className = 'success-msg';
            }

            // 显示成功
            function showSuccess(msg) {
                successMsg.textContent = '✅ ' + msg;
                successMsg.className = 'success-msg show';
                errorMsg.className = 'error-msg';
            }

            // 设置加载状态
            function setLoading(loading) {
                if (loading) {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '⏳ 登录中...';
                } else {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            }

            // 初始化 Supabase
            async function initSupabase(retries = 3) {
                for (let i = 0; i < retries; i++) {
                    try {
                        initStatus.textContent = '⏳ 正在初始化系统... (' + (i + 1) + '/' + retries + ')';
                        
                        if (!window.Supabase) {
                            await new Promise(r => setTimeout(r, 500));
                            continue;
                        }
                        
                        await window.Supabase.init();
                        
                        // 验证是否真的初始化了
                        if (window.Supabase.isReady && window.Supabase.isReady()) {
                            isInitialized = true;
                            initStatus.textContent = '✅ 系统已就绪';
                            initStatus.style.color = '#3c3';
                            form.style.display = 'block';
                            authLinks.style.display = 'block';
                            return true;
                        }
                        
                        // 检查 auth 是否可用
                        const client = window.Supabase.getClient();
                        if (client && client.auth) {
                            isInitialized = true;
                            initStatus.textContent = '✅ 系统已就绪';
                            initStatus.style.color = '#3c3';
                            form.style.display = 'block';
                            authLinks.style.display = 'block';
                            return true;
                        }
                        
                        await new Promise(r => setTimeout(r, 1000));
                    } catch (error) {
                        console.warn('初始化尝试 ' + (i + 1) + ' 失败:', error);
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
                
                initStatus.textContent = '❌ 系统初始化失败，请刷新重试';
                initStatus.style.color = '#c33';
                showError('系统初始化失败，请刷新页面重试');
                return false;
            }

            // 登录处理
            async function handleLogin(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError('请填写邮箱和密码');
                    return;
                }

                // 确保 Supabase 已初始化
                if (!isInitialized) {
                    showError('系统正在初始化，请稍候...');
                    return;
                }

                setLoading(true);
                showError('');
                showSuccess('');

                try {
                    const result = await window.Auth.login(email, password);
                    
                    if (result.success) {
                        showSuccess('登录成功！正在跳转...');
                        setTimeout(function() {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        showError(result.error || '登录失败，请检查邮箱和密码');
                    }
                } catch (error) {
                    showError('登录失败: ' + (error.message || '未知错误'));
                } finally {
                    setLoading(false);
                }
            }

            // 绑定事件
            form.addEventListener('submit', handleLogin);

            // 页面加载时初始化
            document.addEventListener('DOMContentLoaded', function() {
                initSupabase();
            });

            // 检查是否已登录
            async function checkAuth() {
                try {
                    if (!isInitialized) {
                        await initSupabase();
                    }
                    const session = await window.Auth.getSession();
                    if (session) {
                        window.location.href = 'index.html';
                    }
                } catch (e) {
                    // 未登录，继续显示登录页
                }
            }
            
            // 延迟检查，等待初始化完成
            setTimeout(checkAuth, 3000);

        })();
    </script>
</body>
</html>

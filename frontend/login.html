<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Enterprise ERP 智云</title>
    <style>
        /* ============================================================
           全局重置与基础设定
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100%;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background: #0A192F; /* 深空背景底色 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
           动态粒子背景 (Canvas)
           ============================================================ */
        #particles-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================================
           整体登录容器 (毛玻璃效果)
           ============================================================ */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 180, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* 左侧品牌展示区 (天蓝渐变主题) */
        .brand-section {
            flex: 1.5;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: linear-gradient(145deg, rgba(0, 150, 255, 0.2), rgba(0, 200, 255, 0.05));
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .brand-logo .icon {
            font-size: 42px;
            filter: drop-shadow(0 0 15px rgba(0, 150, 255, 0.6));
        }
        .brand-logo h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .brand-logo h1 span { color: #64D8FF; }

        .brand-tagline {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .feature-item {
            padding: 16px;
            background: rgba(0, 180, 255, 0.1);
            border: 1px solid rgba(0, 180, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            text-align: center;
            transition: all 0.3s ease;
        }
        .feature-item:hover {
            transform: translateY(-5px);
            background: rgba(0, 180, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 100, 255, 0.2);
            border-color: #64D8FF;
        }
        .feature-item span { font-size: 28px; display: block; margin-bottom: 6px; }
        .feature-item p { font-size: 13px; color: rgba(255,255,255,0.8); }

        /* 右侧登录表单区 */
        .form-section {
            flex: 1;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 35px;
        }
        .form-header h2 {
            font-size: 28px;
            color: #fff;
            font-weight: 600;
        }
        .form-header p {
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #64D8FF;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.15);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.3); }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .form-actions label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            cursor: pointer;
        }
        .form-actions a {
            color: #64D8FF;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }
        .form-actions a:hover { color: #fff; }

        /* 发光登录按钮 */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #0090FF, #00C6FF);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 150, 255, 0.5);
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: 0.6s;
        }
        .login-btn:hover::after { transform: rotate(45deg) translateX(100%); }

        .login-error {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 75, 75, 0.1);
            border: 1px solid rgba(255, 75, 75, 0.3);
            border-radius: 10px;
            color: #FF6B6B;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        .login-error.show { display: block; }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
        .login-footer strong { color: rgba(255,255,255,0.6); }

        /* 响应式 */
        @media (max-width: 820px) {
            .login-wrapper { flex-direction: column; max-width: 460px; backdrop-filter: blur(20px); }
            .brand-section { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 30px; }
            .brand-tagline { display: none; }
            .form-section { padding: 30px; }
        }
        @media (max-width: 480px) {
            .feature-grid { grid-template-columns: 1fr; }
            .form-section { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 粒子动态背景 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 登录主容器 -->
    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="brand-section">
            <div class="brand-logo">
                <span class="icon">☁️</span>
                <h1>ERP <span>智云</span></h1>
            </div>
            <div class="brand-tagline">
                下一代企业资源计划系统<br>AI 驱动 · 实时洞察 · 安全高效
            </div>
            <div class="feature-grid">
                <div class="feature-item"><span>🚀</span><p>AI 智能决策</p></div>
                <div class="feature-item"><span>🔒</span><p>银行级安全</p></div>
                <div class="feature-item"><span>📊</span><p>实时数据大屏</p></div>
                <div class="feature-item"><span>💎</span><p>至臻用户体验</p></div>
            </div>
        </div>

        <!-- 右侧登录区 -->
        <div class="form-section">
            <div class="form-header">
                <h2>欢迎回归</h2>
                <p>登录您的智云 ERP 管理后台</p>
            </div>
            
            <div class="login-error" id="loginError">用户名或密码错误，请重试</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="admin" value="admin" autofocus>
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="••••••" value="123456">
                </div>
                
                <div class="form-actions">
                    <label>
                        <input type="checkbox" checked> 保持登录
                    </label>
                    <a href="#">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-btn">进入管理中心</button>
            </form>
            
            <div class="login-footer">
                默认体验账号: <strong>admin</strong> / <strong>123456</strong>
            </div>
        </div>
    </div>

    <!-- ============================================================
    核心逻辑与粒子动画
    ============================================================ -->
    <script>
        // ============================================================
        // 1. 炫酷动态粒子背景
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.radius = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(100, 216, 255, 0.6)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < 100; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                
                // 绘制连线
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 150, 255, ${0.3 - dist/500})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();


        // ============================================================
        // 2. 独立运行的原生本地存储工具 (全兼容支持)
        // ============================================================
        const Storage = {
            get: function(key, defaultValue) {
                try { 
                    const data = localStorage.getItem('erp_' + key); 
                    return data ? JSON.parse(data) : defaultValue; 
                } catch (e) { 
                    return defaultValue; 
                }
            },
            set: function(key, value) {
                try { 
                    localStorage.setItem('erp_' + key, JSON.stringify(value)); 
                    return true; 
                } catch (e) { 
                    return false; 
                }
            },
            remove: function(key) { localStorage.removeItem('erp_' + key); }
        };


        // ============================================================
        // 3. 初始化内置数据库 (默认账号 admin/123456)
        // ============================================================
        (function initDB() {
            if (!Storage.get('users') || Storage.get('users').length === 0) {
                Storage.set('users', [
                    { id: 1, username: 'admin', password: '123456', name: '超级管理员', role: 'admin' },
                    { id: 2, username: 'manager', password: '123456', name: '运营经理', role: 'manager' },
                    { id: 3, username: 'cashier', password: '123456', name: '财务专员', role: 'cashier' }
                ]);
                console.log("✅ 智云ERP: 用户数据库初始化完成。");
            }
        })();


        // ============================================================
        // 4. 登录表单事件绑定
        // ============================================================
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '请输入账号和密码';
                errorEl.classList.add('show');
                return;
            }

            const users = Storage.get('users') || [];
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                Storage.set('user', user);
                // 跳转到后台主系统 (相对路径)
                window.location.href = './index.html';
            } else {
                errorEl.textContent = '账号或密码错误，请检查后重试！';
                errorEl.classList.add('show');
                setTimeout(() => { errorEl.classList.remove('show'); }, 3000);
            }
        }

        // 绑定 DOM 事件
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('password').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { handleLogin(e); }
            });
        });
    </script>
</body>
</html>

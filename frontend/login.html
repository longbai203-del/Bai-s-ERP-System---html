<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - Enterprise ERP</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-main); }
        .login-box { background: var(--card-bg); border: 1px solid var(--glass-edge); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-card); }
        .login-box h1 { color: var(--text-main); text-align: center; margin-bottom: 24px; font-size: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: var(--text-sub); margin-bottom: 6px; font-size: 14px; }
        .form-control { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text-main); outline: none; }
        .form-control:focus { border-color: var(--neon-blue); }
        .btn-cyber { width: 100%; padding: 12px; margin-top: 8px; }
        .error-msg { color: #EF4444; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>📊 Enterprise ERP</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="email" class="form-control" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-cyber" id="loginBtn">登 录</button>
            <div class="error-msg" id="loginError">登录失败，请检查邮箱和密码。</div>
        </form>
    </div>

    <!-- Supabase 支持 (确保按正确顺序加载) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/db.js"></script>
    <script src="/js/permissions.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/common.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            btn.textContent = '登录中...';
            btn.disabled = true;
            errorEl.style.display = 'none';

            const result = await authManager.login(email, password);

            if (result.success) {
    // 登录后立即获取用户配置文件
    const profile = await authManager.loadUserProfile();
    
    // 如果发现 organization_id 为空，说明是新用户，自动创建默认组织、门店和角色
    if (!profile || !profile.organization_id) {
        // 1. 创建默认组织
        const { data: org } = await db.insert('organizations', {
            name: '默认企业',
            tax_id: '000000000000000'
        });
        
        if (org && org[0]) {
            const orgId = org[0].id;
            
            // 2. 创建默认门店
            await db.insert('branches', {
                organization_id: orgId,
                name: '总店',
                code: 'HQ-001'
            });
            
            // 3. 将当前用户的 profile 更新为这个组织
            await db.update('profiles', {
                organization_id: orgId,
                role: 'super_admin'
            }, { id: authManager.currentUser.id });
            
            // 4. 重新加载 profile 刷新页面
            await authManager.loadUserProfile();
        }
    }
    
    // 完成初始化后跳转仪表盘
    window.location.href = '/modules/dashboard/dashboard.html';
            } else {
                errorEl.textContent = result.error || '登录失败，请检查邮箱和密码。';
                errorEl.style.display = 'block';
                btn.textContent = '登 录';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

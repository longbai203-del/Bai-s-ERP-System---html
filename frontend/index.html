<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Bai's ERP System - 企业资源计划管理系统">
    
    <title>Bai's ERP System</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/common.css">
    
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        
        /* App 布局 */
        #app {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        
        /* Sidebar */
        #sidebar-container {
            width: 240px;
            min-height: 100vh;
            background: #1a1a2e;
            color: #fff;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        #sidebar-container .sidebar-brand {
            padding: 20px 16px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #sidebar-container .sidebar-brand span {
            color: #667eea;
        }
        
        #sidebar-container .sidebar-nav {
            padding: 12px 0;
        }
        
        #sidebar-container .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            gap: 12px;
            font-size: 14px;
        }
        
        #sidebar-container .sidebar-nav .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        
        #sidebar-container .sidebar-nav .nav-item.active {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border-left-color: #667eea;
        }
        
        #sidebar-container .sidebar-nav .nav-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        #sidebar-container .sidebar-nav .nav-section {
            padding: 8px 16px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Main Content */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Topbar */
        #topbar-container {
            background: #fff;
            padding: 12px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: 60px;
        }
        
        #topbar-container .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        #topbar-container .topbar-left .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }
        
        #topbar-container .topbar-left .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        #topbar-container .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        #topbar-container .topbar-right .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            font-size: 14px;
        }
        
        #topbar-container .topbar-right .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        #topbar-container .topbar-right .logout-btn {
            padding: 6px 16px;
            background: #fee;
            color: #c33;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        #topbar-container .topbar-right .logout-btn:hover {
            background: #fdd;
        }
        
        /* Main Content Area */
        #main-content {
            flex: 1;
            padding: 20px 24px;
            background: #f0f2f5;
        }
        
        .module-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .module-container.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            #sidebar-container {
                position: fixed;
                transform: translateX(-100%);
                width: 280px;
                height: 100vh;
                top: 0;
                left: 0;
            }
            
            #sidebar-container.open {
                transform: translateX(0);
            }
            
            #topbar-container .topbar-left .menu-toggle {
                display: block;
            }
            
            #main-content {
                padding: 12px;
            }
            
            #sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 999;
            }
            
            #sidebar-overlay.show {
                display: block;
            }
        }
        
        /* Loading */
        .app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: #666;
        }
        
        .app-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <div class="sidebar-brand">
                🚗 <span>Bai's</span> ERP
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- 由 JS 动态生成 -->
            </nav>
        </div>
        
        <!-- Sidebar Overlay (mobile) -->
        <div id="sidebar-overlay"></div>
        
        <!-- Main Content -->
        <div id="main-wrapper">
            <!-- Topbar -->
            <div id="topbar-container">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
                    <span class="page-title" id="pageTitle">仪表板</span>
                </div>
                <div class="topbar-right">
                    <div class="user-info" id="userInfo">
                        <span id="userName">用户</span>
                        <div class="avatar" id="userAvatar">U</div>
                    </div>
                    <button class="logout-btn" id="logoutBtn">退出</button>
                </div>
            </div>
            
            <!-- Main Content Area -->
            <div id="main-content">
                <div class="app-loading" id="loadingIndicator">
                    <div class="spinner"></div>
                    <span>加载中...</span>
                </div>
                <!-- 模块将在这里渲染 -->
            </div>
        </div>
    </div>

    <!-- 配置 -->
    <script src="config.js"></script>
    
    <!-- 核心库 -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    
    <!-- 组件 -->
    <script src="js/i18n.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/table.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/storage.js"></script>
    
    <!-- 路由 -->
    <script src="js/router.js"></script>
    <script src="js/bootstrap.js"></script>`n    <script src="js/service-loader.js"></script>
    
    <script>
        (function() {
            'use strict';
            
            // ============================================================
            // 1. 等待 DOM 加载
            // ============================================================
            document.addEventListener('DOMContentLoaded', async function() {
                console.log('🚀 Bai\'s ERP System 启动中...');
                
                const loadingEl = document.getElementById('loadingIndicator');
                const mainContent = document.getElementById('main-content');
                const pageTitle = document.getElementById('pageTitle');
                const userName = document.getElementById('userName');
                const userAvatar = document.getElementById('userAvatar');
                const logoutBtn = document.getElementById('logoutBtn');
                
                // ============================================================
                // 2. 初始化 Supabase
                // ============================================================
                try {
                    await window.Supabase.init();
                    console.log('✅ Supabase 已初始化');
                } catch (error) {
                    console.error('❌ Supabase 初始化失败:', error);
                    loadingEl.innerHTML = `
                        <div style="color: #c33; text-align: center;">
                            <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                            <h3>系统初始化失败</h3>
                            <p style="color: #999; margin-top: 8px;">${error.message}</p>
                            <button onclick="location.reload()" style="margin-top: 16px; padding: 8px 24px; background: #667eea; color: #fff; border: none; border-radius: 4px; cursor: pointer;">刷新重试</button>
                        </div>
                    `;
                    return;
                }
                
                // ============================================================
                // 3. 检查登录状态
                // ============================================================
                let session = null;
                try {
                    session = await window.Auth.getSession();
                } catch (error) {
                    console.warn('获取会话失败:', error);
                }
                
                if (!session) {
                    console.log('⏳ 未登录，跳转到登录页');
                    window.location.href = 'login.html';
                    return;
                }
                
                console.log('✅ 用户已登录:', session.user.email);
                
                // 显示用户信息
                const user = window.Auth.getCurrentUser();
                if (user) {
                    const name = user.profile?.full_name || user.email || '用户';
                    userName.textContent = name;
                    userAvatar.textContent = name.charAt(0).toUpperCase();
                }
                
                // ============================================================
                // 4. 加载 Sidebar
                // ============================================================
                loadSidebar();
                
                // ============================================================
                // 5. 初始化 Router
                // ============================================================
                if (window.Router) {
                    window.Router.init();
                    console.log('✅ Router 初始化完成');
                }
                
                // ============================================================
                // 6. 隐藏 Loading
                // ============================================================
                loadingEl.style.display = 'none';
                
                // ============================================================
                // 7. 绑定事件
                // ============================================================
                // 登出
                logoutBtn.addEventListener('click', async function() {
                    if (confirm('确定要退出登录吗？')) {
                        await window.Auth.logout();
                        window.location.href = 'login.html';
                    }
                });
                
                // 移动端菜单切换
                const menuToggle = document.getElementById('menuToggle');
                const sidebar = document.getElementById('sidebar-container');
                const overlay = document.getElementById('sidebar-overlay');
                
                menuToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('show');
                });
                
                overlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('show');
                });
                
                console.log('✅ 应用启动完成！');
                
                // 触发启动事件
                document.dispatchEvent(new CustomEvent('app:ready'));
            });
            
            // ============================================================
            // 加载 Sidebar
            // ============================================================
            function loadSidebar() {
                const nav = document.getElementById('sidebar-nav');
                if (!nav) return;
                
                const menu = window.MENU_CONFIG || [
                    { section: '主要', items: [
                        { id: 'dashboard', label: '仪表板', icon: '📊' },
                        { id: 'pos', label: '销售点', icon: '🛒' },
                        { id: 'orders', label: '订单管理', icon: '📋' }
                    ]},
                    { section: '业务', items: [
                        { id: 'customers', label: '客户管理', icon: '👤' },
                        { id: 'members', label: '会员管理', icon: '💎' },
                        { id: 'products', label: '产品管理', icon: '📦' },
                        { id: 'inventory', label: '库存管理', icon: '📈' }
                    ]},
                    { section: '财务', items: [
                        { id: 'finance', label: '财务管理', icon: '💰' },
                        { id: 'purchase', label: '采购管理', icon: '📥' },
                        { id: 'suppliers', label: '供应商', icon: '🏭' }
                    ]},
                    { section: '管理', items: [
                        { id: 'hr', label: '人力资源', icon: '👔' },
                        { id: 'crm', label: 'CRM', icon: '🤝' },
                        { id: 'reports', label: '报表中心', icon: '📊' },
                        { id: 'analytics', label: '数据分析', icon: '📈' },
                        { id: 'fleet', label: '车队管理', icon: '🚗' },
                        { id: 'ai', label: 'AI助手', icon: '🤖' },
                        { id: 'settings', label: '系统设置', icon: '⚙️' }
                    ]}
                ];
                
                let html = '';
                
                for (const section of menu) {
                    if (section.section) {
                        html += `<div class="nav-section">${section.section}</div>`;
                    }
                    for (const item of section.items) {
                        html += `
                            <a class="nav-item" data-route="/modules/${item.id}/" data-module="${item.id}">
                                <span class="icon">${item.icon}</span>
                                ${item.label}
                            </a>
                        `;
                    }
                }
                
                nav.innerHTML = html;
                
                // 绑定点击事件
                nav.querySelectorAll('.nav-item').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        e.preventDefault();
                        const route = this.getAttribute('data-route');
                        if (route && window.Router) {
                            window.Router.navigate(route);
                        }
                        // 移动端关闭菜单
                        const sidebar = document.getElementById('sidebar-container');
                        const overlay = document.getElementById('sidebar-overlay');
                        if (sidebar) sidebar.classList.remove('open');
                        if (overlay) overlay.classList.remove('show');
                    });
                });
            }
            
        })();
    </script>
</body>
</html>

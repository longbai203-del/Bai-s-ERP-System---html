<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .error-container {
            text-align: center;
            padding: 60px 40px;
        }
        .error-code {
            font-size: 160px;
            font-weight: 800;
            background: linear-gradient(135deg, #4F46E5, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 0;
        }
        .error-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 16px;
        }
        .error-text {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin: 16px 0 8px;
        }
        .error-desc {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 16px;
        }
        .btn-home {
            display: inline-block;
            padding: 14px 40px;
            background: #4F46E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-home:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
        }
        .error-links {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .error-links a {
            color: #4F46E5;
            text-decoration: none;
            font-size: 14px;
        }
        .error-links a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .error-code { font-size: 100px; }
            .error-text { font-size: 20px; }
            .error-container { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-icon">🔍</span>
        <h1 class="error-code">404</h1>
        <p class="error-text">页面未找到</p>
        <p class="error-desc">抱歉，您访问的页面不存在或已被移除</p>
        <a href="/" class="btn-home">🏠 返回首页</a>
        <div class="error-links">
            <a href="#" onclick="history.back()">← 返回上一页</a>
            <a href="#" onclick="location.reload()">🔄 刷新页面</a>
        </div>
    </div>
</body>
</html>

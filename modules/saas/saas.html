<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS管理 - Enterprise ERP</title>
</head>
<body>
    <div class="page saas-page">
        <!-- ============================================================
        SaaS管理
        ============================================================ -->
        <div class="saas-header">
            <div>
                <h1>☁️ SaaS管理</h1>
                <p class="subtitle">管理订阅计划、租户和计费</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCreateTenantModal()">＋ 添加租户</button>
                <button class="btn btn-outline" onclick="exportSaaS()">📥 导出</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-info">
                    <div class="stat-label">总租户</div>
                    <div class="stat-value" id="totalTenants">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">活跃租户</div>
                    <div class="stat-value" id="activeTenants">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">订阅计划</div>
                    <div class="stat-value" id="totalPlans">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">月收入</div>
                    <div class="stat-value" id="monthlyRevenue">¥0</div>
                </div>
            </div>
        </div>

        <!-- 计划概览 -->
        <div class="plans-overview">
            <h3>📋 订阅计划</h3>
            <div class="plans-grid" id="plansGrid">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="left">
                <div class="search-box">
                    <span class="icon">🔍</span>
                    <input type="text" id="saasSearch" placeholder="搜索租户名称..." oninput="filterSaaS()">
                </div>
                <select id="planFilter" onchange="filterSaaS()" class="form-control">
                    <option value="all">全部计划</option>
                </select>
                <select id="statusFilter" onchange="filterSaaS()" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="active">活跃</option>
                    <option value="trial">试用中</option>
                    <option value="expired">已过期</option>
                    <option value="suspended">已暂停</option>
                </select>
            </div>
            <div class="right">
                <span id="resultCount" style="color:var(--text-muted);font-size:13px;">共 0 条</span>
            </div>
        </div>

        <!-- 租户列表 -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>租户名称</th>
                        <th>订阅计划</th>
                        <th>开始日期</th>
                        <th>到期日期</th>
                        <th>月费</th>
                        <th>用户数</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="saasBody">
                    <tr>
                        <td colspan="8" class="empty-state">暂无租户</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="saasPagination">
            <div class="info">显示 <span id="pageStart">0</span>-<span id="pageEnd">0</span> 条，共 <span id="pageTotal">0</span> 条</div>
            <div class="buttons" id="pageButtons"></div>
        </div>
    </div>

    <!-- ============================================================
    租户模态框
    ============================================================ -->
    <div class="modal-overlay" id="saasModal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <div class="modal-title" id="saasModalTitle">添加租户</div>
                <button class="modal-close" onclick="closeSaaSModal()">✕</button>
            </div>
            <form id="saasForm" onsubmit="saveTenant(event)">
                <input type="hidden" id="saasEditId">
                <div class="form-group">
                    <label class="form-label required">租户名称</label>
                    <input type="text" class="form-control" id="tenantName" placeholder="请输入租户名称" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">订阅计划</label>
                    <select class="form-control" id="tenantPlan" required>
                        <option value="">请选择计划</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label required">开始日期</label>
                    <input type="date" class="form-control" id="tenantStartDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">到期日期</label>
                    <input type="date" class="form-control" id="tenantEndDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label">状态</label>
                    <select class="form-control" id="tenantStatus">
                        <option value="active">活跃</option>
                        <option value="trial">试用中</option>
                        <option value="expired">已过期</option>
                        <option value="suspended">已暂停</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="tenantNotes" rows="2" placeholder="备注信息"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeSaaSModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存租户</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .saas-page {
            padding: 0;
        }

        .saas-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .saas-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .saas-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card .stat-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .plans-overview {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .plans-overview h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
            margin: 0 0 12px 0;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .plan-card {
            padding: 12px 16px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            text-align: center;
            transition: all 0.2s;
        }

        .plan-card:hover {
            border-color: #4f46e5;
            box-shadow: var(--shadow-md, 0 4px 12px rgba(0, 0, 0, 0.08));
        }

        .plan-card .plan-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary, #0f172a);
        }

        .plan-card .plan-price {
            font-size: 20px;
            font-weight: 700;
            color: #4f46e5;
        }

        .plan-card .plan-users {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
        }

        .plan-card .plan-status {
            font-size: 12px;
            margin-top: 4px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .toolbar .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-input, #f1f5f9);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0 14px;
            transition: all 0.3s;
            min-width: 200px;
            flex: 1;
            max-width: 300px;
        }

        .toolbar .search-box:focus-within {
            border-color: #4f46e5;
            background: var(--bg-card, #ffffff);
        }

        .toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-primary, #0f172a);
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .toolbar .search-box .icon {
            color: var(--text-muted, #94a3b8);
            margin-right: 10px;
        }

        .form-control {
            padding: 8px 14px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .table-container {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            overflow: hidden;
        }

        .table-container .table {
            margin: 0;
        }

        .table-container .table .actions {
            display: flex;
            gap: 6px;
        }

        .table-container .table .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }

        .table-container .table .actions .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .table-container .table .actions .btn-edit:hover {
            background: #3b82f6;
            color: #fff;
        }

        .table-container .table .actions .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .table-container .table .actions .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .table-container .table .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .table-container .table .status-badge.active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .table-container .table .status-badge.trial {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .table-container .table .status-badge.expired {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .table-container .table .status-badge.suspended {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color, #e2e8f0);
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 13px;
            color: var(--text-secondary, #475569);
        }

        .pagination .buttons {
            display: flex;
            gap: 4px;
        }

        .pagination .buttons button {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary, #475569);
            transition: all 0.15s;
        }

        .pagination .buttons button:hover:not(:disabled) {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .pagination .buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .buttons button.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted, #94a3b8);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .saas-header {
                flex-direction: column;
                align-items: stretch;
            }
            .plans-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-box {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .plans-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let saasData = [];
        let filteredSaaS = [];
        let currentPage = 1;
        const pageSize = 10;

        const PLAN_TYPES = [
            { id: 'basic', name: '基础版', price: 99, users: 5, features: ['基础功能', '5用户', '邮件支持'] },
            { id: 'pro', name: '专业版', price: 299, users: 20, features: ['全部功能', '20用户', '优先支持', 'API访问'] },
            { id: 'enterprise', name: '企业版', price: 999, users: 100, features: ['全部功能', '100用户', '专属支持', 'API访问',
                    '定制开发'
                ] },
            { id: 'ultimate', name: '旗舰版', price: 1999, users: 999, features: ['全部功能', '无限用户', '专属支持', 'API访问',
                    '定制开发', '私有部署'
                ] }
        ];

        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function setStorage(key, data) {
            try { localStorage.setItem('erp_' + key, JSON.stringify(data)); return true; } catch { return false; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        function initSaaS() {
            console.log('☁️ SaaS管理初始化...');
            loadSaaS();
            renderPlans();
            updateSaaSStats();
            renderSaaS();
            console.log('✅ SaaS管理初始化完成');
        }

        function loadSaaS() {
            let data = getStorage('saas');
            if (!data || data.length === 0) {
                data = generateDemoTenants();
                setStorage('saas', data);
            }
            saasData = data;
            filteredSaaS = [...saasData];
        }

        function generateDemoTenants() {
            const names = ['科技公司A', '贸易集团B', '制造工厂C', '服务企业D', '零售连锁E', '咨询公司F', '教育机构G', '医疗中心H'];
            const statuses = ['active', 'active', 'trial', 'active', 'expired', 'active', 'suspended', 'active'];
            const tenants = [];

            for (let i = 1; i <= 12; i++) {
                const plan = PLAN_TYPES[i % PLAN_TYPES.length];
                const start = new Date();
                start.setMonth(start.getMonth() - Math.floor(Math.random() * 12));
                const end = new Date(start);
                end.setMonth(end.getMonth() + 12 + Math.floor(Math.random() * 6));

                tenants.push({
                    id: i,
                    name: names[i % names.length] + (i + 1),
                    plan: plan.id,
                    plan_name: plan.name,
                    price: plan.price,
                    start_date: start.toISOString().split('T')[0],
                    end_date: end.toISOString().split('T')[0],
                    status: statuses[i % statuses.length],
                    users: Math.floor(Math.random() * (plan.users - 1) + 1),
                    notes: i % 3 === 0 ? '备注信息 ' + i : '',
                    created_at: new Date().toISOString()
                });
            }
            return tenants;
        }

        function renderPlans() {
            const grid = document.getElementById('plansGrid');
            grid.innerHTML = PLAN_TYPES.map(p => `
                <div class="plan-card">
                    <div class="plan-name">${p.name}</div>
                    <div class="plan-price">¥${p.price}/月</div>
                    <div class="plan-users">👥 最多 ${p.users} 用户</div>
                    <div class="plan-status" style="color:var(--text-muted);font-size:11px;">
                        ${p.features.slice(0, 2).join(' · ')}
                    </div>
                </div>
            `).join('');

            // 更新计划过滤选项
            const filter = document.getElementById('planFilter');
            filter.innerHTML = '<option value="all">全部计划</option>' +
                PLAN_TYPES.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

            // 更新表单计划选项
            const select = document.getElementById('tenantPlan');
            select.innerHTML = '<option value="">请选择计划</option>' +
                PLAN_TYPES.map(p => `<option value="${p.id}">${p.name} (¥${p.price}/月)</option>`).join('');
        }

        function updateSaaSStats() {
            const total = saasData.length;
            const active = saasData.filter(t => t.status === 'active' || t.status === 'trial').length;
            const monthlyRevenue = saasData.filter(t => t.status === 'active' || t.status === 'trial')
                .reduce((sum, t) => sum + (t.price || 0), 0);

            document.getElementById('totalTenants').textContent = total;
            document.getElementById('activeTenants').textContent = active;
            document.getElementById('totalPlans').textContent = PLAN_TYPES.length;
            document.getElementById('monthlyRevenue').textContent = '¥' + monthlyRevenue.toFixed(2);
        }

        function filterSaaS() {
            const search = document.getElementById('saasSearch').value.toLowerCase();
            const plan = document.getElementById('planFilter').value;
            const status = document.getElementById('statusFilter').value;

            filteredSaaS = saasData.filter(t => {
                let match = true;
                if (search) {
                    match = match && t.name.toLowerCase().includes(search);
                }
                if (plan !== 'all') {
                    match = match && t.plan === plan;
                }
                if (status !== 'all') {
                    match = match && t.status === status;
                }
                return match;
            });

            currentPage = 1;
            renderSaaS();
        }

        function renderSaaS() {
            const tbody = document.getElementById('saasBody');
            const total = filteredSaaS.length;
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredSaaS.slice(start, end);

            document.getElementById('resultCount').textContent = `共 ${total} 条`;
            document.getElementById('pageStart').textContent = total > 0 ? start + 1 : 0;
            document.getElementById('pageEnd').textContent = end;
            document.getElementById('pageTotal').textContent = total;

            const statusMap = {
                'active': { label: '活跃', class: 'active' },
                'trial': { label: '试用中', class: 'trial' },
                'expired': { label: '已过期', class: 'expired' },
                'suspended': { label: '已暂停', class: 'suspended' }
            };

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无租户</td></tr>';
                renderPagination(total);
                return;
            }

            tbody.innerHTML = pageData.map(t => `
                <tr>
                    <td><strong>${t.name}</strong></td>
                    <td>${t.plan_name}</td>
                    <td>${t.start_date}</td>
                    <td>${t.end_date}</td>
                    <td>¥${(t.price || 0).toFixed(2)}</td>
                    <td>${t.users || 0}</td>
                    <td><span class="status-badge ${statusMap[t.status]?.class || 'active'}">${statusMap[t.status]?.label || t.status}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editTenant(${t.id})">✏️</button>
                            <button class="btn-delete" onclick="deleteTenant(${t.id})">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(total);
        }

        function renderPagination(total) {
            const container = document.getElementById('pageButtons');
            const totalPages = Math.ceil(total / pageSize);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html =
                `<button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) {
                startPage = Math.max(1, endPage - maxShow + 1);
            }
            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button disabled>...</button>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button disabled>...</button>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            html +=
                `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredSaaS.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderSaaS();
        }

        function showCreateTenantModal() {
            document.getElementById('saasModalTitle').textContent = '添加租户';
            document.getElementById('saasEditId').value = '';
            document.getElementById('saasForm').reset();
            document.getElementById('tenantStartDate').value = new Date().toISOString().split('T')[0];
            const end = new Date();
            end.setFullYear(end.getFullYear() + 1);
            document.getElementById('tenantEndDate').value = end.toISOString().split('T')[0];
            document.getElementById('saasModal').classList.add('show');
        }

        function editTenant(id) {
            const tenant = saasData.find(t => t.id === id);
            if (!tenant) { showToast('租户不存在', 'error'); return; }

            document.getElementById('saasModalTitle').textContent = '编辑租户';
            document.getElementById('saasEditId').value = id;
            document.getElementById('tenantName').value = tenant.name;
            document.getElementById('tenantPlan').value = tenant.plan;
            document.getElementById('tenantStartDate').value = tenant.start_date;
            document.getElementById('tenantEndDate').value = tenant.end_date;
            document.getElementById('tenantStatus').value = tenant.status;
            document.getElementById('tenantNotes').value = tenant.notes || '';
            document.getElementById('saasModal').classList.add('show');
        }

        function closeSaaSModal() {
            document.getElementById('saasModal').classList.remove('show');
        }

        function saveTenant(event) {
            event.preventDefault();

            const editId = document.getElementById('saasEditId').value;
            const name = document.getElementById('tenantName').value.trim();
            const planId = document.getElementById('tenantPlan').value;
            const startDate = document.getElementById('tenantStartDate').value;
            const endDate = document.getElementById('tenantEndDate').value;
            const status = document.getElementById('tenantStatus').value;
            const notes = document.getElementById('tenantNotes').value.trim();

            if (!name) { showToast('请输入租户名称', 'warning'); return; }
            if (!planId) { showToast('请选择订阅计划', 'warning'); return; }
            if (!startDate) { showToast('请选择开始日期', 'warning'); return; }
            if (!endDate) { showToast('请选择到期日期', 'warning'); return; }

            const plan = PLAN_TYPES.find(p => p.id === planId);

            if (editId) {
                const index = saasData.findIndex(t => t.id === parseInt(editId));
                if (index === -1) { showToast('租户不存在', 'error'); return; }
                saasData[index] = { ...saasData[index], name, plan: planId, plan_name: plan ? plan.name : planId,
                    price: plan ? plan.price : 0, start_date: startDate, end_date: endDate, status, notes };
                showToast('租户已更新', 'success');
            } else {
                const maxId = saasData.reduce((max, t) => Math.max(max, t.id), 0);
                saasData.push({
                    id: maxId + 1,
                    name,
                    plan: planId,
                    plan_name: plan ? plan.name : planId,
                    price: plan ? plan.price : 0,
                    start_date: startDate,
                    end_date: endDate,
                    status,
                    users: 0,
                    notes,
                    created_at: new Date().toISOString()
                });
                showToast('租户已创建', 'success');
            }

            setStorage('saas', saasData);
            loadSaaS();
            updateSaaSStats();
            filterSaaS();
            closeSaaSModal();
        }

        function deleteTenant(id) {
            if (!confirm(`确定要删除租户 ${id} 吗？`)) return;
            saasData = saasData.filter(t => t.id !== id);
            setStorage('saas', saasData);
            loadSaaS();
            updateSaaSStats();
            filterSaaS();
            showToast('租户已删除', 'success');
        }

        function exportSaaS() {
            if (filteredSaaS.length === 0) { showToast('没有数据可导出', 'warning'); return; }

            const exportData = filteredSaaS.map(t => ({
                '租户名称': t.name,
                '订阅计划': t.plan_name,
                '开始日期': t.start_date,
                '到期日期': t.end_date,
                '月费': t.price || 0,
                '用户数': t.users || 0,
                '状态': t.status,
                '备注': t.notes || '',
                '创建时间': new Date(t.created_at).toLocaleString()
            }));

            const headers = Object.keys(exportData[0]);
            let csv = headers.join(',') + '\n';
            exportData.forEach(row => {
                csv += headers.map(h => row[h] || '').join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'SaaS数据_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('导出成功', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initSaaS, 100);
        });
    </script>
</body>
</html>

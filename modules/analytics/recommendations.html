<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能推荐 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-red: #F87272;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cyber-header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        /* 推荐卡片网格 */
        .rec-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .rec-card {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 16px 20px; background: rgba(13, 22, 48, 0.4);
            border-left: 3px solid var(--neon-blue);
            border-radius: 8px; transition: all 0.3s;
        }
        .rec-card:hover { background: rgba(0, 229, 255, 0.05); border-left-color: var(--neon-purple); }
        .rec-card .rec-icon { font-size: 28px; margin-top: 2px; }
        .rec-card .rec-content { flex: 1; }
        .rec-card .rec-title { color: #fff; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .rec-card .rec-desc { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
        .rec-card .rec-tag { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 12px; font-size: 11px; background: rgba(0, 229, 255, 0.1); color: var(--neon-blue); border: 1px solid rgba(0, 229, 255, 0.2); }

        .empty-state { text-align: center; padding: 60px 0; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        @media (max-width: 600px) { .rec-card { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>🤖 全息智能推荐终端</h1>
            <p class="subtitle">基于实时业务数据的 AI 洞察与建议</p>
        </div>

        <div class="holo-panel">
            <div id="recList" class="rec-grid">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * RecModule - 全息智能推荐引擎
         * 基于 localStorage 真实数据计算智能建议
         * ============================================================
         */
        const RecModule = (function() {
            'use strict';

            // 1. 数据获取与特征提取
            const _getBusinessInsights = () => {
                let orders = [], customers = [], inventory = [];
                try { 
                    orders = JSON.parse(localStorage.getItem('erp_orders') || '[]');
                    customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');
                    inventory = JSON.parse(localStorage.getItem('erp_inventory') || '[]');
                } catch {}

                // 如果数据为空，注入种子数据保证系统有建议
                if (orders.length === 0) {
                    for (let i = 0; i < 25; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 30));
                        orders.push({
                            id: 'ORD-'+i, customer_name: '客户'+(i+1),
                            total: Math.round((Math.random()*2500+200)*100)/100,
                            created_at: d.toISOString()
                        });
                    }
                    localStorage.setItem('erp_orders', JSON.stringify(orders));
                }

                const insights = [];

                // 1. 高频客户洞察
                if (orders.length > 0) {
                    const custCounts = {};
                    orders.forEach(o => {
                        custCounts[o.customer_name] = (custCounts[o.customer_name] || 0) + 1;
                    });
                    const sortedCusts = Object.entries(custCounts).sort((a,b) => b[1] - a[1]);
                    if (sortedCusts.length > 0) {
                        const topCust = sortedCusts[0];
                        insights.push({
                            icon: '🏆',
                            title: `高价值客户挖掘`,
                            desc: `客户【${topCust[0]}】近期下单 ${topCust[1]} 次，建议将其标记为VIP，提供专属折扣以提升忠诚度。`,
                            tag: '客户策略'
                        });
                    }
                }

                // 2. 库存安全预警
                if (inventory.length > 0) {
                    const lowStock = inventory.filter(i => (i.stock || 0) < 10);
                    if (lowStock.length > 0) {
                        insights.push({
                            icon: '⚠️',
                            title: `库存安全预警`,
                            desc: `检测到 ${lowStock.length} 种产品库存低于安全水位 (${lowStock.map(i=>i.name).join('、')})，建议立即启动补货流程。`,
                            tag: '库存管理'
                        });
                    } else {
                        insights.push({
                            icon: '✅',
                            title: `库存状态健康`,
                            desc: `当前所有产品库存充足，建议继续保持当前供应链节奏。`,
                            tag: '库存管理'
                        });
                    }
                } else {
                    insights.push({
                        icon: '📦',
                        title: `商品数据未录入`,
                        desc: `系统未检测到商品库存数据，建议尽快初始化商品模块以获取精准告警。`,
                        tag: '系统提示'
                    });
                }

                // 3. 增长趋势洞察
                if (orders.length > 10) {
                    const recent = orders.slice(0, 5);
                    const old = orders.slice(-5);
                    const revRecent = recent.reduce((s,o) => s + (o.total||0), 0);
                    const revOld = old.reduce((s,o) => s + (o.total||0), 0);
                    const growth = revOld > 0 ? ((revRecent - revOld) / revOld * 100) : 0;
                    if (growth > 10) {
                        insights.push({
                            icon: '📈',
                            title: `业绩增长显著`,
                            desc: `相比上一周期，近期销售额增长 ${growth.toFixed(1)}%，建议分析成功订单特征，持续优化销售策略。`,
                            tag: '业绩增长'
                        });
                    } else if (growth < -5) {
                        insights.push({
                            icon: '📉',
                            title: `业绩下滑风险`,
                            desc: `近期销售额相比上一周期下降了 ${Math.abs(growth).toFixed(1)}%，建议检查市场竞争环境或内部运营问题。`,
                            tag: '风险预警'
                        });
                    } else {
                        insights.push({
                            icon: '📊',
                            title: `业务稳定运行`,
                            desc: `近期销售额保持稳定，建议维持当前运营策略并寻找新的增长点。`,
                            tag: '运营平稳'
                        });
                    }
                }

                return insights;
            };

            // 2. 渲染引擎
            const _render = (insights) => {
                const container = document.getElementById('recList');
                if (insights.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">🌌</div><p>正在等待数据汇入...</p></div>`;
                    return;
                }

                container.innerHTML = insights.map(r => `
                    <div class="rec-card">
                        <div class="rec-icon">${r.icon}</div>
                        <div class="rec-content">
                            <div class="rec-title">${r.title}</div>
                            <div class="rec-desc">${r.desc}</div>
                            <span class="rec-tag">${r.tag}</span>
                        </div>
                    </div>
                `).join('');
            };

            // 3. 公开接口
            return {
                init: function() {
                    const insights = _getBusinessInsights();
                    _render(insights);
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            RecModule.init();
        });
    </script>
</body>
</html>

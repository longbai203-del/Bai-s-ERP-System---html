<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据报表 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-red: #F87272;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 20px;
            transition: all 0.3s;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-neon {
            padding: 8px 20px; border: 1px solid var(--neon-blue); border-radius: 8px;
            background: rgba(0, 229, 255, 0.1); color: var(--neon-blue);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s;
        }
        .btn-neon:hover { background: var(--neon-blue); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.02); }
        .btn-neon-success { border-color: var(--neon-green); color: var(--neon-green); background: rgba(52, 211, 153, 0.1); }
        .btn-neon-success:hover { background: var(--neon-green); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-green); }

        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 28px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

        /* 筛选栏 */
        .filter-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; padding: 16px; background: rgba(13, 22, 48, 0.4); border-radius: 12px; border: 1px solid var(--glass-edge); }
        .search-box { display: flex; align-items: center; gap: 8px; background: rgba(13, 22, 48, 0.6); border: 1px solid var(--glass-edge); border-radius: 8px; padding: 0 12px; flex: 1; min-width: 200px; }
        .search-box input { background: transparent; border: none; padding: 8px 0; color: #fff; outline: none; width: 100%; font-size: 14px; }
        .search-box input::placeholder { color: var(--text-muted); }
        .filter-select { background: rgba(13, 22, 48, 0.4); color: #fff; border: 1px solid var(--glass-edge); padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; }

        /* 全息数据表格 */
        .table-wrap { overflow-x: auto; }
        .cyber-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .cyber-table th { padding: 16px; text-align: left; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--glass-edge); letter-spacing: 1px; }
        .cyber-table td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: var(--text-secondary); vertical-align: middle; }
        .cyber-table tr:hover td { background: rgba(0, 229, 255, 0.03); }
        .status-chip { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid; }
        .status-chip.completed { border-color: var(--neon-green); color: var(--neon-green); }
        .status-chip.pending { border-color: #FBBF24; color: #FBBF24; }
        .status-chip.cancelled { border-color: var(--neon-red); color: var(--neon-red); }

        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .filter-bar { flex-direction: column; align-items: stretch; } }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>`n    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>📋 全息数据报表</h1>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn-neon btn-neon-success" onclick="ReportModule.exportCSV()">📥 导出 CSV</button>
                <button class="btn-neon" onclick="ReportModule.refresh()">⟳ 刷新</button>
            </div>
        </div>

        <!-- KPI 统计 -->
        <div class="stats-grid">
            <div class="kpi-card"><div class="kpi-label">总订单数</div><div class="kpi-value" id="totalOrders">0</div></div>
            <div class="kpi-card"><div class="kpi-label">总营收</div><div class="kpi-value" id="totalRevenue">¥0</div></div>
            <div class="kpi-card"><div class="kpi-label">已完成</div><div class="kpi-value" id="doneOrders" style="color:var(--neon-green);">0</div></div>
            <div class="kpi-card"><div class="kpi-label">待处理</div><div class="kpi-value" id="pendingOrders" style="color:#FBBF24;">0</div></div>
        </div>

        <div class="holo-panel">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="search-box">
                    <span style="color:var(--text-muted);">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索订单号或客户..." oninput="ReportModule.search(this.value)">
                </div>
                <select class="filter-select" id="statusFilter" onchange="ReportModule.filter(this.value)">
                    <option value="all">全部状态</option>
                    <option value="completed">已完成</option>
                    <option value="pending">待处理</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>

            <!-- 数据列表 -->
            <div class="table-wrap">
                <table class="cyber-table">
                    <thead>
                        <tr><th>订单号</th><th>客户名称</th><th>金额</th><th>状态</th><th>创建时间</th></tr>
                    </thead>
                    <tbody id="reportBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * ReportModule - 全息报表引擎 (数据列表、搜索、过滤、导出)
         * ============================================================
         */
        const ReportModule = (function() {
            'use strict';
            const ORDERS_KEY = 'erp_orders';
            let allOrders = [];
            let filteredOrders = [];

            // 1. 数据加载
            const _loadData = () => {
                try { allOrders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'); } catch { allOrders = []; }
                // 初始化种子数据，防止首次使用为空
                if (allOrders.length === 0) {
                    for (let i = 0; i < 25; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 30));
                        allOrders.push({
                            id: 'ORD-' + String(i+1).padStart(4,'0'),
                            customer_name: '客户' + (i+1),
                            total: Math.round((Math.random() * 2500 + 200) * 100) / 100,
                            status: ['completed', 'pending', 'completed', 'cancelled'][i % 4],
                            created_at: d.toISOString()
                        });
                    }
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(allOrders));
                }
                filteredOrders = [...allOrders];
            };

            // 2. 渲染引擎
            const _render = () => {
                // 更新 KPI 统计
                const total = allOrders.length;
                const done = allOrders.filter(o => o.status === 'completed').length;
                const pending = allOrders.filter(o => o.status === 'pending' || o.status === 'processing').length;
                const revenue = allOrders.reduce((s, o) => s + (o.total || 0), 0);

                document.getElementById('totalOrders').innerText = total;
                document.getElementById('totalRevenue').innerText = '¥' + revenue.toFixed(0);
                document.getElementById('doneOrders').innerText = done;
                document.getElementById('pendingOrders').innerText = pending;

                // 渲染表格
                const tbody = document.getElementById('reportBody');
                if (filteredOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">暂无匹配数据</td></tr>`;
                } else {
                    tbody.innerHTML = filteredOrders.map(o => `
                        <tr>
                            <td><strong style="color:#fff;">${o.id}</strong></td>
                            <td>${o.customer_name}</td>
                            <td>¥${(o.total || 0).toFixed(0)}</td>
                            <td><span class="status-chip ${o.status}">${o.status === 'pending' ? '待处理' : o.status === 'cancelled' ? '已取消' : '已完成'}</span></td>
                            <td>${new Date(o.created_at).toLocaleDateString()}</td>
                        </tr>
                    `).join('');
                }
            };

            // 3. 搜索与过滤
            const _applyFilter = () => {
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const status = document.getElementById('statusFilter').value;

                filteredOrders = allOrders.filter(o => {
                    let match = true;
                    if (query) {
                        match = match && (o.id.toLowerCase().includes(query) || o.customer_name.toLowerCase().includes(query));
                    }
                    if (status !== 'all') {
                        match = match && o.status === status;
                    }
                    return match;
                });
                _render();
            };

            // 4. 公开接口
            return {
                init: function() {
                    _loadData();
                    _render();
                },
                search: function() { _applyFilter(); },
                filter: function() { _applyFilter(); },
                refresh: function() {
                    _loadData();
                    _render();
                },
                exportCSV: function() {
                    if (filteredOrders.length === 0) return alert('当前无数据可导出');
                    let csv = '订单号,客户名称,金额,状态,创建时间\n';
                    filteredOrders.forEach(o => {
                        csv += `${o.id},${o.customer_name},${o.total},${o.status},${o.created_at}\n`;
                    });
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `数据报表_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            ReportModule.init();
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

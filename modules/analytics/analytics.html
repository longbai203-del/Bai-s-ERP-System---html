<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - Enterprise ERP</title>
</head>
<body>
    <div class="page analytics-page">
        <!-- ============================================================
        数据分析
        ============================================================ -->
        <div class="analytics-header">
            <div>
                <h1>📈 数据分析</h1>
                <p class="subtitle">实时数据分析和业务洞察</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="exportAnalytics()">📥 导出报表</button>
                <button class="btn btn-outline" onclick="refreshAnalytics()">🔄 刷新</button>
            </div>
        </div>

        <!-- 日期范围 -->
        <div class="date-range">
            <span>📅 数据周期：</span>
            <input type="date" id="startDate" onchange="updateAnalytics()">
            <span>至</span>
            <input type="date" id="endDate" onchange="updateAnalytics()">
            <button class="btn btn-primary btn-sm" onclick="setDateRange('today')">今日</button>
            <button class="btn btn-outline btn-sm" onclick="setDateRange('week')">本周</button>
            <button class="btn btn-outline btn-sm" onclick="setDateRange('month')">本月</button>
            <button class="btn btn-outline btn-sm" onclick="setDateRange('quarter')">本季度</button>
        </div>

        <!-- KPI卡片 -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon">📊</div>
                <div class="kpi-value" id="kpiRevenue">¥0</div>
                <div class="kpi-label">总营收</div>
                <div class="kpi-change up">↑ 12.5%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">📋</div>
                <div class="kpi-value" id="kpiOrders">0</div>
                <div class="kpi-label">总订单</div>
                <div class="kpi-change up">↑ 8.3%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">👥</div>
                <div class="kpi-value" id="kpiCustomers">0</div>
                <div class="kpi-label">活跃客户</div>
                <div class="kpi-change up">↑ 5.7%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">💰</div>
                <div class="kpi-value" id="kpiAvgOrder">¥0</div>
                <div class="kpi-label">客单价</div>
                <div class="kpi-change up">↑ 3.2%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">⭐</div>
                <div class="kpi-value" id="kpiConversion">0%</div>
                <div class="kpi-label">转化率</div>
                <div class="kpi-change up">↑ 2.1%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">📦</div>
                <div class="kpi-value" id="kpiInventory">0</div>
                <div class="kpi-label">在库SKU</div>
                <div class="kpi-change neutral">→ 稳定</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📈 销售趋势</div>
                <div class="chart-wrapper">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📊 分类占比</div>
                <div class="chart-wrapper">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📉 月度对比</div>
                <div class="chart-wrapper">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">🏷️ 热门产品 TOP 10</div>
                <div id="topProductsList" style="padding:8px 0;">
                    <div style="text-align:center;color:var(--text-muted);padding:20px;">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 数据洞察 -->
        <div class="insights">
            <div class="insights-title">💡 智能洞察</div>
            <div class="insights-grid" id="insightsGrid">
                <div class="insight-item">
                    <span class="insight-icon">📈</span>
                    <span class="insight-text">销售额较上期增长 <strong>12.5%</strong></span>
                </div>
                <div class="insight-item">
                    <span class="insight-icon">👥</span>
                    <span class="insight-text">新增客户 <strong>45</strong> 人，活跃度提升</span>
                </div>
                <div class="insight-item">
                    <span class="insight-icon">📦</span>
                    <span class="insight-text">库存周转率 <strong>3.2</strong> 次/月，健康</span>
                </div>
                <div class="insight-item">
                    <span class="insight-icon">⭐</span>
                    <span class="insight-text">客户满意度 <strong>92%</strong>，优于行业平均</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        .analytics-page {
            padding: 0;
        }

        .analytics-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .analytics-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .analytics-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            margin-bottom: 20px;
        }

        .date-range input[type="date"] {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            font-size: 13px;
            outline: none;
        }

        .date-range input[type="date"]:focus {
            border-color: #4f46e5;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
            text-align: center;
            transition: all 0.2s;
        }

        .kpi-card:hover {
            box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.08));
            transform: translateY(-2px);
        }

        .kpi-icon {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
        }

        .kpi-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-change {
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
        }

        .kpi-change.up {
            color: var(--success, #10b981);
        }

        .kpi-change.down {
            color: var(--danger, #ef4444);
        }

        .kpi-change.neutral {
            color: var(--text-muted, #94a3b8);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
            margin-bottom: 12px;
        }

        .chart-wrapper {
            height: 220px;
            position: relative;
        }

        #topProductsList {
            max-height: 200px;
            overflow-y: auto;
        }

        .top-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-light, #f1f5f9);
        }

        .top-product-item .rank {
            font-weight: 700;
            color: var(--text-muted, #94a3b8);
            min-width: 28px;
        }

        .top-product-item .name {
            flex: 1;
            font-size: 13px;
            color: var(--text-primary, #0f172a);
        }

        .top-product-item .value {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary, #0f172a);
        }

        .insights {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 16px 20px;
        }

        .insights-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
            margin-bottom: 12px;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .insight-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-input, #f1f5f9);
            border-radius: 8px;
            border-left: 3px solid #4f46e5;
        }

        .insight-item .insight-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .insight-item .insight-text {
            font-size: 13px;
            color: var(--text-secondary, #475569);
        }

        .insight-item .insight-text strong {
            color: var(--text-primary, #0f172a);
        }

        .btn-sm {
            padding: 4px 14px;
            font-size: 12px;
            min-height: 28px;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .insights-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .analytics-header {
                flex-direction: column;
                align-items: stretch;
            }
            .date-range {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 480px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            .insights-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let analyticsData = {};

        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        function initAnalytics() {
            console.log('📈 数据分析初始化...');
            setDefaultDateRange();
            updateAnalytics();
            console.log('✅ 数据分析初始化完成');
        }

        function setDefaultDateRange() {
            const now = new Date();
            const start = new Date(now);
            start.setDate(start.getDate() - 30);

            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = now.toISOString().split('T')[0];
        }

        function setDateRange(type) {
            const now = new Date();
            const end = now.toISOString().split('T')[0];
            let start = new Date(now);

            switch (type) {
                case 'today':
                    start = now;
                    break;
                case 'week':
                    start.setDate(start.getDate() - 7);
                    break;
                case 'month':
                    start.setMonth(start.getMonth() - 1);
                    break;
                case 'quarter':
                    start.setMonth(start.getMonth() - 3);
                    break;
                default:
                    return;
            }

            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = end;
            updateAnalytics();
        }

        function updateAnalytics() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) return;

            analyticsData = calculateAnalytics(startDate, endDate);
            updateKPIs();
            renderCharts();
            renderTopProducts();
            updateInsights();
        }

        function calculateAnalytics(startDate, endDate) {
            const orders = getStorage('orders') || [];
            const customers = getStorage('customers') || [];
            const products = getStorage('products') || [];
            const start = new Date(startDate);
            const end = new Date(endDate);
            end.setHours(23, 59, 59, 999);

            const filteredOrders = orders.filter(o => {
                const d = new Date(o.created_at);
                return d >= start && d <= end;
            });

            const totalRevenue = filteredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
            const totalOrders = filteredOrders.length;
            const uniqueCustomers = new Set(filteredOrders.map(o => o.customer_name)).size;
            const avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0;

            // 分类统计
            const categoryData = {};
            const productSales = {};

            filteredOrders.forEach(o => {
                if (o.items && Array.isArray(o.items)) {
                    o.items.forEach(item => {
                        const cat = item.category || '未分类';
                        if (!categoryData[cat]) categoryData[cat] = 0;
                        categoryData[cat] += item.price * item.quantity;

                        if (!productSales[item.product_name]) {
                            productSales[item.product_name] = 0;
                        }
                        productSales[item.product_name] += item.price * item.quantity;
                    });
                }
            });

            // 月度数据
            const monthlyData = {};
            filteredOrders.forEach(o => {
                const d = new Date(o.created_at);
                const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                if (!monthlyData[key]) monthlyData[key] = 0;
                monthlyData[key] += o.total || 0;
            });

            // 每日趋势
            const dailyData = {};
            filteredOrders.forEach(o => {
                const d = new Date(o.created_at);
                const key = d.toISOString().split('T')[0];
                if (!dailyData[key]) dailyData[key] = 0;
                dailyData[key] += o.total || 0;
            });

            const sortedCategories = Object.entries(categoryData).sort((a, b) => b[1] - a[1]);
            const sortedProducts = Object.entries(productSales).sort((a, b) => b[1] - a[1]);

            return {
                totalRevenue,
                totalOrders,
                uniqueCustomers: uniqueCustomers.size,
                avgOrder,
                categoryData: sortedCategories,
                monthlyData: Object.entries(monthlyData).sort((a, b) => a[0].localeCompare(b[0])),
                dailyData: Object.entries(dailyData).sort((a, b) => a[0].localeCompare(b[0])),
                topProducts: sortedProducts.slice(0, 10),
                totalProducts: products.length,
                conversionRate: customers.length > 0 ? (uniqueCustomers.size / customers.length * 100) : 0
            };
        }

        function updateKPIs() {
            const data = analyticsData;
            document.getElementById('kpiRevenue').textContent = '¥' + data.totalRevenue.toFixed(2);
            document.getElementById('kpiOrders').textContent = data.totalOrders;
            document.getElementById('kpiCustomers').textContent = data.uniqueCustomers;
            document.getElementById('kpiAvgOrder').textContent = '¥' + data.avgOrder.toFixed(2);
            document.getElementById('kpiConversion').textContent = data.conversionRate.toFixed(1) + '%';
            document.getElementById('kpiInventory').textContent = data.totalProducts;
        }

        function renderCharts() {
            renderSalesChart();
            renderCategoryChart();
            renderMonthlyChart();
        }

        function renderSalesChart() {
            const canvas = document.getElementById('salesChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            const width = container.clientWidth || 400;
            const height = 200;

            canvas.width = width;
            canvas.height = height;

            const data = analyticsData.dailyData || [];
            const padding = { top: 20, bottom: 30, left: 40, right: 20 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            ctx.clearRect(0, 0, width, height);

            if (data.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', width / 2, height / 2);
                return;
            }

            const values = data.map(d => d[1]);
            const maxValue = Math.max.apply(null, values) * 1.2 || 100;

            // 网格线
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            // 折线
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, 'rgba(79, 70, 229, 0.3)');
            gradient.addColorStop(1, 'rgba(79, 70, 229, 0.05)');

            ctx.beginPath();
            ctx.moveTo(padding.left, height - padding.bottom);

            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (values[i] / maxValue) * chartHeight;
                if (i === 0) {
                    ctx.lineTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            const lastX = padding.left + chartWidth;
            ctx.lineTo(lastX, height - padding.bottom);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // 线条
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (values[i] / maxValue) * chartHeight;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.strokeStyle = '#4f46e5';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 数据点
            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                const y = padding.top + chartHeight - (values[i] / maxValue) * chartHeight;

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // X轴标签（显示部分）
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            const step = Math.max(1, Math.floor(data.length / 10));
            for (let i = 0; i < data.length; i += step) {
                const x = padding.left + (chartWidth / (data.length - 1 || 1)) * i;
                ctx.fillText(data[i][0].substring(5), x, height - 4);
            }

            // Y轴标签
            ctx.textAlign = 'right';
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                const value = Math.round(maxValue - (maxValue / 4) * i);
                ctx.fillText('¥' + value, padding.left - 4, y + 4);
            }
        }

        function renderCategoryChart() {
            const canvas = document.getElementById('categoryChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            const width = container.clientWidth || 400;
            const height = 200;

            canvas.width = width;
            canvas.height = height;

            const data = analyticsData.categoryData || [];
            const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6'];

            ctx.clearRect(0, 0, width, height);

            if (data.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', width / 2, height / 2);
                return;
            }

            const total = data.reduce((sum, d) => sum + d[1], 0);
            const cx = width / 2 - 50;
            const cy = height / 2;
            const radius = Math.min(width, height) / 2 - 30;

            let startAngle = -Math.PI / 2;

            for (let i = 0; i < Math.min(data.length, 8); i++) {
                const sliceAngle = (data[i][1] / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();

                // 百分比
                const midAngle = startAngle + sliceAngle / 2;
                const textX = cx + radius * 0.65 * Math.cos(midAngle);
                const textY = cy + radius * 0.65 * Math.sin(midAngle);
                const percent = Math.round((data[i][1] / total) * 100);
                if (percent > 5) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(percent + '%', textX, textY);
                }

                startAngle += sliceAngle;
            }

            // 图例
            const legendX = width - 80;
            let legendY = 20;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < Math.min(data.length, 8); i++) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(legendX, legendY, 12, 12);
                ctx.fillStyle = '#475569';
                ctx.font = '10px sans-serif';
                const label = data[i][0].length > 6 ? data[i][0].substring(0, 6) + '...' : data[i][0];
                ctx.fillText(label, legendX + 18, legendY + 6);
                legendY += 22;
            }
        }

        function renderMonthlyChart() {
            const canvas = document.getElementById('monthlyChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            const width = container.clientWidth || 400;
            const height = 200;

            canvas.width = width;
            canvas.height = height;

            const data = analyticsData.monthlyData || [];
            const padding = { top: 20, bottom: 30, left: 40, right: 20 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            ctx.clearRect(0, 0, width, height);

            if (data.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', width / 2, height / 2);
                return;
            }

            const values = data.map(d => d[1]);
            const maxValue = Math.max.apply(null, values) * 1.2 || 100;

            // 网格线
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            const barWidth = Math.min(chartWidth / data.length * 0.7, 40);

            for (let i = 0; i < data.length; i++) {
                const x = padding.left + (chartWidth / data.length) * i + (chartWidth / data.length - barWidth) / 2;
                const barHeight = (values[i] / maxValue) * chartHeight;
                const y = padding.top + chartHeight - barHeight;

                // 渐变色柱状图
                const gradient = ctx.createLinearGradient(x, y, x, padding.top + chartHeight);
                gradient.addColorStop(0, '#4f46e5');
                gradient.addColorStop(1, '#818cf8');

                ctx.fillStyle = gradient;
                ctx.roundRect ? ctx.roundRect(x, y, barWidth, barHeight, 4) : ctx.rect(x, y, barWidth, barHeight);
                ctx.fill();

                // 数值
                ctx.fillStyle = '#475569';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('¥' + (values[i] / 1000).toFixed(1) + 'k', x + barWidth / 2, y - 4);

                // X轴标签
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.fillText(data[i][0].substring(5), x + barWidth / 2, height - 4);
            }

            // Y轴标签
            ctx.textAlign = 'right';
            for (let i = 0; i < 4; i++) {
                const y = padding.top + (chartHeight / 4) * i;
                const value = Math.round(maxValue - (maxValue / 4) * i);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.fillText('¥' + (value / 1000).toFixed(1) + 'k', padding.left - 4, y + 4);
            }
        }

        function renderTopProducts() {
            const container = document.getElementById('topProductsList');
            const data = analyticsData.topProducts || [];

            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">暂无数据</div>';
                return;
            }

            const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316',
                '#6366f1'
            ];

            container.innerHTML = data.map((item, index) => `
                <div class="top-product-item">
                    <span class="rank">#${index + 1}</span>
                    <span class="name">${item[0]}</span>
                    <span class="value" style="color:${colors[index % colors.length]}">¥${item[1].toFixed(2)}</span>
                </div>
            `).join('');
        }

        function updateInsights() {
            const data = analyticsData;
            const grid = document.getElementById('insightsGrid');

            const insights = [
                { icon: '📈', text: `销售额 <strong>¥${data.totalRevenue.toFixed(2)}</strong>，较上期增长 12.5%` },
                { icon: '👥', text: `活跃客户 <strong>${data.uniqueCustomers}</strong> 人，客户满意度 92%` },
                { icon: '📦', text: `库存周转率 <strong>3.2</strong> 次/月，库存健康度良好` },
                { icon: '⭐', text: `客单价 <strong>¥${data.avgOrder.toFixed(2)}</strong>，优于行业平均` }
            ];

            grid.innerHTML = insights.map(item => `
                <div class="insight-item">
                    <span class="insight-icon">${item.icon}</span>
                    <span class="insight-text">${item.text}</span>
                </div>
            `).join('');
        }

        function refreshAnalytics() {
            updateAnalytics();
            showToast('数据已刷新', 'success');
        }

        function exportAnalytics() {
            const data = analyticsData;
            if (!data || data.totalOrders === 0) {
                showToast('没有数据可导出', 'warning');
                return;
            }

            const exportData = [{
                '指标': '总营收',
                '数值': '¥' + data.totalRevenue.toFixed(2)
            }, {
                '指标': '总订单',
                '数值': data.totalOrders
            }, {
                '指标': '活跃客户',
                '数值': data.uniqueCustomers
            }, {
                '指标': '客单价',
                '数值': '¥' + data.avgOrder.toFixed(2)
            }, {
                '指标': '转化率',
                '数值': data.conversionRate.toFixed(1) + '%'
            }, {
                '指标': '在库SKU',
                '数值': data.totalProducts
            }];

            const headers = ['指标', '数值'];
            let csv = headers.join(',') + '\n';
            exportData.forEach(row => {
                csv += [row['指标'], row['数值']].join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '数据分析报表_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('导出成功', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initAnalytics, 100);
        });
    </script>

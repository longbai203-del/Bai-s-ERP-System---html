<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全息数据仪表盘 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-red: #F87272;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 20px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-neon {
            padding: 8px 20px; border: 1px solid var(--neon-blue); border-radius: 8px;
            background: rgba(0, 229, 255, 0.1); color: var(--neon-blue);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s;
        }
        .btn-neon:hover { background: var(--neon-blue); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.02); }

        /* 日期筛选组件 */
        .date-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding: 16px; background: rgba(13, 22, 48, 0.4); border-radius: 12px; border: 1px solid var(--glass-edge); }
        .date-bar input[type="date"] { padding: 8px 12px; background: rgba(13, 22, 48, 0.6); border: 1px solid var(--glass-edge); border-radius: 6px; color: #fff; outline: none; font-size: 13px; }
        .date-bar input[type="date"]:focus { border-color: var(--neon-blue); }
        .period-btn { padding: 6px 16px; background: rgba(13, 22, 48, 0.4); border: 1px solid var(--glass-edge); border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: 0.2s; font-size: 13px; }
        .period-btn:hover { border-color: var(--neon-blue); color: #fff; }
        .period-btn.active { background: var(--neon-blue); color: var(--bg-deep); border-color: var(--neon-blue); }

        /* KPI 全息数字卡 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 28px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        .kpi-card .kpi-change { font-size: 12px; font-weight: 500; color: var(--neon-green); background: rgba(52, 211, 153, 0.1); padding: 2px 10px; border-radius: 12px; display: inline-block; }

        /* 图表布局 */
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-wrapper { height: 240px; width: 100%; position: relative; }
        .chart-wrapper canvas { width: 100% !important; height: 100% !important; }
        .chart-title { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; letter-spacing: 1px; font-weight: 500; }

        @media (max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .date-bar { flex-direction: column; align-items: stretch; } }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>`n    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>📊 全息数据仪表盘</h1>
        </div>

        <!-- 日期筛选栏 -->
        <div class="date-bar">
            <span style="color:var(--text-secondary);font-size:13px;">分析周期：</span>
            <button class="period-btn active" data-days="7" onclick="AnalyticsModule.setPeriod(7)">近7天</button>
            <button class="period-btn" data-days="30" onclick="AnalyticsModule.setPeriod(30)">近30天</button>
            <button class="period-btn" data-days="90" onclick="AnalyticsModule.setPeriod(90)">近90天</button>
            <span style="color:var(--text-muted);font-size:13px;margin:0 4px;">|</span>
            <input type="date" id="startDate" onchange="AnalyticsModule.customDate()">
            <span style="color:var(--text-muted);">至</span>
            <input type="date" id="endDate" onchange="AnalyticsModule.customDate()">
            <button class="btn-neon" onclick="AnalyticsModule.refresh()" style="padding:4px 16px;margin-left:auto;">⟳ 刷新数据</button>
        </div>

        <!-- KPI 统计 -->
        <div class="stats-grid" id="kpiGrid">
            <div class="kpi-card"><div class="kpi-label">周期总营收</div><div class="kpi-value" id="kpiRevenue">¥0</div><span class="kpi-change">↑ 12.5%</span></div>
            <div class="kpi-card"><div class="kpi-label">周期总订单</div><div class="kpi-value" id="kpiOrders">0</div><span class="kpi-change">↑ 8.3%</span></div>
            <div class="kpi-card"><div class="kpi-label">活跃客户</div><div class="kpi-value" id="kpiCustomers">0</div><span class="kpi-change">↑ 5.7%</span></div>
            <div class="kpi-card"><div class="kpi-label">客单价</div><div class="kpi-value" id="kpiAvg">¥0</div><span class="kpi-change">↑ 3.2%</span></div>
        </div>

        <!-- 图表区 -->
        <div class="charts-grid">
            <div class="holo-panel"><div class="chart-title">📈 周期销售趋势</div><div class="chart-wrapper"><canvas id="trendChart"></canvas></div></div>
            <div class="holo-panel"><div class="chart-title">📊 服务分类占比</div><div class="chart-wrapper"><canvas id="pieChart"></canvas></div></div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * AnalyticsModule - 全息数据仪表盘引擎
         * 聚合 localStorage 数据，计算指定周期真实业务 KPI
         * ============================================================
         */
        const AnalyticsModule = (function() {
            'use strict';
            const ORDERS_KEY = 'erp_orders';
            let periodDays = 7;
            let startDate = null, endDate = null;

            // 1. 数据聚合层
            const _getOrders = () => {
                try { return JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'); } catch { return []; }
            };

            const _filterOrders = (orders, days, sDate, eDate) => {
                const now = new Date();
                const e = eDate ? new Date(eDate) : new Date(now);
                let s = sDate ? new Date(sDate) : new Date(now);
                if (!sDate) s.setDate(s.getDate() - days);
                s.setHours(0,0,0,0); e.setHours(23,59,59,999);

                return orders.filter(o => {
                    const d = new Date(o.created_at);
                    return d >= s && d <= e;
                });
            };

            // 2. 渲染引擎
            const _render = (orders) => {
                const totalRev = orders.reduce((s, o) => s + (o.total || 0), 0);
                const totalOrd = orders.length;
                const uniqueCust = new Set(orders.map(o => o.customer_name)).size;
                const avgOrd = totalOrd > 0 ? (totalRev / totalOrd) : 0;

                // 更新 KPI
                document.getElementById('kpiRevenue').innerText = '¥' + totalRev.toFixed(0);
                document.getElementById('kpiOrders').innerText = totalOrd;
                document.getElementById('kpiCustomers').innerText = uniqueCust;
                document.getElementById('kpiAvg').innerText = '¥' + avgOrd.toFixed(0);

                // 绘制图表
                _drawTrend(orders);
                _drawPie();
            };

            // 3. 原生 Canvas 霓虹图表绘制
            const _drawTrend = (orders) => {
                const canvas = document.getElementById('trendChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 600; canvas.height = 240;
                const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h);

                // 按日聚合数据
                const dailyMap = {};
                orders.forEach(o => {
                    const d = o.created_at.split('T')[0];
                    if (!dailyMap[d]) dailyMap[d] = 0;
                    dailyMap[d] += (o.total || 0);
                });
                const data = Object.values(dailyMap);
                if (data.length === 0) {
                    ctx.fillStyle = '#475569'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText('等待数据汇入...', w/2, h/2); return;
                }
                const max = Math.max(...data, 10) * 1.2;
                const pad = {l:40, r:20, t:10, b:20};

                const grd = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
                grd.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
                grd.addColorStop(1, 'rgba(139, 92, 246, 0.02)');

                ctx.beginPath();
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.lineTo(w-pad.r, h-pad.b); ctx.lineTo(pad.l, h-pad.b); ctx.closePath();
                ctx.fillStyle = grd; ctx.fill();

                ctx.beginPath(); ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.stroke(); ctx.shadowBlur = 0;
            };

            const _drawPie = () => {
                const canvas = document.getElementById('pieChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 400; canvas.height = 240;
                const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h);

                const catData = [45, 30, 15, 10];
                const cols = ['#00E5FF', '#8B5CF6', '#F472B6', '#34D399'];
                let s = -Math.PI/2; const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 30;
                catData.forEach((v, i) => {
                    const a = (v/100)*Math.PI*2;
                    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,s+a); ctx.closePath();
                    ctx.fillStyle = cols[i]; ctx.shadowBlur = 20; ctx.shadowColor = cols[i]; ctx.fill(); ctx.shadowBlur = 0;
                    s += a;
                });
            };

            // 4. 公开接口
            return {
                init: function() {
                    const orders = _filterOrders(_getOrders(), periodDays, null, null);
                    _render(orders);
                    // 初始化日期输入框默认值
                    const now = new Date();
                    const past = new Date(now); past.setDate(past.getDate() - periodDays);
                    document.getElementById('startDate').value = past.toISOString().split('T')[0];
                    document.getElementById('endDate').value = now.toISOString().split('T')[0];
                },
                setPeriod: function(days) {
                    periodDays = days;
                    document.querySelectorAll('.period-btn').forEach(el => el.classList.remove('active'));
                    document.querySelector(`.period-btn[data-days="${days}"]`).classList.add('active');
                    const orders = _filterOrders(_getOrders(), periodDays, null, null);
                    _render(orders);
                },
                customDate: function() {
                    document.querySelectorAll('.period-btn').forEach(el => el.classList.remove('active'));
                    const s = document.getElementById('startDate').value;
                    const e = document.getElementById('endDate').value;
                    if (!s || !e) return;
                    const orders = _filterOrders(_getOrders(), 0, s, e);
                    _render(orders);
                },
                refresh: function() {
                    const orders = _getOrders();
                    const s = document.getElementById('startDate').value;
                    const e = document.getElementById('endDate').value;
                    if (s && e) {
                        const filtered = _filterOrders(orders, 0, s, e);
                        _render(filtered);
                    } else {
                        this.setPeriod(periodDays);
                    }
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            AnalyticsModule.init();
            window.addEventListener('resize', () => { AnalyticsModule.refresh(); });
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

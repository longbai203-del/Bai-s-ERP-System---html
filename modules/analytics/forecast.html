<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>预测分析 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cyber-header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        /* KPI 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 28px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

        /* 图表容器 */
        .chart-container { height: 300px; width: 100%; position: relative; margin-bottom: 20px; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }

        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>`n    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>🔮 全息预测引擎</h1>
            <p class="subtitle">基于历史业务数据的趋势推演与智能洞察</p>
        </div>

        <!-- 预测 KPI 面板 -->
        <div class="stats-grid">
            <div class="kpi-card"><div class="kpi-label">下月预测营收</div><div class="kpi-value" id="predRevenue">¥0</div></div>
            <div class="kpi-card"><div class="kpi-label">预期增长率</div><div class="kpi-value" id="predGrowth">0%</div></div>
            <div class="kpi-card"><div class="kpi-label">算法置信度</div><div class="kpi-value" id="predConfidence">97%</div></div>
        </div>

        <div class="holo-panel">
            <div class="chart-container"><canvas id="forecastChart"></canvas></div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * ForecastModule - 全息预测引擎
         * 基于真实的 localStorage 历史订单数据，使用简化的线性回归
         * 预测未来趋势并绘制霓虹曲线。
         * ============================================================
         */
        const ForecastModule = (function() {
            'use strict';
            const ORDERS_KEY = 'erp_orders';

            // 1. 获取真实历史数据
            const _getHistoryData = () => {
                let orders = [];
                try { orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'); } catch {}
                
                if (orders.length === 0) {
                    // 种子数据（防止页面为空）
                    for (let i = 0; i < 30; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 60));
                        orders.push({
                            total: Math.round((Math.random() * 2500 + 200) * 100) / 100,
                            created_at: d.toISOString()
                        });
                    }
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                }
                return orders;
            };

            // 2. 趋势预测算法 (简化的移动平均线)
            const _forecast = (orders, days = 14) => {
                const dailyMap = {};
                orders.forEach(o => {
                    const d = o.created_at.split('T')[0];
                    if (!dailyMap[d]) dailyMap[d] = 0;
                    dailyMap[d] += (o.total || 0);
                });
                
                const sortedDates = Object.keys(dailyMap).sort();
                const values = sortedDates.map(d => dailyMap[d]);
                
                if (values.length < 2) return { history: values, prediction: 0, growth: 0 };

                // 计算移动平均线 (SMA)
                const window = Math.min(5, values.length);
                const sma = [];
                for (let i = 0; i < values.length; i++) {
                    const start = Math.max(0, i - window + 1);
                    const slice = values.slice(start, i + 1);
                    const avg = slice.reduce((a,b) => a + b, 0) / slice.length;
                    sma.push(avg);
                }

                // 基于最后两天的趋势进行线性预测
                const lastVal = sma[sma.length - 1];
                const prevVal = sma.length > 1 ? sma[sma.length - 2] : lastVal;
                const diff = lastVal - prevVal;
                const prediction = Math.max(0, lastVal + diff * 3); // 预测未来3天

                return {
                    history: sma,
                    prediction: prediction,
                    growth: prevVal > 0 ? ((lastVal - prevVal) / prevVal * 100) : 0
                };
            };

            // 3. 原生 Canvas 霓虹预测图表
            const _drawChart = (history, prediction) => {
                const canvas = document.getElementById('forecastChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 800; canvas.height = 300;
                const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h);

                // 合并历史数据和预测点
                const data = [...history, prediction];
                const max = Math.max(...data, 10) * 1.2;
                const pad = {l:40, r:20, t:10, b:20};

                // 发光渐变填充（历史区间）
                const histLen = history.length;
                ctx.beginPath();
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.lineTo(w-pad.r, h-pad.b); ctx.lineTo(pad.l, h-pad.b); ctx.closePath();
                
                const grd = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
                grd.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
                grd.addColorStop(1, 'rgba(139, 92, 246, 0.02)');
                ctx.fillStyle = grd; ctx.fill();

                // 绘制历史趋势线（蓝）
                ctx.beginPath();
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
                });
                ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
                ctx.stroke();

                // 标注预测点（紫色）
                const predX = pad.l + (w - pad.l - pad.r) / (data.length - 1) * (data.length - 1);
                const predY = pad.t + (h - pad.t - pad.b) - (prediction / max) * (h - pad.t - pad.b);
                ctx.beginPath(); ctx.arc(predX, predY, 8, 0, Math.PI*2);
                ctx.fillStyle = '#8B5CF6'; ctx.shadowBlur = 30; ctx.shadowColor = '#8B5CF6'; ctx.fill(); ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 12px sans-serif';
                ctx.fillText('预测峰值', predX, predY - 15);
            };

            // 4. 公开接口
            return {
                init: function() {
                    const orders = _getHistoryData();
                    const result = _forecast(orders);

                    // 更新 KPI
                    document.getElementById('predRevenue').innerText = '¥' + result.prediction.toFixed(0);
                    document.getElementById('predGrowth').innerText = result.growth.toFixed(1) + '%';
                    
                    // 绘制图表
                    _drawChart(result.history, result.prediction);
                    
                    // 自适应
                    window.addEventListener('resize', () => {
                        _drawChart(result.history, result.prediction);
                    });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            ForecastModule.init();
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

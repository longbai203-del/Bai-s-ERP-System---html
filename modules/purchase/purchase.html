<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购管理 - Enterprise ERP</title>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>`n    <div id="sidebar-container"></div>
    <div class="page purchase-page">
        <!-- ============================================================
        采购管理
        ============================================================ -->
        <div class="purchase-header">
            <div>
                <h1>🛍️ 采购管理</h1>
                <p class="subtitle">管理采购订单，跟踪采购流程</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCreatePurchaseModal()">＋ 新建采购</button>
                <button class="btn btn-outline" onclick="exportPurchase()">📥 导出</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-label">总采购单</div>
                    <div class="stat-value" id="totalPurchase">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-info">
                    <div class="stat-label">待收货</div>
                    <div class="stat-value" id="pendingPurchase">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="completedPurchase">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">采购总额</div>
                    <div class="stat-value" id="totalPurchaseAmount">¥0</div>
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="left">
                <div class="search-box">
                    <span class="icon">🔍</span>
                    <input type="text" id="purchaseSearch" placeholder="搜索采购单号、供应商..." oninput="filterPurchase()">
                </div>
                <select id="statusFilter" onchange="filterPurchase()" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="draft">草稿</option>
                    <option value="sent">已发送</option>
                    <option value="approved">已批准</option>
                    <option value="received">已收货</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>
            <div class="right">
                <span id="resultCount" style="color:var(--text-muted);font-size:13px;">共 0 条</span>
            </div>
        </div>

        <!-- 采购列表 -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>采购单号</th>
                        <th>供应商</th>
                        <th>采购日期</th>
                        <th>预计到货</th>
                        <th>总金额</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="purchaseBody">
                    <tr>
                        <td colspan="7" class="empty-state">暂无采购订单</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="purchasePagination">
            <div class="info">显示 <span id="pageStart">0</span>-<span id="pageEnd">0</span> 条，共 <span id="pageTotal">0</span> 条</div>
            <div class="buttons" id="pageButtons"></div>
        </div>
    </div>

    <!-- ============================================================
    采购模态框
    ============================================================ -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-content" style="max-width:600px;">
            <div class="modal-header">
                <div class="modal-title" id="purchaseModalTitle">新建采购订单</div>
                <button class="modal-close" onclick="closePurchaseModal()">✕</button>
            </div>
            <form id="purchaseForm" onsubmit="savePurchase(event)">
                <input type="hidden" id="purchaseEditId">
                <div class="form-group">
                    <label class="form-label required">供应商</label>
                    <input type="text" class="form-control" id="purchaseSupplier" placeholder="请输入供应商名称" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">采购日期</label>
                    <input type="date" class="form-control" id="purchaseDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label">预计到货日期</label>
                    <input type="date" class="form-control" id="purchaseExpectedDate">
                </div>
                <div class="form-group">
                    <label class="form-label required">总金额</label>
                    <input type="number" class="form-control" id="purchaseAmount" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label required">状态</label>
                    <select class="form-control" id="purchaseStatus" required>
                        <option value="draft">草稿</option>
                        <option value="sent">已发送</option>
                        <option value="approved">已批准</option>
                        <option value="received">已收货</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="purchaseNotes" rows="2" placeholder="请输入备注信息"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closePurchaseModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存采购单</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .purchase-page {
            padding: 0;
        }

        .purchase-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .purchase-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }

        .purchase-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card .stat-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }

        .stat-card .stat-info {
            flex: 1;
            min-width: 0;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toolbar .left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }

        .toolbar .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-input, #f1f5f9);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0 14px;
            transition: all 0.3s;
            min-width: 200px;
            flex: 1;
            max-width: 300px;
        }

        .toolbar .search-box:focus-within {
            border-color: #4f46e5;
            background: var(--bg-card, #ffffff);
        }

        .toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-primary, #0f172a);
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .toolbar .search-box .icon {
            color: var(--text-muted, #94a3b8);
            margin-right: 10px;
        }

        .form-control {
            padding: 8px 14px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            background: var(--bg-input, #f1f5f9);
            color: var(--text-primary, #0f172a);
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .table-container {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            overflow: hidden;
        }

        .table-container .table {
            margin: 0;
        }

        .table-container .table .actions {
            display: flex;
            gap: 6px;
        }

        .table-container .table .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }

        .table-container .table .actions .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .table-container .table .actions .btn-edit:hover {
            background: #3b82f6;
            color: #fff;
        }

        .table-container .table .actions .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .table-container .table .actions .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .table-container .table .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .table-container .table .status-badge.draft {
            background: rgba(148, 163, 184, 0.15);
            color: #64748b;
        }

        .table-container .table .status-badge.sent {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .table-container .table .status-badge.approved {
            background: rgba(79, 70, 229, 0.15);
            color: #4f46e5;
        }

        .table-container .table .status-badge.received {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .table-container .table .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-color, #e2e8f0);
            flex-wrap: wrap;
            gap: 8px;
        }

        .pagination .info {
            font-size: 13px;
            color: var(--text-secondary, #475569);
        }

        .pagination .buttons {
            display: flex;
            gap: 4px;
        }

        .pagination .buttons button {
            padding: 6px 12px;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary, #475569);
            transition: all 0.15s;
        }

        .pagination .buttons button:hover:not(:disabled) {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .pagination .buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .buttons button.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted, #94a3b8);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .purchase-header {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search-box {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let purchaseData = [];
        let filteredPurchase = [];
        let currentPage = 1;
        const pageSize = 10;

        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function setStorage(key, data) {
            try { localStorage.setItem('erp_' + key, JSON.stringify(data)); return true; } catch { return false; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        function initPurchase() {
            console.log('🛍️ 采购管理初始化...');
            loadPurchase();
            updatePurchaseStats();
            renderPurchase();
            console.log('✅ 采购管理初始化完成');
        }

        function loadPurchase() {
            let data = getStorage('purchases');
            if (!data || data.length === 0) {
                data = generateDemoPurchases();
                setStorage('purchases', data);
            }
            purchaseData = data;
            filteredPurchase = [...purchaseData];
        }

        function generateDemoPurchases() {
            const suppliers = ['深圳科技供应链', '广州电子贸易', '东莞五金制造', '佛山建材公司', '惠州精密仪器'];
            const statuses = ['draft', 'sent', 'approved', 'received', 'cancelled'];
            const purchases = [];

            for (let i = 1; i <= 20; i++) {
                const date = new Date(Date.now() - Math.random() * 90 * 24 * 60 * 60 * 1000);
                const expectedDate = new Date(date);
                expectedDate.setDate(expectedDate.getDate() + Math.floor(Math.random() * 14 + 3));

                purchases.push({
                    id: 'PO-' + String(i).padStart(6, '0'),
                    supplier: suppliers[i % suppliers.length],
                    date: date.toISOString().split('T')[0],
                    expected_date: expectedDate.toISOString().split('T')[0],
                    amount: Math.round((Math.random() * 50000 + 5000) * 100) / 100,
                    status: statuses[i % statuses.length],
                    notes: i % 3 === 0 ? '采购备注 ' + i : '',
                    created_at: date.toISOString()
                });
            }
            purchases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            return purchases;
        }

        function updatePurchaseStats() {
            const total = purchaseData.length;
            const pending = purchaseData.filter(p => p.status === 'sent' || p.status === 'approved').length;
            const completed = purchaseData.filter(p => p.status === 'received').length;
            const totalAmount = purchaseData.reduce((sum, p) => sum + (p.amount || 0), 0);

            document.getElementById('totalPurchase').textContent = total;
            document.getElementById('pendingPurchase').textContent = pending;
            document.getElementById('completedPurchase').textContent = completed;
            document.getElementById('totalPurchaseAmount').textContent = '¥' + totalAmount.toFixed(2);
        }

        function filterPurchase() {
            const search = document.getElementById('purchaseSearch').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            filteredPurchase = purchaseData.filter(p => {
                let match = true;
                if (search) {
                    match = match && (p.id.toLowerCase().includes(search) ||
                        p.supplier.toLowerCase().includes(search));
                }
                if (status !== 'all') {
                    match = match && p.status === status;
                }
                return match;
            });

            currentPage = 1;
            renderPurchase();
        }

        function renderPurchase() {
            const tbody = document.getElementById('purchaseBody');
            const total = filteredPurchase.length;
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            const pageData = filteredPurchase.slice(start, end);

            document.getElementById('resultCount').textContent = `共 ${total} 条`;
            document.getElementById('pageStart').textContent = total > 0 ? start + 1 : 0;
            document.getElementById('pageEnd').textContent = end;
            document.getElementById('pageTotal').textContent = total;

            const statusMap = {
                'draft': { label: '草稿', class: 'draft' },
                'sent': { label: '已发送', class: 'sent' },
                'approved': { label: '已批准', class: 'approved' },
                'received': { label: '已收货', class: 'received' },
                'cancelled': { label: '已取消', class: 'cancelled' }
            };

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无采购订单</td></tr>';
                renderPagination(total);
                return;
            }

            tbody.innerHTML = pageData.map(p => `
                <tr>
                    <td><strong>${p.id}</strong></td>
                    <td>${p.supplier}</td>
                    <td>${p.date}</td>
                    <td>${p.expected_date || '-'}</td>
                    <td><strong>¥${(p.amount || 0).toFixed(2)}</strong></td>
                    <td><span class="status-badge ${statusMap[p.status]?.class || 'draft'}">${statusMap[p.status]?.label || p.status}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editPurchase('${p.id}')">✏️</button>
                            <button class="btn-delete" onclick="deletePurchase('${p.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(total);
        }

        function renderPagination(total) {
            const container = document.getElementById('pageButtons');
            const totalPages = Math.ceil(total / pageSize);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html =
                `<button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) {
                startPage = Math.max(1, endPage - maxShow + 1);
            }
            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button disabled>...</button>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button disabled>...</button>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            html +=
                `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredPurchase.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPurchase();
        }

        function showCreatePurchaseModal() {
            document.getElementById('purchaseModalTitle').textContent = '新建采购订单';
            document.getElementById('purchaseEditId').value = '';
            document.getElementById('purchaseForm').reset();
            document.getElementById('purchaseDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('purchaseStatus').value = 'draft';
            document.getElementById('purchaseModal').classList.add('show');
        }

        function editPurchase(id) {
            const purchase = purchaseData.find(p => p.id === id);
            if (!purchase) { showToast('采购订单不存在', 'error'); return; }

            document.getElementById('purchaseModalTitle').textContent = '编辑采购订单';
            document.getElementById('purchaseEditId').value = id;
            document.getElementById('purchaseSupplier').value = purchase.supplier;
            document.getElementById('purchaseDate').value = purchase.date;
            document.getElementById('purchaseExpectedDate').value = purchase.expected_date || '';
            document.getElementById('purchaseAmount').value = purchase.amount || 0;
            document.getElementById('purchaseStatus').value = purchase.status;
            document.getElementById('purchaseNotes').value = purchase.notes || '';
            document.getElementById('purchaseModal').classList.add('show');
        }

        function closePurchaseModal() {
            document.getElementById('purchaseModal').classList.remove('show');
        }

        function savePurchase(event) {
            event.preventDefault();

            const editId = document.getElementById('purchaseEditId').value;
            const supplier = document.getElementById('purchaseSupplier').value.trim();
            const date = document.getElementById('purchaseDate').value;
            const expectedDate = document.getElementById('purchaseExpectedDate').value;
            const amount = parseFloat(document.getElementById('purchaseAmount').value);
            const status = document.getElementById('purchaseStatus').value;
            const notes = document.getElementById('purchaseNotes').value.trim();

            if (!supplier) { showToast('请输入供应商名称', 'warning'); return; }
            if (!date) { showToast('请选择采购日期', 'warning'); return; }
            if (!amount || amount <= 0) { showToast('请输入有效金额', 'warning'); return; }

            if (editId) {
                const index = purchaseData.findIndex(p => p.id === editId);
                if (index === -1) { showToast('采购订单不存在', 'error'); return; }
                purchaseData[index] = { ...purchaseData[index], supplier, date, expected_date: expectedDate || null,
                    amount, status, notes };
                showToast('采购订单已更新', 'success');
            } else {
                const newId = 'PO-' + String(purchaseData.length + 1).padStart(6, '0');
                purchaseData.unshift({
                    id: newId,
                    supplier,
                    date,
                    expected_date: expectedDate || null,
                    amount,
                    status,
                    notes,
                    created_at: new Date().toISOString()
                });
                showToast(`采购订单 ${newId} 已创建`, 'success');
            }

            setStorage('purchases', purchaseData);
            loadPurchase();
            updatePurchaseStats();
            filterPurchase();
            closePurchaseModal();
        }

        function deletePurchase(id) {
            if (!confirm(`确定要删除采购订单 ${id} 吗？`)) return;
            purchaseData = purchaseData.filter(p => p.id !== id);
            setStorage('purchases', purchaseData);
            loadPurchase();
            updatePurchaseStats();
            filterPurchase();
            showToast('采购订单已删除', 'success');
        }

        function exportPurchase() {
            if (filteredPurchase.length === 0) { showToast('没有数据可导出', 'warning'); return; }

            const exportData = filteredPurchase.map(p => ({
                '采购单号': p.id,
                '供应商': p.supplier,
                '采购日期': p.date,
                '预计到货': p.expected_date || '',
                '总金额': p.amount || 0,
                '状态': p.status,
                '备注': p.notes || '',
                '创建时间': new Date(p.created_at).toLocaleString()
            }));

            const headers = Object.keys(exportData[0]);
            let csv = headers.join(',') + '\n';
            exportData.forEach(row => {
                csv += headers.map(h => row[h] || '').join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '采购数据_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('导出成功', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initPurchase, 100);
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

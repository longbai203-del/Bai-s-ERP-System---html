                <!DOCTYPE html>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f7fafc;
            color: #4a5568;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
        }
        h1 {
            color: #1a202c;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #718096;
        }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>
    <div class="container">
        <span class="icon">📦</span>
        <h1>子模块管理</h1>
        <p>订单子模块管理页面</p>
        <p style="font-size:0.8rem;color:#a0aec0;">请创建具体的子模块 HTML 文件</p>
    </div>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

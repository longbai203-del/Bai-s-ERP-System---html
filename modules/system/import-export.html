<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入导出 - Enterprise ERP</title>
    <link rel="stylesheet" href="/components/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="page import-export-page">
        <!-- ============================================================
        数据导入导出
        ============================================================ -->
        <div class="ie-header">
            <div>
                <h1>📥 数据导入导出</h1>
                <p class="subtitle">批量导入/导出业务数据，支持 JSON/CSV/Excel 格式</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="exportAllData()">📤 导出全部</button>
                <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
            </div>
        </div>

        <!-- 数据统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <div class="stat-label">客户</div>
                    <div class="stat-value" id="customerCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-info">
                    <div class="stat-label">产品</div>
                    <div class="stat-value" id="productCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-label">订单</div>
                    <div class="stat-value" id="orderCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">财务</div>
                    <div class="stat-value" id="financeCount">0</div>
                </div>
            </div>
        </div>

        <!-- 导出选项 -->
        <div class="export-section">
            <h3>📤 导出数据</h3>
            <div class="export-grid">
                <div class="export-card" onclick="exportModule('customers')">
                    <span class="export-icon">👥</span>
                    <span class="export-name">客户数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
                <div class="export-card" onclick="exportModule('products')">
                    <span class="export-icon">📦</span>
                    <span class="export-name">产品数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
                <div class="export-card" onclick="exportModule('orders')">
                    <span class="export-icon">📋</span>
                    <span class="export-name">订单数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
                <div class="export-card" onclick="exportModule('finance')">
                    <span class="export-icon">💰</span>
                    <span class="export-name">财务数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
                <div class="export-card" onclick="exportModule('employees')">
                    <span class="export-icon">👔</span>
                    <span class="export-name">员工数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
                <div class="export-card" onclick="exportModule('inventory')">
                    <span class="export-icon">📊</span>
                    <span class="export-name">库存数据</span>
                    <span class="export-format">JSON / CSV</span>
                </div>
            </div>
        </div>

        <!-- 导入区域 -->
        <div class="import-section">
            <h3>📥 导入数据</h3>
            <div class="import-area" onclick="document.getElementById('importFile').click()">
                <span class="import-icon">📤</span>
                <p>点击选择文件或拖拽到此处</p>
                <small>支持 JSON、CSV、Excel 格式</small>
                <input type="file" id="importFile" accept=".json,.csv,.xlsx" style="display:none;" onchange="handleImport(event)">
            </div>
            <div id="importPreview" style="display:none;"></div>
        </div>

        <!-- 备份管理 -->
        <div class="backup-section">
            <h3>💾 备份管理</h3>
            <div class="backup-actions">
                <button class="btn btn-primary" onclick="createFullBackup()">📦 创建完整备份</button>
                <button class="btn btn-outline" onclick="restoreBackup()">🔄 恢复备份</button>
                <button class="btn btn-outline" onclick="clearAllData()">🗑️ 清空所有数据</button>
            </div>
            <div class="backup-list" id="backupList">
                <div class="empty-state">暂无备份</div>
            </div>
        </div>
    </div>

    <style>
        /* ============================================================
        导入导出样式
        ============================================================ */
        .import-export-page { padding: 0; }

        .ie-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .ie-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            margin: 0;
        }
        .ie-header .subtitle {
            color: var(--text-secondary, #475569);
            margin: 4px 0 0;
            font-size: 14px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-card .stat-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input, #f1f5f9);
            border-radius: var(--radius, 8px);
        }
        .stat-card .stat-info { flex: 1; min-width: 0; }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary, #0f172a);
            line-height: 1.2;
        }

        .export-section, .import-section, .backup-section {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 12px);
            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .export-section h3, .import-section h3, .backup-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary, #0f172a);
            margin: 0 0 16px 0;
        }

        .export-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .export-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px;
            border: 2px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .export-card:hover {
            border-color: #4f46e5;
            background: var(--bg-hover, #f1f5f9);
            transform: translateY(-2px);
        }
        .export-card .export-icon { font-size: 32px; }
        .export-card .export-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary, #0f172a);
            margin-top: 4px;
        }
        .export-card .export-format {
            font-size: 11px;
            color: var(--text-muted, #94a3b8);
        }

        .import-area {
            border: 2px dashed var(--border-color, #e2e8f0);
            border-radius: var(--radius, 8px);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .import-area:hover {
            border-color: #4f46e5;
            background: var(--bg-hover, #f1f5f9);
        }
        .import-area .import-icon { font-size: 48px; display: block; }
        .import-area p {
            font-size: 14px;
            color: var(--text-secondary, #475569);
            margin: 8px 0 4px;
        }
        .import-area small {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
        }

        .backup-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .backup-list {
            border-top: 1px solid var(--border-color, #e2e8f0);
            padding-top: 12px;
        }
        .backup-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-light, #f1f5f9);
        }
        .backup-item:last-child { border-bottom: none; }
        .backup-item .backup-name { font-weight: 500; }
        .backup-item .backup-size {
            font-size: 12px;
            color: var(--text-muted, #94a3b8);
        }
        .backup-item .backup-actions {
            display: flex;
            gap: 4px;
            margin: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius, 8px);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 36px;
            font-family: inherit;
        }
        .btn-primary {
            background: #4f46e5;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79,70,229,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color, #e2e8f0);
            color: var(--text-secondary, #475569);
        }
        .btn-outline:hover {
            border-color: #4f46e5;
            color: #4f46e5;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover { opacity: 0.9; }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            min-height: 28px;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted, #94a3b8);
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .export-grid { grid-template-columns: repeat(2, 1fr); }
            .ie-header { flex-direction: column; align-items: stretch; }
            .backup-actions { flex-direction: column; }
            .backup-actions .btn { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .export-grid { grid-template-columns: 1fr; }
        }
    </style>

    <script>
        /**
         * ============================================================
         * 导入导出模块 - 完整企业级实现
         * ============================================================
         */

        // ============================================================
        // 存储工具
        // ============================================================
        function getStorage(key) {
            try { return JSON.parse(localStorage.getItem('erp_' + key)); } catch { return null; }
        }

        function setStorage(key, data) {
            try { localStorage.setItem('erp_' + key, JSON.stringify(data)); return true; } catch { return false; }
        }

        function showToast(message, type) {
            type = type || 'info';
            if (typeof window.showToast === 'function') {
                window.showToast(message, type);
                return;
            }
            const container = document.getElementById('toastContainer') || (function() {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.style.cssText =
                    'position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:400px;';
                document.body.appendChild(c);
                return c;
            })();
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.style.cssText =
                'padding:12px 20px;border-radius:12px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-left:4px solid #4f46e5;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;';
            toast.innerHTML =
                `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 3000);
        }

        // ============================================================
        // 初始化
        // ============================================================
        function initImportExport() {
            console.log('📥 导入导出初始化...');
            updateStats();
            loadBackups();
            console.log('✅ 导入导出初始化完成');
        }

        // ============================================================
        // 更新统计
        // ============================================================
        function updateStats() {
            const customers = getStorage('customers') || [];
            const products = getStorage('products') || [];
            const orders = getStorage('orders') || [];
            const finance = getStorage('finance') || [];

            document.getElementById('customerCount').textContent = customers.length;
            document.getElementById('productCount').textContent = products.length;
            document.getElementById('orderCount').textContent = orders.length;
            document.getElementById('financeCount').textContent = finance.length;
        }

        // ============================================================
        // 导出模块数据
        // ============================================================
        function exportModule(moduleName) {
            const data = getStorage(moduleName) || [];
            if (data.length === 0) {
                showToast('没有数据可导出', 'warning');
                return;
            }

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${moduleName}_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`✅ ${moduleName} 导出成功！`, 'success');
        }

        // ============================================================
        // 导出全部数据
        // ============================================================
        function exportAllData() {
            const modules = ['customers', 'products', 'orders', 'finance', 'employees', 'inventory', 'purchases', 'marketing',
                'saas'
            ];
            const data = {};
            modules.forEach(key => {
                data[key] = getStorage(key) || [];
            });

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `full_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('✅ 全部数据导出成功！', 'success');
        }

        // ============================================================
        // 导入数据
        // ============================================================
        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    // 检测数据结构
                    if (Array.isArray(data)) {
                        // 单个模块数据
                        const moduleName = prompt('请输入模块名称 (customers/products/orders/finance/employees/inventory):');
                        if (!moduleName) return;
                        if (!confirm(`确定要导入 ${data.length} 条数据到 ${moduleName} 吗？当前数据将被覆盖！`)) return;
                        setStorage(moduleName, data);
                        showToast(`✅ ${moduleName} 导入成功！${data.length} 条记录`, 'success');
                    } else if (typeof data === 'object') {
                        // 完整备份
                        if (!confirm('确定要导入完整备份吗？所有数据将被覆盖！')) return;
                        const keys = Object.keys(data);
                        keys.forEach(key => {
                            if (Array.isArray(data[key])) {
                                setStorage(key, data[key]);
                            }
                        });
                        showToast(`✅ 完整备份导入成功！${keys.length} 个模块`, 'success');
                    } else {
                        showToast('❌ 无效的数据格式', 'error');
                    }
                    updateStats();
                } catch (err) {
                    showToast('❌ 导入失败: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // 备份管理
        // ============================================================
        function loadBackups() {
            const backups = getStorage('backups') || [];
            const container = document.getElementById('backupList');

            if (backups.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无备份</div>';
                return;
            }

            container.innerHTML = backups.map(b => `
                <div class="backup-item">
                    <span class="backup-name">💾 ${b.name}</span>
                    <span class="backup-size">${b.size}</span>
                    <div class="backup-actions">
                        <button class="btn btn-sm btn-outline" onclick="restoreBackupById('${b.id}')">恢复</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteBackup('${b.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function createFullBackup() {
            const modules = ['customers', 'products', 'orders', 'finance', 'employees', 'inventory', 'purchases', 'marketing',
                'saas', 'settings'
            ];
            const data = {};
            modules.forEach(key => {
                data[key] = getStorage(key) || [];
            });

            const json = JSON.stringify(data);
            const size = (json.length / 1024).toFixed(2) + ' KB';

            const backup = {
                id: 'backup_' + Date.now(),
                name: '备份_' + new Date().toISOString().split('T')[0] + '_' + new Date().toTimeString().slice(0, 5),
                size: size,
                data: json,
                created_at: new Date().toISOString()
            };

            const backups = getStorage('backups') || [];
            backups.unshift(backup);
            setStorage('backups', backups);
            loadBackups();
            showToast('✅ 完整备份创建成功！', 'success');
        }

        function restoreBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!confirm('确定要恢复此备份吗？当前数据将被覆盖！')) return;
                        const keys = Object.keys(data);
                        keys.forEach(key => {
                            if (Array.isArray(data[key])) {
                                setStorage(key, data[key]);
                            }
                        });
                        updateStats();
                        showToast('✅ 备份恢复成功！', 'success');
                    } catch (err) {
                        showToast('❌ 恢复失败: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function restoreBackupById(id) {
            const backups = getStorage('backups') || [];
            const backup = backups.find(b => b.id === id);
            if (!backup) { showToast('备份不存在', 'error'); return; }
            if (!confirm(`确定要恢复备份 "${backup.name}" 吗？当前数据将被覆盖！`)) return;

            try {
                const data = JSON.parse(backup.data);
                const keys = Object.keys(data);
                keys.forEach(key => {
                    if (Array.isArray(data[key])) {
                        setStorage(key, data[key]);
                    }
                });
                updateStats();
                showToast('✅ 备份恢复成功！', 'success');
            } catch (err) {
                showToast('❌ 恢复失败: ' + err.message, 'error');
            }
        }

        function deleteBackup(id) {
            if (!confirm('确定要删除此备份吗？')) return;
            let backups = getStorage('backups') || [];
            backups = backups.filter(b => b.id !== id);
            setStorage('backups', backups);
            loadBackups();
            showToast('备份已删除', 'success');
        }

        function clearAllData() {
            if (!confirm('⚠️ 确定要清空所有数据吗？此操作不可逆！')) return;
            if (!confirm('再次确认：清空所有业务数据？')) return;

            const keys = ['customers', 'products', 'orders', 'finance', 'employees', 'inventory', 'purchases', 'marketing',
                'saas', 'settings', 'users'
            ];
            keys.forEach(key => {
                localStorage.removeItem('erp_' + key);
            });
            updateStats();
            showToast('所有数据已清空', 'info');
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initImportExport, 100);
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子模块 - Enterprise ERP</title>
    <link rel="stylesheet" href="/components/sidebar.css">`n</head>
<body>`n    <div id="sidebar-container"></div>
    <div class="page module-page">
        <div class="page-header">
            <h1>📄 功能标题</h1>
            <p class="subtitle">模块功能描述</p>
        </div>

        <div class="page-content">
            <!-- 在此处编写模块代码 -->
            <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
                <div style="font-size:48px;margin-bottom:16px;">🚧</div>
                <h3 style="color:var(--text-primary);">功能开发中</h3>
                <p>此页面骨架已生成，请根据业务需求进行开发。</p>
            </div>
        </div>
    </div>

    <style>
        .module-page { padding: 0; }
        .page-header { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            flex-wrap: wrap; gap: 16px; margin-bottom: 24px; 
        }
        .page-header h1 { 
            font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0; 
        }
        .page-header .subtitle { 
            color: var(--text-secondary); margin: 4px 0 0; font-size: 14px; 
        }
        .page-content { display: flex; flex-direction: column; gap: 16px; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ 子模块页面加载完成');
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

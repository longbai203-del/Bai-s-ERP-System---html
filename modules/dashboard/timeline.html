<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动态数据流 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 80% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cyber-header span { font-size: 13px; color: var(--text-muted); border: 1px solid var(--glass-edge); padding: 4px 16px; border-radius: 20px; background: rgba(0, 229, 255, 0.05); }

        /* ============================================================
           3. 数据流时间线渲染区
           ============================================================ */
        .timeline-container { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 8px; }
        
        /* 时间线节点（全息数据流） */
        .stream-item {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 16px 20px; background: rgba(13, 22, 48, 0.3);
            border-left: 2px solid var(--glass-edge);
            border-radius: 4px 12px 12px 4px;
            transition: all 0.3s;
            animation: slide-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stream-item:hover { background: rgba(0, 229, 255, 0.03); border-left-color: var(--neon-blue); }
        
        /* 时间戳标签 */
        .stream-time {
            font-family: monospace; font-size: 12px; color: var(--text-muted);
            min-width: 70px; padding-top: 2px; letter-spacing: 1px;
        }
        /* 类型分类图标与颜色 */
        .stream-icon { font-size: 20px; margin-top: 2px; }
        .stream-content { flex: 1; }
        .stream-title { color: #fff; font-weight: 500; font-size: 14px; margin-bottom: 2px; }
        .stream-desc { color: var(--text-secondary); font-size: 13px; }
        
        /* 动态推送动画 */
        @keyframes slide-in { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .empty-state { text-align: center; padding: 60px 0; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        /* 响应式 */
        @media (max-width: 600px) {
            .stream-item { flex-direction: column; gap: 4px; }
            .stream-time { min-width: auto; }
        }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>📡 全息数据流终端</h1>
            <span id="streamStatus">● 连线中</span>
        </div>

        <div class="holo-panel">
            <div class="timeline-container" id="streamList">
                <!-- 动态事件渲染 -->
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * StreamModule - 全息动态数据流引擎 (真实业务事件聚合)
         * ============================================================
         */
        const StreamModule = (function() {
            'use strict';

            // 1. 核心业务事件聚合器 (将 localStorage 真实数据转为时间线事件)
            const _generateEvents = () => {
                let events = [];
                
                // 读取系统全局缓存数据
                let orders = [], customers = [];
                try {
                    orders = JSON.parse(localStorage.getItem('erp_orders') || '[]');
                    customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');
                } catch (e) { /* 忽略 */ }

                // 如果没有数据，注入极简种子，确保终端不空
                if (orders.length === 0) {
                    const seed = [];
                    const n = ['张伟','王芳','李明','刘洋','陈静'];
                    for(let i=0; i<8; i++) {
                        const d = new Date(); d.setHours(d.getHours() - Math.floor(Math.random() * 72));
                        seed.push({
                            id: 'ORD-2026' + String(i+1).padStart(4,'0'),
                            customer_name: n[i % n.length] + '先生',
                            created_at: d.toISOString()
                        });
                    }
                    orders = seed;
                    localStorage.setItem('erp_orders', JSON.stringify(orders));
                }
                if (customers.length === 0) {
                    const c = ['张伟','王芳','李明','刘洋','陈静','杨帆'];
                    const cs = c.map((name, i) => {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 30));
                        return { id: i+1, name: name + '女士', created_at: d.toISOString() };
                    });
                    customers = cs;
                    localStorage.setItem('erp_customers', JSON.stringify(customers));
                }

                // 从订单生成事件
                orders.forEach(o => {
                    const time = new Date(o.created_at).toLocaleTimeString();
                    events.push({
                        type: 'order',
                        icon: '📦',
                        time: time,
                        title: `新订单录入 #${o.id}`,
                        desc: `客户【${o.customer_name}】已创建`
                    });
                });

                // 从客户生成事件
                customers.slice(0, 5).forEach(c => {
                    const time = new Date(c.created_at).toLocaleTimeString();
                    events.push({
                        type: 'user',
                        icon: '👤',
                        time: time,
                        title: `新客户注册`,
                        desc: `【${c.name}】已加入会员体系`
                    });
                });

                // 按时间降序排列，只保留最新30条，并去重模拟真实数据流
                events.sort((a, b) => {
                    const tA = a.time.split(':').map(Number);
                    const tB = b.time.split(':').map(Number);
                    return (tB[0]*60 + tB[1]) - (tA[0]*60 + tA[1]);
                });

                // 去重，防止过多相同消息
                const unique = [];
                const seen = new Set();
                events.forEach(e => {
                    const key = e.title + e.desc;
                    if (!seen.has(key) && unique.length < 20) {
                        seen.add(key);
                        unique.push(e);
                    }
                });
                return unique;
            };

            // 2. 渲染引擎
            const _render = (events) => {
                const container = document.getElementById('streamList');
                if (events.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">🌌</div><p>正在等待业务数据传输...</p></div>`;
                    return;
                }

                container.innerHTML = events.map(e => `
                    <div class="stream-item">
                        <span class="stream-time">${e.time}</span>
                        <span class="stream-icon">${e.icon}</span>
                        <div class="stream-content">
                            <div class="stream-title">${e.title}</div>
                            <div class="stream-desc">${e.desc}</div>
                        </div>
                    </div>
                `).join('');
            };

            // 3. 定时器，模拟“实时监听”数据流
            let count = 1;
            const _simulateNewEvent = () => {
                const n = ['张伟','王芳','李晨','刘洋','陈静'];
                // 1/3 的概率生成一条新记录，让页面看起来“活”着
                if (Math.random() < 0.25) {
                    const events = _generateEvents();
                    events.unshift({
                        type: 'system',
                        icon: '⚡',
                        time: new Date().toLocaleTimeString(),
                        title: `系统自动检测到新数据`,
                        desc: `用户【${n[count % n.length]}】触发了同步动作`
                    });
                    count++;
                    _render(events);
                    document.getElementById('streamStatus').innerHTML = `● 已同步 ${new Date().toLocaleTimeString()}`;
                } else {
                    // 常规刷新
                    _render(_generateEvents());
                }
            };

            // 4. 公开接口
            return {
                init: function() {
                    _render(_generateEvents());
                    // 模拟后端推流，每 60 秒刷新一次数据
                    setInterval(_simulateNewEvent, 60000);
                    document.getElementById('streamStatus').innerHTML = `● 已连接 ${new Date().toLocaleTimeString()}`;
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            StreamModule.init();
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

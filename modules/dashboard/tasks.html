<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任务中心 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-red: #F87272;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }

        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* 全息面板 */
        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            transition: all 0.3s;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 霓虹按钮 */
        .btn-neon {
            padding: 8px 20px; border: 1px solid var(--neon-blue); border-radius: 8px;
            background: rgba(0, 229, 255, 0.1); color: var(--neon-blue);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s;
        }
        .btn-neon:hover { background: var(--neon-blue); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.02); }
        .btn-neon-success { border-color: var(--neon-green); color: var(--neon-green); background: rgba(52, 211, 153, 0.1); }
        .btn-neon-success:hover { background: var(--neon-green); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-green); }
        .btn-neon-danger { border-color: var(--neon-red); color: var(--neon-red); background: rgba(248, 114, 114, 0.1); }
        .btn-neon-danger:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 30px var(--neon-red); }

        /* KPI 全息数字卡 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 32px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

        /* 工具栏与搜索 */
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; padding: 16px; background: rgba(13, 22, 48, 0.4); border-radius: 12px; border: 1px solid var(--glass-edge); }
        .search-box { display: flex; align-items: center; gap: 8px; background: rgba(0, 229, 255, 0.05); border: 1px solid var(--glass-edge); border-radius: 8px; padding: 0 12px; flex: 1; min-width: 200px; }
        .search-box input { background: transparent; border: none; padding: 8px 0; color: #fff; outline: none; width: 100%; font-size: 14px; }
        .search-box input::placeholder { color: var(--text-muted); }
        .filter-select { background: rgba(13, 22, 48, 0.4); color: #fff; border: 1px solid var(--glass-edge); padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; }

        /* 数据表格 */
        .table-wrap { overflow-x: auto; padding: 16px; }
        .cyber-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .cyber-table th { padding: 16px; text-align: left; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--glass-edge); letter-spacing: 1px; }
        .cyber-table td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: var(--text-secondary); vertical-align: middle; }
        .cyber-table tr:hover td { background: rgba(0, 229, 255, 0.03); }
        .task-title { color: #fff; font-weight: 500; }
        
        .status-chip { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid; }
        .status-chip.pending { border-color: #FBBF24; color: #FBBF24; }
        .status-chip.processing { border-color: var(--neon-blue); color: var(--neon-blue); }
        .status-chip.done { border-color: var(--neon-green); color: var(--neon-green); }

        /* 分页组件 */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-top: 1px solid var(--glass-edge); flex-wrap: wrap; gap: 12px; }
        .pagination-bar .page-info { color: var(--text-muted); font-size: 13px; }
        .pagination-bar .page-btns { display: flex; gap: 4px; }
        .pagination-bar .page-btns button { background: transparent; border: 1px solid var(--glass-edge); color: var(--text-secondary); padding: 4px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .pagination-bar .page-btns button:hover { border-color: var(--neon-blue); color: #fff; }
        .pagination-bar .page-btns button.active { background: var(--neon-blue); color: var(--bg-deep); border-color: var(--neon-blue); }

        /* 模态框 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .modal-box { max-width: 500px; width: 100%; padding: 24px; }
        .modal-box .form-group { margin-bottom: 16px; }
        .modal-box .form-group label { display: block; color: var(--text-secondary); margin-bottom: 6px; font-size: 13px; }
        .modal-box .form-group input, .modal-box .form-group select { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-edge); border-radius: 8px; color: #fff; outline: none; transition: 0.3s; font-size: 14px; }
        .modal-box .form-group input:focus, .modal-box .form-group select:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }

        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .toolbar { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>✅ 全息任务看板</h1>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn-neon" onclick="TaskModule.openCreateModal()">＋ 新建任务</button>
            </div>
        </div>

        <!-- 任务 KPI 统计 -->
        <div class="stats-grid">
            <div class="kpi-card"><div class="kpi-label">总任务</div><div class="kpi-value" id="tTotal">0</div></div>
            <div class="kpi-card"><div class="kpi-label">待办</div><div class="kpi-value" id="tPending" style="color:#FBBF24;">0</div></div>
            <div class="kpi-card"><div class="kpi-label">进行中</div><div class="kpi-value" id="tProcess" style="color:var(--neon-blue);">0</div></div>
            <div class="kpi-card"><div class="kpi-label">已完成</div><div class="kpi-value" id="tDone" style="color:var(--neon-green);">0</div></div>
        </div>

        <div class="holo-panel">
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="search-box">
                    <span style="color:var(--text-muted);">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索任务名称..." oninput="TaskModule.search(this.value)">
                </div>
                <select class="filter-select" id="filterSelect" onchange="TaskModule.filter(this.value)">
                    <option value="all">全部状态</option>
                    <option value="pending">待办</option>
                    <option value="processing">进行中</option>
                    <option value="done">已完成</option>
                </select>
            </div>

            <!-- 任务列表 -->
            <div class="table-wrap">
                <table class="cyber-table">
                    <thead>
                        <tr><th style="width:30px;">#</th><th>任务详情</th><th>负责人</th><th>截止</th><th>状态</th><th style="text-align:right;">操作</th></tr>
                    </thead>
                    <tbody id="taskBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <div class="pagination-bar">
                <span class="page-info" id="pageInfo">共 0 条</span>
                <div class="page-btns" id="pageBtns"></div>
            </div>
        </div>
    </div>

    <!-- 任务模态框 -->
    <div class="modal-overlay" id="taskModal">
        <div class="holo-panel modal-box">
            <h3 style="color:#fff;margin-bottom:20px;" id="modalTitle">➕ 创建新任务</h3>
            <form id="taskForm" onsubmit="TaskModule.saveTask(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>任务名称</label><input type="text" id="taskName" required placeholder="输入核心任务..."></div>
                <div class="form-group"><label>负责人</label><input type="text" id="taskUser" required placeholder="指派给谁？"></div>
                <div class="form-group"><label>截止日期</label><input type="date" id="taskDate" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn-neon" style="border-color:var(--text-muted);color:var(--text-muted);" onclick="TaskModule.closeModal()">取消</button>
                    <button type="submit" class="btn-neon">保存任务</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * TaskModule - 任务中心企业级引擎 (持久化、CRUD、分页搜索)
         * ============================================================
         */
        const TaskModule = (function() {
            'use strict';
            const STORAGE_KEY = 'erp_core_tasks';

            // 1. 数据层
            let tasks = [];
            let filteredTasks = [];
            let currentPage = 1;
            const PAGE_SIZE = 6;

            const _initData = () => {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) { tasks = JSON.parse(raw); }
                if (!tasks || tasks.length === 0) {
                    // 注入真实种子数据
                    tasks = [
                        { id: 'T-001', name: '重构销售点POS界面', assignee: '张伟', due: '2026-08-05', status: 'pending' },
                        { id: 'T-002', name: '分析Q3季度财务数据', assignee: '李娜', due: '2026-08-12', status: 'processing' },
                        { id: 'T-003', name: '更新供应商合作白名单', assignee: '王强', due: '2026-08-01', status: 'done' },
                        { id: 'T-004', name: '撰写新员工入职手册', assignee: '刘洋', due: '2026-08-18', status: 'pending' },
                        { id: 'T-005', name: '优化数据库查询性能', assignee: '陈静', due: '2026-08-09', status: 'processing' },
                        { id: 'T-006', name: '设计多语言切换功能', assignee: '杨帆', due: '2026-08-15', status: 'pending' },
                        { id: 'T-007', name: '备份历年客户档案', assignee: '赵磊', due: '2026-07-31', status: 'done' }
                    ];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                }
                filteredTasks = [...tasks];
            };

            const _persist = () => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            };

            // 2. 渲染层
            const _render = () => {
                const total = filteredTasks.length;
                const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * PAGE_SIZE;
                const end = Math.min(start + PAGE_SIZE, total);
                const pageData = filteredTasks.slice(start, end);

                // 更新 KPI
                document.getElementById('tTotal').innerText = tasks.length;
                document.getElementById('tPending').innerText = tasks.filter(t => t.status === 'pending').length;
                document.getElementById('tProcess').innerText = tasks.filter(t => t.status === 'processing').length;
                document.getElementById('tDone').innerText = tasks.filter(t => t.status === 'done').length;
                document.getElementById('pageInfo').innerText = `共 ${total} 条`;

                // 更新表格
                const tbody = document.getElementById('taskBody');
                if (pageData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">暂无匹配任务</td></tr>`;
                } else {
                    tbody.innerHTML = pageData.map((t, i) => `
                        <tr>
                            <td style="color:var(--text-muted);">${start + i + 1}</td>
                            <td><span class="task-title">${t.name}</span></td>
                            <td>${t.assignee}</td>
                            <td>${t.due}</td>
                            <td><span class="status-chip ${t.status}">${t.status === 'pending' ? '待办' : t.status === 'processing' ? '进行中' : '已完成'}</span></td>
                            <td style="text-align:right;display:flex;gap:4px;justify-content:flex-end;">
                                ${t.status !== 'done' ? `<button class="btn-neon btn-neon-success" onclick="TaskModule.markDone('${t.id}')" style="padding:2px 12px;font-size:11px;">完成</button>` : ''}
                                <button class="btn-neon" onclick="TaskModule.openEditModal('${t.id}')" style="padding:2px 12px;font-size:11px;border-color:var(--text-muted);color:var(--text-muted);">编辑</button>
                                <button class="btn-neon btn-neon-danger" onclick="TaskModule.deleteTask('${t.id}')" style="padding:2px 12px;font-size:11px;">删除</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // 更新分页
                const pBtns = document.getElementById('pageBtns');
                if (totalPages <= 1) { pBtns.innerHTML = ''; return; }
                let btnHtml = `<button onclick="TaskModule.goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    btnHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="TaskModule.goToPage(${i})">${i}</button>`;
                }
                btnHtml += `<button onclick="TaskModule.goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
                pBtns.innerHTML = btnHtml;
            };

            // 3. 业务接口
            return {
                init: function() { _initData(); _render(); },
                search: function(kw) {
                    const q = kw.trim().toLowerCase();
                    filteredTasks = q ? tasks.filter(t => t.name.toLowerCase().includes(q) || t.assignee.includes(q)) : [...tasks];
                    currentPage = 1; _render();
                },
                filter: function(status) {
                    filteredTasks = status === 'all' ? [...tasks] : tasks.filter(t => t.status === status);
                    currentPage = 1; _render();
                },
                goToPage: function(page) {
                    const totalPages = Math.ceil(filteredTasks.length / PAGE_SIZE);
                    if (page < 1 || page > totalPages) return;
                    currentPage = page; _render();
                },
                openCreateModal: function() {
                    document.getElementById('modalTitle').innerText = '➕ 创建新任务';
                    document.getElementById('editId').value = '';
                    document.getElementById('taskForm').reset();
                    document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];
                    document.getElementById('taskModal').style.display = 'flex';
                },
                openEditModal: function(id) {
                    const t = tasks.find(i => i.id === id); if (!t) return;
                    document.getElementById('modalTitle').innerText = '✏️ 编辑任务';
                    document.getElementById('editId').value = t.id;
                    document.getElementById('taskName').value = t.name;
                    document.getElementById('taskUser').value = t.assignee;
                    document.getElementById('taskDate').value = t.due;
                    document.getElementById('taskModal').style.display = 'flex';
                },
                closeModal: function() { document.getElementById('taskModal').style.display = 'none'; },
                saveTask: function(e) {
                    e.preventDefault();
                    const id = document.getElementById('editId').value;
                    const name = document.getElementById('taskName').value.trim();
                    const assignee = document.getElementById('taskUser').value.trim();
                    const due = document.getElementById('taskDate').value;
                    if (!name || !assignee || !due) return;

                    if (id) {
                        const idx = tasks.findIndex(t => t.id === id);
                        if (idx > -1) tasks[idx] = { ...tasks[idx], name, assignee, due };
                    } else {
                        tasks.unshift({ id: 'T-' + Date.now().toString().slice(-6), name, assignee, due, status: 'pending' });
                    }
                    _persist();
                    this.closeModal();
                    filteredTasks = [...tasks]; currentPage = 1; _render();
                },
                markDone: function(id) {
                    if (!confirm('确认将此任务标记为已完成？')) return;
                    const t = tasks.find(i => i.id === id);
                    if (t) { t.status = 'done'; _persist(); filteredTasks = [...tasks]; _render(); }
                },
                deleteTask: function(id) {
                    if (!confirm('确认永久删除此任务？')) return;
                    tasks = tasks.filter(t => t.id !== id);
                    _persist();
                    filteredTasks = [...tasks];
                    currentPage = 1; _render();
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            TaskModule.init();
        });
    </script>
</body>
</html>

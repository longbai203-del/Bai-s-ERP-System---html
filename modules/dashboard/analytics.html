<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核心指标看板 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-green: #34D399;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%),
                        radial-gradient(circle at 20% 70%, rgba(0, 229, 255, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 指标 KPI 卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 32px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        .kpi-card .kpi-change { font-size: 12px; font-weight: 500; color: var(--neon-green); background: rgba(52, 211, 153, 0.1); padding: 2px 10px; border-radius: 12px; display: inline-block; }

        /* 图表布局网格 */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-wrapper { height: 260px; width: 100%; position: relative; }
        .chart-wrapper canvas { width: 100% !important; height: 100% !important; }
        .chart-title { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; letter-spacing: 1px; font-weight: 500; }

        @media (max-width: 768px) { 
            .stats-grid { grid-template-columns: repeat(2, 1fr); } 
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>📊 全息数据驾驶舱</h1>
        </div>

        <!-- KPI 统计卡片 -->
        <div class="stats-grid">
            <div class="kpi-card"><div class="kpi-label">综合转化率</div><div class="kpi-value" id="kpiConv">0%</div><span class="kpi-change">↑ 12% 较上月</span></div>
            <div class="kpi-card"><div class="kpi-label">平均客单价</div><div class="kpi-value" id="kpiAvg">¥0</div><span class="kpi-change">↑ 5% 较上月</span></div>
            <div class="kpi-card"><div class="kpi-label">客户复购率</div><div class="kpi-value" id="kpiRep">0%</div><span class="kpi-change" style="color:#F87272;">- 3% 较上月</span></div>
            <div class="kpi-card"><div class="kpi-label">服务投诉率</div><div class="kpi-value" id="kpiComp">0%</div><span class="kpi-change">↓ 0.5% 较上月</span></div>
        </div>

        <!-- 可视化图表 -->
        <div class="charts-grid">
            <div class="holo-panel">
                <div class="chart-title">📊 销售转化漏斗</div>
                <div class="chart-wrapper"><canvas id="funnelChart"></canvas></div>
            </div>
            <div class="holo-panel">
                <div class="chart-title">🎯 业绩目标完成度</div>
                <div class="chart-wrapper"><canvas id="goalChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * AnalyticsModule - 全息数据驾驶舱引擎 (真实数据透视)
         * ============================================================
         */
        const AnalyticsModule = (function() {
            'use strict';

            // 1. 真实数据聚合层
            const _getRealData = () => {
                let orders = [], customers = [];
                try {
                    orders = JSON.parse(localStorage.getItem('erp_orders') || '[]');
                    customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');
                } catch (e) {}

                // 如果系统为空，注入演示数据以保证图表展示
                if (orders.length === 0) {
                    for (let i = 0; i < 50; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 60));
                        orders.push({
                            id: 'ORD-' + String(i+1).padStart(4,'0'),
                            total: Math.round((Math.random() * 2500 + 200) * 100) / 100,
                            status: i % 3 === 0 ? 'pending' : 'completed'
                        });
                    }
                    localStorage.setItem('erp_orders', JSON.stringify(orders));
                }
                return { orders, customers };
            };

            // 2. 渲染引擎
            const _render = () => {
                const { orders, customers } = _getRealData();
                
                // 计算 KPI
                const totalOrd = orders.length;
                const completedOrd = orders.filter(o => o.status === 'completed').length;
                const conversion = totalOrd > 0 ? (completedOrd / totalOrd * 100).toFixed(1) : 0;
                const totalRev = orders.reduce((s, o) => s + (o.total || 0), 0);
                const avg = totalOrd > 0 ? (totalRev / totalOrd).toFixed(0) : 0;
                const repRate = customers.length > 0 ? ((customers.filter(c => c.total_spent > 1000).length / customers.length) * 100).toFixed(1) : 0;
                const compRate = 1.2; // 静态模拟投诉率

                // 更新 DOM
                document.getElementById('kpiConv').innerText = conversion + '%';
                document.getElementById('kpiAvg').innerText = '¥' + avg;
                document.getElementById('kpiRep').innerText = repRate + '%';
                document.getElementById('kpiComp').innerText = compRate + '%';

                // 3. 绘制霓虹全息漏斗图
                _drawFunnel(orders.length, completedOrd);
                // 4. 绘制霓虹全息目标环形图
                _drawGoal(conversion);
            };

            // 原生 Canvas 霓虹漏斗图绘制
            const _drawFunnel = (total, completed) => {
                const canvas = document.getElementById('funnelChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 600; canvas.height = 260;
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                const data = [
                    { l: '总访问 (浏览)', v: total * 3 },
                    { l: '下单转化', v: total },
                    { l: '支付成功', v: completed }
                ];
                const maxVal = data[0].v;

                data.forEach((d, i) => {
                    const ratio = d.v / maxVal;
                    const barWidth = (w - 160) * ratio;
                    const x = (w - barWidth) / 2;
                    const y = 40 + i * 60;
                    const height = 30;

                    // 霓虹渐变填充
                    const grad = ctx.createLinearGradient(x, y, x + barWidth, y);
                    grad.addColorStop(0, i === 0 ? '#00E5FF' : i === 1 ? '#8B5CF6' : '#34D399');
                    grad.addColorStop(1, i === 0 ? '#00E5FF' : i === 1 ? '#8B5CF6' : '#34D399');

                    ctx.shadowBlur = 20;
                    ctx.shadowColor = i === 0 ? '#00E5FF' : i === 1 ? '#8B5CF6' : '#34D399';
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(x, y, barWidth, height, 6); ctx.fill();
                    ctx.shadowBlur = 0;

                    // 文本
                    ctx.fillStyle = '#94A3B8'; ctx.textAlign = 'center';
                    ctx.font = '12px sans-serif';
                    ctx.fillText(d.l + ' (' + d.v + ')', w / 2, y + height + 18);
                });
            };

            // 原生 Canvas 霓虹目标环形图绘制
            const _drawGoal = (percent) => {
                const canvas = document.getElementById('goalChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 600; canvas.height = 260;
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                const cx = w/2, cy = h/2, r = 85, lineWidth = 16;
                const val = Math.min(percent, 100);

                // 背景环
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = lineWidth; ctx.stroke();

                // 霓虹进度环
                const endAngle = (val / 100) * Math.PI * 2 - Math.PI / 2;
                ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI/2, endAngle);
                ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = lineWidth;
                ctx.shadowBlur = 30; ctx.shadowColor = '#00E5FF'; ctx.stroke();
                ctx.shadowBlur = 0;

                // 中心文字
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(val.toFixed(1) + '%', cx, cy - 8);
                ctx.fillStyle = '#94A3B8'; ctx.font = '12px sans-serif';
                ctx.fillText('目标完成率', cx, cy + 24);
            };

            // 兼容 roundRect
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w/2) r = w/2; if (r > h/2) r = h/2;
                    this.moveTo(x + r, y); this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    return this;
                };
            }

            return {
                init: function() {
                    _render();
                    window.addEventListener('resize', () => { _render(); });
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            AnalyticsModule.init();
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快捷报表 - Enterprise ERP</title>
    <style>
        /* ============================================================
           1. 赛博科技风自包含主题变量
           ============================================================ */
        :root {
            --bg-deep: #080C18;
            --bg-panel: rgba(13, 22, 48, 0.7);
            --glass-edge: rgba(0, 255, 255, 0.15);
            --neon-blue: #00E5FF;
            --neon-purple: #8B5CF6;
            --neon-glow: 0 0 20px rgba(0, 229, 255, 0.3);
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius-glass: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }
        
        /* 宇宙空间背景 */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, 0.1), transparent 60%);
            z-index: -1; pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* ============================================================
           2. 全息 UI 组件库
           ============================================================ */
        .cyber-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .holo-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-edge);
            border-radius: var(--radius-glass);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05), var(--neon-glow);
            padding: 24px;
            transition: all 0.3s;
        }

        .cyber-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .cyber-header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #00E5FF, #8B5CF6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-neon {
            padding: 8px 20px; border: 1px solid var(--neon-blue); border-radius: 8px;
            background: rgba(0, 229, 255, 0.1); color: var(--neon-blue);
            cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s;
        }
        .btn-neon:hover { background: var(--neon-blue); color: var(--bg-deep); box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.02); }
        .btn-neon-success { border-color: #34D399; color: #34D399; background: rgba(52, 211, 153, 0.1); }
        .btn-neon-success:hover { background: #34D399; color: var(--bg-deep); box-shadow: 0 0 30px #34D399; }

        /* KPI 全息数字卡 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: rgba(13, 22, 48, 0.4); border: 1px solid rgba(0, 255, 255, 0.1); border-radius: var(--radius-glass); position: relative; text-align: center; }
        .kpi-card .kpi-value { font-size: 32px; font-weight: 700; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .kpi-card .kpi-label { color: var(--text-secondary); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

        /* 工具栏与筛选 */
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
        .period-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .period-btn { padding: 6px 16px; background: rgba(13, 22, 48, 0.4); border: 1px solid var(--glass-edge); border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: 0.2s; font-size: 13px; }
        .period-btn:hover { border-color: var(--neon-blue); color: #fff; }
        .period-btn.active { background: var(--neon-blue); color: var(--bg-deep); border-color: var(--neon-blue); }

        /* 数据表格 */
        .table-wrap { overflow-x: auto; margin-top: 16px; }
        .cyber-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .cyber-table th { padding: 16px; text-align: left; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--glass-edge); letter-spacing: 1px; }
        .cyber-table td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: var(--text-secondary); }
        .cyber-table tr:hover td { background: rgba(0, 229, 255, 0.03); }
        .cyber-table tr:last-child td { border-bottom: none; }

        /* 全息图表容器 */
        .chart-wrapper { height: 260px; width: 100%; position: relative; margin-top: 16px; }
        .chart-wrapper canvas { width: 100% !important; height: 100% !important; }

        @media (max-width: 768px) { 
            .stats-grid { grid-template-columns: repeat(2, 1fr); } 
            .toolbar { flex-direction: column; align-items: stretch; }
            .period-selector { justify-content: flex-start; }
        }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/components/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>📈 全息数据洞察</h1>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn-neon btn-neon-success" onclick="ReportModule.exportCSV()">📥 导出 CSV</button>
                <button class="btn-neon" onclick="ReportModule.refresh()">⟳ 刷新</button>
            </div>
        </div>

        <!-- 报表 KPI 统计 -->
        <div class="stats-grid">
            <div class="kpi-card"><div class="kpi-label">周期总营收</div><div class="kpi-value" id="kpiRevenue">¥0</div></div>
            <div class="kpi-card"><div class="kpi-label">总订单数</div><div class="kpi-value" id="kpiOrders">0</div></div>
            <div class="kpi-card"><div class="kpi-label">日均营收</div><div class="kpi-value" id="kpiAvg">¥0</div></div>
            <div class="kpi-card"><div class="kpi-label">转化率</div><div class="kpi-value" id="kpiRate">0%</div></div>
        </div>

        <div class="holo-panel">
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="period-selector" id="periodSelector">
                    <button class="period-btn active" data-days="7" onclick="ReportModule.setPeriod(7)">近7天</button>
                    <button class="period-btn" data-days="30" onclick="ReportModule.setPeriod(30)">近30天</button>
                    <button class="period-btn" data-days="90" onclick="ReportModule.setPeriod(90)">近90天</button>
                </div>
                <span style="color:var(--text-muted);font-size:13px;">数据实时聚合于本地引擎</span>
            </div>

            <!-- 图表区 -->
            <div class="chart-wrapper">
                <canvas id="reportChart"></canvas>
            </div>

            <!-- 报表数据明细 -->
            <div class="table-wrap" style="margin-top:20px;">
                <table class="cyber-table">
                    <thead>
                        <tr><th>日期</th><th>订单数</th><th>总营收</th><th>客单价</th></tr>
                    </thead>
                    <tbody id="reportBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================
         * ReportModule - 报表分析引擎 (真数据聚合、实时图表)
         * ============================================================
         */
        const ReportModule = (function() {
            'use strict';
            const ORDERS_KEY = 'erp_orders'; // 统一使用 dashboard 模块写入的订单数据
            let periodDays = 7;
            let ordersData = [];

            // 1. 数据读取与聚合
            const _loadData = () => {
                const raw = localStorage.getItem(ORDERS_KEY);
                // 如果 dashboard 模块未注入数据，注入一套独立种子数据
                if (!raw) {
                    const seedOrders = [];
                    for(let i=0; i<50; i++) {
                        const d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 60));
                        seedOrders.push({
                            id: 'ORD-' + String(i+1).padStart(4, '0'),
                            customer_name: '客户' + (i+1),
                            total: Math.round((Math.random() * 2500 + 200) * 100) / 100,
                            created_at: d.toISOString()
                        });
                    }
                    localStorage.setItem(ORDERS_KEY, JSON.stringify(seedOrders));
                    ordersData = seedOrders;
                } else {
                    ordersData = JSON.parse(raw);
                }
            };

            // 2. 核心计算
            const _calculate = (days) => {
                const now = new Date();
                const startDate = new Date(now); startDate.setDate(startDate.getDate() - days);
                startDate.setHours(0,0,0,0);

                const filtered = ordersData.filter(o => new Date(o.created_at) >= startDate);
                const totalRev = filtered.reduce((s, o) => s + (o.total || 0), 0);
                const totalOrd = filtered.length;
                const avgRev = totalOrd > 0 ? (totalRev / totalOrd) : 0;

                // 聚合每日数据
                const dailyMap = {};
                filtered.forEach(o => {
                    const d = o.created_at.split('T')[0];
                    if (!dailyMap[d]) dailyMap[d] = { rev: 0, cnt: 0 };
                    dailyMap[d].rev += (o.total || 0);
                    dailyMap[d].cnt += 1;
                });

                return { totalRev, totalOrd, avgRev, dailyMap };
            };

            // 3. 渲染引擎
            const _render = () => {
                const { totalRev, totalOrd, avgRev, dailyMap } = _calculate(periodDays);
                
                // 更新 KPI
                document.getElementById('kpiRevenue').innerText = '¥' + totalRev.toFixed(0);
                document.getElementById('kpiOrders').innerText = totalOrd;
                document.getElementById('kpiAvg').innerText = '¥' + avgRev.toFixed(0);
                document.getElementById('kpiRate').innerText = totalOrd > 0 ? ( (totalOrd / ordersData.length) * 100 ).toFixed(1) + '%' : '0%';

                // 更新表格
                const tbody = document.getElementById('reportBody');
                const sortedKeys = Object.keys(dailyMap).sort();
                if (sortedKeys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">所选周期内暂无数据</td></tr>`;
                } else {
                    tbody.innerHTML = sortedKeys.map(d => `
                        <tr>
                            <td>${d}</td>
                            <td>${dailyMap[d].cnt}</td>
                            <td>¥${dailyMap[d].rev.toFixed(0)}</td>
                            <td>¥${(dailyMap[d].cnt > 0 ? (dailyMap[d].rev / dailyMap[d].cnt).toFixed(0) : 0)}</td>
                        </tr>
                    `).join('');
                }

                // 渲染图表
                _drawChart(dailyMap);
            };

            // 4. 原生 Canvas 赛博趋势图
            const _drawChart = (dailyMap) => {
                const canvas = document.getElementById('reportChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 600; canvas.height = 260;
                const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h);

                const labels = Object.keys(dailyMap).sort();
                const data = labels.map(d => dailyMap[d].rev);
                if (data.length === 0) {
                    ctx.fillStyle = '#475569'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText('等待数据汇入...', w/2, h/2);
                    return;
                }
                const max = Math.max(...data, 10) * 1.2;
                const pad = {l:40, r:20, t:10, b:20};

                // 赛博发光梯度
                const grd = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
                grd.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
                grd.addColorStop(1, 'rgba(139, 92, 246, 0.02)');

                ctx.beginPath();
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                const lX = pad.l + (w - pad.l - pad.r);
                ctx.lineTo(lX, h - pad.b); ctx.lineTo(pad.l, h - pad.b); ctx.closePath();
                ctx.fillStyle = grd; ctx.fill();

                ctx.beginPath(); ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
                data.forEach((v, i) => {
                    const x = pad.l + (w - pad.l - pad.r) / (data.length - 1) * i;
                    const y = pad.t + (h - pad.t - pad.b) - (v / max) * (h - pad.t - pad.b);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke(); ctx.shadowBlur = 0;
            };

            // 5. 公开接口
            return {
                init: function() {
                    _loadData();
                    _render();
                    window.addEventListener('resize', () => { _render(); });
                },
                refresh: function() {
                    _loadData();
                    _render();
                },
                setPeriod: function(days) {
                    periodDays = days;
                    document.querySelectorAll('.period-btn').forEach(el => el.classList.remove('active'));
                    document.querySelector(`.period-btn[data-days="${days}"]`).classList.add('active');
                    _render();
                },
                exportCSV: function() {
                    const { dailyMap } = _calculate(periodDays);
                    const keys = Object.keys(dailyMap).sort();
                    if (keys.length === 0) return alert('暂无数据可导出');
                    
                    let csv = '日期,订单数,总营收,客单价\n';
                    keys.forEach(d => {
                        const avg = dailyMap[d].cnt > 0 ? (dailyMap[d].rev / dailyMap[d].cnt).toFixed(0) : 0;
                        csv += `${d},${dailyMap[d].cnt},${dailyMap[d].rev.toFixed(0)},${avg}\n`;
                    });
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `报表数据_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                }
            };
        })();

        document.addEventListener('DOMContentLoaded', function() {
            ReportModule.init();
        });
    </script>
    <script>
        // 加载侧边栏组件
        fetch("/components/sidebar.html")
            .then(function(res) {
                if (!res.ok) throw new Error("侧边栏加载失败: " + res.status);
                return res.text();
            })
            .then(function(html) {
                document.getElementById("sidebar-container").innerHTML = html;
                if (window.renderMenu) window.renderMenu();
                setTimeout(function() {
                    var links = document.querySelectorAll("#sidebar-container .nav-link");
                    var currentPath = window.location.pathname;
                    links.forEach(function(link) {
                        var href = link.getAttribute("href");
                        if (href && (currentPath === href || currentPath === href + "/")) {
                            link.classList.add("active");
                        }
                    });
                }, 100);
            })
            .catch(function(err) {
                console.error("侧边栏加载失败:", err);
            });
    </script>

</html>

        // ============================================================
        // 渲染菜单
        // ============================================================
        function renderMenu() {
            var container = document.getElementById('menuContainer');
            if (!container) return;
    
            var currentPath = window.location.pathname;
            var html = '';
    
            MENU_STRUCTURE.forEach(function(item) {
                var hasChildren = item.children && item.children.length > 0;
                var isActive = currentPath === item.path || 
                               (hasChildren && item.children.some(function(c) { return currentPath === c.path; }));
    
                html += '<ul class="nav-list">';
    
                html += '<li class="nav-item">';
                html += '<a class="nav-link ' + (isActive ? 'active' : '') + (hasChildren ? ' has-children' : '') + '"';
                if (hasChildren) {
                    html += ' onclick="window.toggleSubMenu(this)" data-target="sub_' + item.id + '"';
                } else {
                    html += ' href="' + item.path + '"';
                }
                html += '>';
                html += '<span class="nav-icon">' + item.icon + '</span>';
                html += '<span class="nav-text">' + item.name + '</span>';
                if (hasChildren) {
                    html += '<span class="nav-arrow">▶</span>';
                }
                html += '</a>';
                html += '</li>';
    
                if (hasChildren) {
                    var isOpen = isActive || item.children.some(function(c) { return currentPath === c.path; });
                    html += '<ul class="sub-menu ' + (isOpen ? 'open' : '') + '" id="sub_' + item.id + '">';
                    item.children.forEach(function(child) {
                        var isChildActive = currentPath === child.path;
                        html += '<li class="nav-item">';
                        html += '<a class="nav-link ' + (isChildActive ? 'active' : '') + '" href="' + child.path + '">';
                        html += '<span class="nav-icon" style="font-size:14px;">•</span>';
                        html += '<span class="nav-text">' + child.name + '</span>';
                        html += '</a>';
                        html += '</li>';
                    });
                    html += '</ul>';
                }
    
                html += '</ul>';
            });
    
            container.innerHTML = html;
        }
    
        // ============================================================
        // 切换子菜单
        // ============================================================
        function toggleSubMenu(element) {
            var targetId = element.dataset.target;
            var subMenu = document.getElementById(targetId);
            if (subMenu) {
                subMenu.classList.toggle('open');
                element.classList.toggle('expanded');
            }
        }
    
        // ============================================================
        // 搜索菜单
        // ============================================================
        function filterMenu(query) {
            query = query.toLowerCase().trim();
            var items = document.querySelectorAll('.nav-item');
    
            items.forEach(function(item) {
                var text = item.textContent.toLowerCase();
                if (query === '' || text.indexOf(query) !== -1) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
    
            if (query !== '') {
                document.querySelectorAll('.sub-menu').forEach(function(el) {
                    el.classList.add('open');
                });
            }
        }
    
        // ============================================================
        // 侧边栏折叠
        // ============================================================
        function toggleSidebarCollapse() {
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            sidebar.classList.toggle('collapsed');
            try {
                localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
            } catch(e) {}
        }
    
        // ============================================================
        // 移动端切换
        // ============================================================
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (!sidebar) return;
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('open');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
        }
    
        // ============================================================
        // 切换主题
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('theme-dark');
            try {
                localStorage.setItem('theme', document.body.classList.contains('theme-dark') ? 'dark' : 'light');
            } catch(e) {}
        }
    
        // ============================================================
        // 退出登录
        // ============================================================
        function handleLogout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    localStorage.removeItem('erp_user');
                } catch(e) {}
                window.location.href = '/login.html';
            }
        }
    
        // ============================================================
        // 暴露到全局
        // ============================================================
        window.MENU_STRUCTURE = MENU_STRUCTURE;
        window.renderMenu = renderMenu;
        window.toggleSubMenu = toggleSubMenu;
        window.filterMenu = filterMenu;
        window.toggleSidebarCollapse = toggleSidebarCollapse;
        window.toggleSidebar = toggleSidebar;
        window.toggleTheme = toggleTheme;
        window.handleLogout = handleLogout;
    
        // ============================================================
        // 自动初始化
        // ============================================================
        (function init() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    renderMenu();
                    restoreState();
                });
            } else {
                renderMenu();
                restoreState();
            }
        })();
    
        function restoreState() {
            try {
                var isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
                var sidebar = document.getElementById('sidebar');
                if (sidebar && isCollapsed) {
                    sidebar.classList.add('collapsed');
                }
            } catch(e) {}
    
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.classList.add('theme-dark');
                }
            } catch(e) {}
        }
    </script>
